    }).join('') : '<p class="empty">Geen partijen die op jouw bevestiging wachten.</p>';

    body.innerHTML = '<h1>Te bevestigen partijen</h1>' + cardsHtml;
    renderShell(null, body, 'spelen');

    body.querySelectorAll('button[data-act]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-id');
        var doc = S.db.doc('matches/' + id);
        var snap2 = await doc.get();
        var m = snap2.data();
        if (btn.getAttribute('data-act') === 'confirm') {
          m.participants = m.participants.map(function (p) { return p.playerId === S.playerId ? Object.assign({}, p, { confirmed: true }) : p; });
          var allConfirmed = m.participants.every(function (p) { return p.confirmed; });
          await doc.update({ participants: m.participants, status: allConfirmed ? 'confirmed' : 'pending' });
          if (allConfirmed) {
            await createPost({
              authorId: m.submittedBy, type: 'matchResult', clubId: m.clubId,
              participants: m.participants, score: m.score, winnerSide: m.winnerSide,
              sets: m.sets || null, rotating: !!m.rotating, guestNames: m.guestNames || {}
            });
            await refreshMyGroupChats(true);
          }
        } else {
          await doc.update({ status: 'disputed' });
        }
        viewPending();
      });
    });
  }

  // ---------- chat-views ----------

  function initialsOf(name) {
    name = (name || '').trim();
    if (!name) return '?';
    var parts = name.split(/\s+/);
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
  }

  async function viewChatList() {
    var snap = await S.db.collection('messages').get();
    var msgs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
      .filter(function (m) { return (m.senderId === S.playerId || m.recipientId === S.playerId) && !isHiddenForMe(m); });
    var byPartner = {};
    msgs.forEach(function (m) {
      var partner = m.senderId === S.playerId ? m.recipientId : m.senderId;
      if (!byPartner[partner] || byPartner[partner].createdAt < m.createdAt) byPartner[partner] = m;
    });
    var partners = Object.keys(byPartner).sort(function (a, b) { return byPartner[b].createdAt.localeCompare(byPartner[a].createdAt); });
    var readMap = await loadMyReadMap();
    // Naam/initialen per gesprek, klaar om te gebruiken in het volledig-scherm-voorbeeld
    // van de half-swipe hieronder (dat laadt de échte berichtenlijst pas bij het swipen).
    var previewData = {};
    var items = partners.map(function (pid) {
      var m = byPartner[pid];
      var cid = convId(S.playerId, pid);
      var mine = m.senderId === S.playerId;
      var unread = !mine && (!readMap[cid] || readMap[cid] < m.createdAt);
      var name = nameOf(pid), username = usernameOf(pid);
      var previewText = m.deletedForEveryone ? '🚫 Dit bericht is verwijderd'
        : (m.text ? (esc(m.text.slice(0, 60)) + (m.text.length > 60 ? '…' : '')) : (m.imageDataUrl ? '📷 Foto' : (m.videoUrl ? '🎬 Video' : '')));
      var preview = m.deletedForEveryone ? previewText : (mine ? 'Jij: ' : '') + previewText;
      previewData[pid] = { name: name, initials: initialsOf(name) };
      return { at: m.createdAt || '', html: '<div class="chatrow-wrap" data-pid="' + esc(pid) + '" data-search="' + esc((name + ' ' + username).toLowerCase()) + '">' +
        '<div class="chatrow' + (unread ? ' unread' : '') + '" tabindex="0" role="button" aria-label="Open gesprek met ' + esc(name) + '">' +
        '<span class="chatavatar">' + esc(initialsOf(name)) + '</span>' +
        '<span class="chatrow-main">' +
        '<span class="chatrow-top"><span class="chatrow-name">' + esc(name) + '</span><span class="chatrow-time">' + timeAgo(m.createdAt) + '</span></span>' +
        '<span class="chatrow-preview"><span>' + preview + '</span>' + (unread ? '<span class="chatrow-dot"></span>' : '') + '</span>' +
        '</span></div></div>' };
    });
    // Groepschats staan gewoon tussen de gewone gesprekken, gesorteerd op het laatste bericht.
    await refreshMyGroupChats(true);
    var groupChats = await loadMyGroupChats();
    var groupItems = await Promise.all(groupChats.map(async function (g) {
      var gm = (await loadGroupMessages(g.id)).filter(function (m) { return !isHiddenForMe(m); });
      var last = gm[gm.length - 1];
      var isFriend = g.sourceType === 'friendGroup';
      var memberNames = (g.memberIds || []).filter(function (id) { return id !== S.playerId; }).map(nameOf).join(', ');
      var rk = 'grp:' + g.id;
      var unread = !!last && last.senderId !== S.playerId && (!readMap[rk] || readMap[rk] < last.createdAt);
      var at = last ? last.createdAt : (g.createdAt || '');
      return { at: at || '', html: '<div class="chatrow-gwrap" data-search="' + esc(((g.title || '') + ' ' + memberNames).toLowerCase()) + '">' +
        '<a href="#/groepschat/' + esc(g.id) + '" class="chatrow' + (unread ? ' unread' : '') + '" style="text-decoration:none; color:inherit;">' +
        (isFriend ? '<span class="chatavatar duo" aria-hidden="true">👤👤</span>' : '<span class="chatavatar" style="background:var(--ball); color:var(--ball-ink);">🎾</span>') +
        '<span class="chatrow-main"><span class="chatrow-top"><span class="chatrow-name">' + esc(g.title || 'Partijchat') + '</span><span class="grp-tag">groep</span>' +
        '<span class="chatrow-time">' + (at ? timeAgo(at) : '') + '</span></span>' +
        '<span class="chatrow-preview"><span>' + esc(last ? groupPreviewText(last) : memberNames) + '</span>' + (unread ? '<span class="chatrow-dot"></span>' : '') + '</span></span></a></div>' };
    }));
    var rows = items.concat(groupItems).sort(function (x, y) { return (y.at || '').localeCompare(x.at || ''); })
      .map(function (x) { return x.html; }).join('') || '<p class="empty">Nog geen gesprekken. Tik op + voor aanbevolen spelers om mee te chatten.</p>';
    var body = el('<div class="stack"></div>');
    body.innerHTML =
      '<div class="chatlist-head"><h1>Berichten</h1><button type="button" class="composer-fab" id="newChatToggle" title="Nieuw gesprek" aria-label="Nieuw gesprek">+</button></div>' +
      '<div class="chatlist-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>' +
      '<input type="text" id="chatSearch" placeholder="Zoek een gesprek…"></div>' +
      '<div class="chatlist" id="chatListRows">' + rows + '</div>';
    renderShell(null, body, 'chat');

    // "+" opent een lijst met aanbevolen spelers (niveau, speelstijl, club) om mee te chatten,
    // met daaronder alle spelers op alfabet — één tik en het gesprek staat open.
    document.getElementById('newChatToggle').addEventListener('click', function () {
      openPlayerPickSheet('Nieuw gesprek', {
        recommend: true,
        intro: 'Spelers die bij jouw niveau en speelstijl passen staan bovenaan. Tik iemand aan om te chatten.' +
          (S.player.playStyle ? '' : ' Tip: vul je speelstijl in bij Profiel → Mijn gegevens voor betere aanbevelingen.')
      }, function (pid) { closeSheet(true); location.hash = '#/chat/' + pid; });
    });
    document.getElementById('chatSearch').addEventListener('input', function (ev) {
      var q = ev.target.value.trim().toLowerCase();
      document.querySelectorAll('#chatListRows .chatrow-wrap, #chatListRows .chatrow-gwrap').forEach(function (row) {
        row.hidden = q && row.getAttribute('data-search').indexOf(q) === -1;
      });
    });

    // Half-swipe (net als Snapchat): naar rechts swipen trekt een voorbeeldscherm over het
    // hele scherm, dat 1-op-1 met je vinger meebeweegt. Laat je los voor het gesprek écht
    // opent, dan schuift het weer dicht — de ander ziet dan niet dat je het gezien hebt.
    // Ga je ver genoeg door (of tik je op het gesprek), dan opent het écht en telt dat als "gelezen".
    document.querySelectorAll('#chatListRows .chatrow-wrap').forEach(function (wrap) {
      var content = wrap.querySelector('.chatrow');
      var pid = wrap.getAttribute('data-pid');
      var pd = previewData[pid];
      var cid = convId(S.playerId, pid);
      var startX = 0, startY = 0, dx = 0, dragging = false, horizontal = false, wasSwipe = false;
      var overlay = null, cachedBubblesHtml = null, msgsPromise = null;
      var OPEN_FRACTION = 0.4; // hoeveel van het scherm je moet doorslepen om echt te openen

      function viewportW() { return window.innerWidth || document.documentElement.clientWidth || 360; }
      function openThread() { location.hash = '#/chat/' + pid; }

      // Laadt het volledige gesprek (niet alleen het laatste bericht) zodat de peek er
      // echt als de hele chat uitziet — gecached zodat een tweede swipe meteen klaarstaat.
      function ensureMsgsLoaded() {
        if (!msgsPromise) {
          msgsPromise = S.db.collection('messages').where('conversationId', '==', cid).get().then(function (snap) {
            var msgs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
              .filter(function (m) { return !isHiddenForMe(m); })
              .sort(function (a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); });
            // Geen verwijderknop hier: de peek-overlay opent bij elke klik het echte gesprek,
            // dat zou botsen met een ⋯-knop op een los berichtje.
            cachedBubblesHtml = msgs.map(function (m) {
              return messageBubbleHtml(m, { mine: m.senderId === S.playerId, allowDelete: false });
            }).join('') || '<p class="empty">Nog geen berichten.</p>';
            return cachedBubblesHtml;
          });
        }
        return msgsPromise;
      }

      function buildOverlay() {
        var ov = el('<div class="chatpeek-overlay"></div>');
        ov.innerHTML =
          '<div class="chatpeek-head"><span class="chatavatar">' + esc(pd.initials) + '</span>' +
          '<div><div class="chatpeek-name">' + esc(pd.name) + '</div>' +
          '<div class="chatpeek-hint">Sleep verder of tik om te openen — dan ziet ' + esc(pd.name) + ' dat je het gelezen hebt</div></div></div>' +
          '<div class="chatthread-messages">' + (cachedBubblesHtml || '<p class="loading">Laden…</p>') + '</div>';
        document.body.appendChild(ov);
        ov.addEventListener('click', function () { openThread(); });
        var msgsWrap = ov.querySelector('.chatthread-messages');
        ensureMsgsLoaded().then(function (html) {
          if (!msgsWrap.isConnected) return;
          msgsWrap.innerHTML = html;
          msgsWrap.scrollTop = msgsWrap.scrollHeight;
        });
        return ov;
      }
      function closeOverlay() {
        if (!overlay) return;
        var ov = overlay; overlay = null;
        ov.classList.add('animate');
        requestAnimationFrame(function () { ov.style.transform = 'translateX(-100%)'; });
        setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 240);
      }

      content.addEventListener('pointerdown', function (ev) {
        if (ev.pointerType === 'mouse' && ev.button !== 0) return;
        startX = ev.clientX; startY = ev.clientY; dx = 0; dragging = true; horizontal = false;
        try { content.setPointerCapture(ev.pointerId); } catch (e) {}
        ensureMsgsLoaded(); // vast beginnen met laden, nog voordat we weten of het een swipe wordt
      });
      content.addEventListener('pointermove', function (ev) {
        if (!dragging) return;
        var curDx = ev.clientX - startX, curDy = ev.clientY - startY;
        if (!horizontal) {
          if (Math.abs(curDx) < 6 && Math.abs(curDy) < 6) return;
          if (Math.abs(curDx) <= Math.abs(curDy)) { dragging = false; return; }
          horizontal = true;
          overlay = buildOverlay();
        }
        var w = viewportW();
        dx = curDx < 0 ? 0 : (curDx > w ? w : curDx);
        overlay.style.transform = 'translateX(' + (dx - w) + 'px)';
        ev.preventDefault();
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        if (horizontal) {
          wasSwipe = true;
          var w = viewportW();
          if (dx >= w * OPEN_FRACTION) {
            if (overlay) { var ov = overlay; overlay = null; if (ov.parentNode) ov.parentNode.removeChild(ov); }
            openThread();
          } else {
            closeOverlay();
          }
        }
        dx = 0; horizontal = false;
      }
      content.addEventListener('pointerup', endDrag);
      content.addEventListener('pointercancel', function () {
        dragging = false; horizontal = false; dx = 0;
        closeOverlay();
      });
      content.addEventListener('click', function (ev) {
        if (wasSwipe) { wasSwipe = false; ev.preventDefault(); return; }
        openThread();
      });
      content.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openThread(); }
      });
    });
  }

  async function viewChatThread(otherId) {
    var other = S.playersById[otherId];
    if (!other) { location.hash = '#/chat'; return; }
    var cid = convId(S.playerId, otherId);
    // Het gesprek écht openen telt als "gelezen" — dit is het moment waarop de ander
    // (bij half-swipen in de lijst was dat nog niet zo) kan zien dat jij het gezien hebt.
    markConversationRead(otherId);
    var otherReadDoc = await S.db.doc('chatReads/' + cid + '__' + otherId).get();
    var otherReadAt = otherReadDoc.exists ? otherReadDoc.data().readAt : null;
    var snap = await S.db.collection('messages').where('conversationId', '==', cid).get();
    var msgs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
      .filter(function (m) { return !isHiddenForMe(m); })
      .sort(function (a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); });
    var lastMine = null;
    for (var i = msgs.length - 1; i >= 0; i--) { if (msgs[i].senderId === S.playerId) { lastMine = msgs[i]; break; } }
    // Status van "doe je mee?"-verzoeken in dit gesprek (per verzoek-id).
    var availState = {};
    var owners = {};
    msgs.forEach(function (m) { if (m.availRequest) owners[m.availRequest] = true; });
    for (var oid in owners) {
      try {
        var ad = await S.db.doc('availability/' + oid).get();
        if (!ad.exists) continue;
        var av = ad.data();
        if (!availIsCurrent(av)) continue;
        availState[av.requestId] = oid === S.playerId ? availStatus(av) : ((av.partnerStatus || {})[S.playerId] || 'gone');
      } catch (e) {}
    }
    var bubbles = msgs.map(function (m) {
      var mine = m.senderId === S.playerId;
      var statusLabel = (mine && m === lastMine) ? (' · ' + (otherReadAt && otherReadAt >= m.createdAt ? 'Geopend' : 'Verzonden')) : '';
      return messageBubbleHtml(m, { mine: mine, allowDelete: true, videoAsLink: true, availState: availState, statusLabel: '<span class="chatread-status">' + statusLabel + '</span>' });
    }).join('') || '<p class="empty">Nog geen berichten. Zeg hallo tegen ' + esc(other.name) + '!</p>';
    var body = el('<div class="fullscreen-page"></div>');
    body.innerHTML =

      '<span class="chatthread-avatar">' + esc(initialsOf(other.name)) + '</span>' +
      '<span><span class="chatthread-name">' + esc(other.name) + '</span><span class="chatthread-sub">@' + esc(other.username) + '</span></span>' +
      '</div>' +

      '</div>' +
      '<form id="msgForm" class="chatinput-bar">' +
      '<button type="button" class="chatinput-icon" id="chatCameraBtn" title="Foto maken" aria-label="Foto maken">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1-2h6l1 2h2.5A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9z"/><circle cx="12" cy="13" r="3.3"/></svg>' +
      '</button>' +

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4.3 16.2l4.7-4.7 3.2 3.2 3-3 4.5 4.5"/></svg>' +

    var pendingImage = null, pendingVideo = '';

      if (pendingImage) {
        previewBox.hidden = false;

          '<span class="small muted">Foto toegevoegd</span>' +

      } else {

      errBox.innerHTML = '';
      try {
        var img = await fileToCompressedDataUrl(fileInput.files[0]);
        if (img) {

          renderAttachPreview();

    }
    document.getElementById('chatCameraBtn').addEventListener('click', function () { cameraInput.click(); });
    document.getElementById('chatGalleryBtn').addEventListener('click', function () { libraryInput.click(); });
    cameraInput.addEventListener('change', function () { handleImagePick(cameraInput); });
    libraryInput.addEventListener('change', function () { handleImagePick(libraryInput); });

  // Peiling maken: kies een kant-en-klare vraag (tikken) of maak een eigen vraag.
  function openPollSheet(groupId, preset, onDone) {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() + i);
      days.push((i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : WEEKDAY_NAMES[d.getDay()].charAt(0).toUpperCase() + WEEKDAY_NAMES[d.getDay()].slice(1)) + ' ' + d.getDate() + '/' + (d.getMonth() + 1));
    }
    var TEMPLATES = {
      week: { q: 'Wie kan er deze week padellen?', options: days, multi: true },
      mee: { q: 'Doe je mee?', options: ['Ja 🎾', 'Nee', 'Misschien'], multi: false },
      tijd: { q: 'Hoe laat spelen we?', options: ['18:00', '19:30', '21:00'], multi: true },
      club: { q: 'Bij welke club spelen we?', options: ((S.player.homeClubIds || []).map(function (id) { return S.clubsById[id] ? S.clubsById[id].name : null; }).filter(Boolean).concat(['Maakt niet uit'])), multi: true },
      eigen: { q: '', options: ['', ''], multi: false }
    };
    var st = JSON.parse(JSON.stringify(TEMPLATES[preset] || TEMPLATES.mee));
    var sb = openSheet('Peiling maken',
      '<span class="field-label" style="margin-top:0;">Kies een vraag</span>' +
      chipChoiceHtml('tpl', [{ value: 'week', label: '🙋 Wie kan er?' }, { value: 'mee', label: 'Doe je mee?' }, { value: 'tijd', label: '⏰ Hoe laat?' }, { value: 'club', label: '📍 Welke club?' }, { value: 'eigen', label: '✏️ Eigen vraag' }], preset || 'mee') +
      '<div id="pollForm"></div>' +
      '<div id="pollErr"></div><button type="button" class="btn" id="pollSend" style="width:100%; justify-content:center;">Peiling plaatsen</button>');
    function render() {
      var f = sb.querySelector('#pollForm');
      f.innerHTML = '<span class="field-label">Vraag</span><input type="text" id="poll_q" maxlength="80" value="' + esc(st.q) + '" placeholder="Bijv. Zin in een potje zaterdag?">' +
        '<span class="field-label">Antwoorden</span>' + st.options.map(function (o, i) {
          return '<div class="poll-edit-row"><input type="text" data-opt="' + i + '" maxlength="40" value="' + esc(o) + '" placeholder="Antwoord ' + (i + 1) + '">' +
            (st.options.length > 2 ? '<button type="button" class="chip" data-del="' + i + '" aria-label="Verwijderen">✕</button>' : '') + '</div>';
        }).join('') +
        (st.options.length < 8 ? '<button type="button" class="chip add" id="pollAdd" style="margin-top:0.4rem;">+ Antwoord</button>' : '') +
        '<span class="field-label">Stemmen</span>' + chipChoiceHtml('multi', [{ value: '0', label: 'Eén keuze' }, { value: '1', label: 'Meerdere keuzes' }], st.multi ? '1' : '0');
      f.querySelector('#poll_q').addEventListener('input', function (e) { st.q = e.target.value; });
      f.querySelectorAll('[data-opt]').forEach(function (inp) { inp.addEventListener('input', function () { st.options[Number(inp.getAttribute('data-opt'))] = inp.value; }); });
      f.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { st.options.splice(Number(b.getAttribute('data-del')), 1); render(); }); });
      var add = f.querySelector('#pollAdd'); if (add) add.addEventListener('click', function () { st.options.push(''); render(); });
      wireChipChoice(f, 'multi', function (v) { st.multi = v === '1'; });
    }
    wireChipChoice(sb, 'tpl', function (v) { st = JSON.parse(JSON.stringify(TEMPLATES[v])); render(); });
    render();
    sb.querySelector('#pollSend').addEventListener('click', async function (ev) {
      var q = String(st.q || '').trim();
      var options = st.options.map(function (o) { return String(o || '').trim(); }).filter(Boolean);
      var err = sb.querySelector('#pollErr'); err.innerHTML = '';
      if (!q) { err.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Vul een vraag in.</p>'; return; }
      if (options.length < 2) { err.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Geef minstens twee antwoorden.</p>'; return; }
      ev.target.disabled = true;
      await S.db.collection('groupMessages').add({
        groupId: groupId, senderId: S.playerId, kind: 'poll', question: q, multi: !!st.multi,
        options: options.map(function (o) { return { text: o, votes: [] }; }), createdAt: new Date().toISOString()
      });
      closeSheet(true);
      onDone();
    });
  }

  // ---------- tabbladen & inklapbare kopjes (minder scrollen) ----------
  // Eén vast patroon: een segment-balk bovenaan met tabbladen; alleen het actieve tabblad staat
  // in beeld. De gekozen tab wordt per scherm onthouden zolang de app open is, zodat je na een
  // actie (bijv. aanmelden voor een evenement) op hetzelfde tabblad terugkomt.
  S.tabMem = S.tabMem || {};

  function tabsetHtml(name, tabs, def) {
    var keys = tabs.map(function (t) { return t.key; });
    var active = (S.tabMem[name] && keys.indexOf(S.tabMem[name]) !== -1) ? S.tabMem[name]
      : (def && keys.indexOf(def) !== -1 ? def : keys[0]);
    return '<div class="tabset" data-tabset="' + esc(name) + '"><div class="seg" role="tablist">' +
      tabs.map(function (t) {
        var on = t.key === active;
        return '<button type="button" role="tab" data-tab="' + esc(t.key) + '" aria-selected="' + on + '"' + (on ? ' class="on"' : '') + '>' + t.label + '</button>';
      }).join('') + '</div>' +
      tabs.map(function (t) {
        return '<div class="tabpanel" data-panel="' + esc(t.key) + '"' + (t.key === active ? '' : ' hidden') + '>' + t.html + '</div>';
      }).join('') + '</div>';
  }

  function selectTab(set, key, silent) {
    if (!set) return;
    if (!silent) S.tabMem[set.getAttribute('data-tabset')] = key;
    Array.prototype.forEach.call(set.children, function (ch) {
      if (ch.classList.contains('seg')) {
        ch.querySelectorAll('[data-tab]').forEach(function (b) {
          var on = b.getAttribute('data-tab') === key;
          b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      } else if (ch.hasAttribute('data-panel')) {
        ch.hidden = ch.getAttribute('data-panel') !== key;
      }
    });
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('.seg [data-tab]') : null;
    if (!b) return;
    var set = b.closest('.tabset');
    if (set) selectTab(set, b.getAttribute('data-tab'));
  });

  function countBadge(n) { return n ? ' <span class="seg-cnt">' + n + '</span>' : ''; }

  // ---------- samen plannen: deelbare link (bijv. via WhatsApp) ----------
  // Eén speler maakt een planning (periode, aantal spelers, kandidaat-clubs) en deelt de link.
  // Iedereen met de link vult in wanneer, hoe laat en waar hij/zij kan — ook zonder Smash-account,
  // alleen met een naam. De app rekent live uit welke dag, welk tijdslot en welke club het
  // meeste mensen past. Werkt de link niet direct, dan kan de 6-tekens-code ook in de app
  // worden ingevuld (op het inlogscherm of op de Spelen-pagina).

  var ARTIFACT_URL = 'https://claude.ai/artifact/1XAZYkcX4MqQ3TrUks8qwm';
  var DAY_SHORT = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
  var DAY_LONG = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  var MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  // De hele dag (00:00–24:00) in blokken van 1,5 uur, verdeeld over vier dagdelen. In het
  // raster staat steeds één dagdeel in beeld, zodat je niet 16 rijen hoeft te scrollen.
  var PLAN_PARTS = [
    { key: 'nacht', label: 'Nacht', range: '00–06', times: ['00:00', '01:30', '03:00', '04:30'] },
    { key: 'ochtend', label: 'Ochtend', range: '06–12', times: ['06:00', '07:30', '09:00', '10:30'] },
    { key: 'middag', label: 'Middag', range: '12–18', times: ['12:00', '13:30', '15:00', '16:30'] },
    { key: 'avond', label: 'Avond', range: '18–24', times: ['18:00', '19:30', '21:00', '22:30'] }
  ];
  var PLAN_TIMES = [].concat.apply([], PLAN_PARTS.map(function (p) { return p.times; }));
  function partOf(t) {
    for (var i = 0; i < PLAN_PARTS.length; i++) if (PLAN_PARTS[i].times.indexOf(t) !== -1) return PLAN_PARTS[i].key;
    return 'avond';
  }
  function partTimes(key) {
    var p = PLAN_PARTS.filter(function (x) { return x.key === key; })[0];
    return p ? p.times : [];
  }
  function bestPart(counts) {
    var order = ['avond', 'middag', 'ochtend', 'nacht'], best = 'avond', max = 0;
    order.forEach(function (k) { if ((counts[k] || 0) > max) { max = counts[k]; best = k; } });
    return best;
  }
  function partSegHtml(active, attr) {
    return '<div class="seg seg-sm" style="margin-top:0.2rem;">' + PLAN_PARTS.map(function (p) {
      return '<button type="button"' + (p.key === active ? ' class="on"' : '') + ' data-' + attr + '="' + p.key + '">' +
        '<span>' + p.label + ' <span class="seg-cnt" hidden></span></span><small>' + p.range + '</small></button>';
    }).join('') + '</div>';
  }
  // cellFn(date, time) geeft de html van één cel; dagdelen buiten `part` worden verborgen.
  function planGridHtml(dates, part, interactive, cellFn) {
    var cols = 'grid-template-columns: 2.9rem repeat(' + dates.length + ', minmax(2.3rem, 1fr));';
    return '<div class="plan-gridwrap"><div class="plan-grid" style="' + cols + '">' +
      '<div></div>' + dates.map(function (d) {
        var dd = parseLocalDate(d);
        var inner = '<strong>' + DAY_SHORT[dd.getDay()] + '</strong>' + dd.getDate() + ' ' + MONTHS[dd.getMonth()];
        return interactive ? '<button type="button" class="ph" data-day="' + d + '" title="Dit dagdeel aan/uit">' + inner + '</button>'
          : '<div class="ph static">' + inner + '</div>';
      }).join('') +
      PLAN_TIMES.map(function (t) {
        var p = partOf(t), hid = p === part ? '' : ' hidden';
        var label = interactive ? '<button type="button" class="pt" data-time="' + t + '" data-part="' + p + '"' + hid + ' title="Dit tijdstip elke dag aan/uit">' + t + '</button>'
          : '<div class="pt static" data-part="' + p + '"' + hid + '>' + t + '</div>';
        return label + dates.map(function (d) {
          return cellFn(d, t).replace(/^<(\w+)/, '<$1 data-part="' + p + '"' + hid);
        }).join('');
      }).join('') + '</div></div>';
  }
  function showPart(gridEl, part) {
    if (!gridEl) return;
    gridEl.querySelectorAll('[data-part]').forEach(function (c) { c.hidden = c.getAttribute('data-part') !== part; });
  }

  function localDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseLocalDate(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function planDates(plan) {
    var out = [], d = parseLocalDate(plan.startDate);
    for (var i = 0; i < (plan.days || 7); i++) out.push(localDateStr(new Date(d.getFullYear(), d.getMonth(), d.getDate() + i)));
    return out;
  }
  function fmtPlanDay(s, long) {
    var d = parseLocalDate(s);
    return (long ? DAY_LONG : DAY_SHORT)[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  function planEndTime(t) { var p = t.split(':'); var m = (+p[0]) * 60 + (+p[1]) + 90; return pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60); }
  function newPlanCode() {
    var abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var a = new Uint8Array(6); crypto.getRandomValues(a);
    return Array.from(a).map(function (b) { return abc[b % abc.length]; }).join('');
  }
  function normalizePlanCode(raw) { return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); }
  function planLink(code) { return ARTIFACT_URL + '#/plan/' + code; }
  function clubLabel(cid) { var c = S.clubsById[cid]; return c ? c.name + ' (' + c.city + ')' : 'Onbekende club'; }

  // Wie ben ik binnen deze planning? Ingelogd: gekoppeld aan je account. Anders: een willekeurig
  // id dat op dit apparaat onthouden wordt, zodat je je eigen antwoord later kunt aanpassen.
  S.planRespMem = S.planRespMem || {};
  function getPlanRespId(code) {
    if (S.playerId && S.player) return 'p-' + S.playerId.replace(/[^a-z0-9]/gi, '_');
    var key = 'smash_plan_resp_' + code;
    if (S.planRespMem[key]) return S.planRespMem[key];
    var id = null;
    try { id = localStorage.getItem(key); } catch (e) {}
    if (!id) {
      id = 'g-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem(key, id); } catch (e) {}
    }
    S.planRespMem[key] = id;
    return id;
  }

  function stopPlanSubscriptions() {
    if (S.planUnsubs) { S.planUnsubs.forEach(function (u) { try { u(); } catch (e) {} }); }
    S.planUnsubs = null;
  }

  function candidateClubIds(plan, responses) {
    var ids = (plan.clubIds || []).slice();
    responses.forEach(function (r) { (r.clubIds || []).forEach(function (c) { if (ids.indexOf(c) === -1) ids.push(c); }); });
    return ids.filter(function (c) { return S.clubsById[c]; });
  }

  // Kern: per dag × tijdslot de club zoeken waar de meeste beschikbare mensen naartoe willen.
  // Sortering: meeste mensen → club die door de meeste mensen gekozen is → vroegste moment.
  function computePlanOptions(plan, responses) {
    var clubIds = candidateClubIds(plan, responses);
    var options = [];
    planDates(plan).forEach(function (date) {
      PLAN_TIMES.forEach(function (t) {
        var key = date + '|' + t;
        var free = responses.filter(function (r) { return (r.slots || []).indexOf(key) !== -1; });
        if (!free.length) return;
        var best = { clubId: null, ok: free, fans: 0 };
        if (clubIds.length) {
          best = null;
          clubIds.forEach(function (cid) {
            var ok = free.filter(function (r) { return r.anyClub || (r.clubIds || []).indexOf(cid) !== -1; });
            var fans = responses.filter(function (r) { return (r.clubIds || []).indexOf(cid) !== -1; }).length;
            if (!best || ok.length > best.ok.length || (ok.length === best.ok.length && fans > best.fans)) best = { clubId: cid, ok: ok, fans: fans };
          });
        }
        if (best.ok.length) options.push({ date: date, time: t, key: key, clubId: best.clubId, ok: best.ok, fans: best.fans, free: free.length });
      });
    });
    options.sort(function (a, b) { return b.ok.length - a.ok.length || b.fans - a.fans || (a.key < b.key ? -1 : 1); });
    return options;
  }

  function optionLabel(o, long) {
    return fmtPlanDay(o.date, long) + ' · ' + o.time + '–' + planEndTime(o.time);
  }

  function inviteText(plan) {
    return '🎾 ' + plan.title + '\n' +
      'Geef even aan wanneer, hoe laat en waar je kunt — dan zoekt Smash de beste dag, tijd en club voor ons:\n' +
      planLink(plan.code) + '\n\n' +
      'Werkt de link niet? Open Smash en vul code ' + plan.code + ' in.';
  }
  function resultText(plan, o) {
    var who = o.ok.map(function (r) { return r.name; }).join(', ');
    return '🎾 ' + plan.title + ' — het wordt: ' + optionLabel(o, true) +
      (o.clubId ? ' bij ' + clubLabel(o.clubId) : '') + '!\n' +
      'Kunnen: ' + who + '\n' + planLink(plan.code);
  }
  function waHref(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }

  async function copyText(text, inputEl) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {
      if (inputEl) { inputEl.focus(); inputEl.select(); }
      return document.execCommand('copy');
    } catch (e) { return false; }
  }

  function planCodeFormHtml(id) {
    return '<form class="plan-codeform" id="' + id + '">' +
      '<input type="text" name="code" placeholder="Bijv. K7PQ2M" maxlength="8" autocomplete="off" aria-label="Uitnodigingscode">' +
      '<button class="btn secondary small" type="submit">Openen</button></form>';
  }
  function wirePlanCodeForm(id) {
    var f = document.getElementById(id);
    if (!f) return;
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var code = normalizePlanCode(new FormData(f).get('code'));
      if (code.length !== 6) { f.querySelector('input').focus(); return; }
      location.hash = '#/plan/' + code;
    });
  }

  // ----- binnen de app uitnodigen (vrienden, vriendengroepen, chatcontacten, feed) -----

  async function loadChatPartnerIds() {
    try {
      var a = await S.db.collection('messages').where('senderId', '==', S.playerId).get();
      var b = await S.db.collection('messages').where('recipientId', '==', S.playerId).get();
      var last = {};
      a.docs.concat(b.docs).forEach(function (d) {
        var m = d.data();
        var other = m.senderId === S.playerId ? m.recipientId : m.senderId;
        if (!other || other === S.playerId || !S.playersById[other]) return;
        if (!last[other] || last[other] < (m.createdAt || '')) last[other] = m.createdAt || '';
      });
      return Object.keys(last).sort(function (x, y) { return last[y].localeCompare(last[x]); }).slice(0, 8);
    } catch (e) { return []; }
  }

  // Herbruikbare kiezer: zoek spelers, voeg in één tik een hele vriendengroep of recente
  // chatcontacten toe, en kies optioneel om de planning ook in de feed te zetten.
  async function mountInvitePicker(container, opts) {
    opts = opts || {};
    var exclude = (opts.excludeIds || []).concat([S.playerId]);
    var selected = {};
    (opts.preselect || []).forEach(function (id) { if (exclude.indexOf(id) === -1 && S.playersById[id]) selected[id] = true; });
    var groups = [];
    try { groups = await loadMyFriendGroups(); } catch (e) {}
    var partners = (await loadChatPartnerIds()).filter(function (id) { return exclude.indexOf(id) === -1; });
    var players = Object.values(S.playersById).filter(function (p) { return p.onboardingComplete && exclude.indexOf(p.id) === -1; });
    var query = '';

    container.innerHTML =
      (groups.length ? '<p class="small muted" style="margin:0.2rem 0 0.35rem;">Hele vriendengroep</p><div class="plan-chips pp-groups" style="margin-top:0;"></div>' : '') +
      (partners.length ? '<p class="small muted" style="margin:0.7rem 0 0.35rem;">Recent gechat</p><div class="plan-chips pp-partners" style="margin-top:0;"></div>' : '') +
      '<div class="search-bar" style="margin-top:0.8rem;"><input type="search" class="plan-pick-search" placeholder="Zoek een speler op naam of gebruikersnaam" aria-label="Zoek een speler"></div>' +
      '<div class="pp-results"></div><div class="pp-selected"></div>' +
      (opts.allowFeed ? '<label style="display:flex;gap:0.5rem;align-items:flex-start;font-weight:500;margin-top:0.9rem;">' +
        '<input type="checkbox" class="plan-feed-toggle"' + (opts.feedChecked ? ' checked' : '') + ' style="margin-top:0.2rem;"> ' +
        '<span>Ook in de feed zetten, zodat andere padellers kunnen aansluiten</span></label>' : '');

    var groupsEl = container.querySelector('.pp-groups');
    if (groupsEl) {
      groupsEl.innerHTML = groups.map(function (g) {
        var n = (g.memberIds || []).filter(function (id) { return exclude.indexOf(id) === -1; }).length;
        return n ? '<button type="button" class="plan-pick" data-group="' + esc(g.id) + '">👥 ' + esc(g.name) + ' <span class="muted">(' + n + ')</span></button>' : '';
      }).join('');
      groupsEl.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-group]'); if (!b) return;
        var g = groups.filter(function (x) { return x.id === b.getAttribute('data-group'); })[0];
        (g.memberIds || []).forEach(function (id) { if (exclude.indexOf(id) === -1 && S.playersById[id]) selected[id] = true; });
        render();
      });
    }
    function toggleFromEvent(ev) {
      var b = ev.target.closest('[data-id]'); if (!b) return;
      var id = b.getAttribute('data-id');
      selected[id] = b.classList.contains('plan-unpick') ? false : !selected[id];
      render();
    }
    ['.pp-partners', '.pp-results', '.pp-selected'].forEach(function (sel) {
      var n = container.querySelector(sel); if (n) n.addEventListener('click', toggleFromEvent);
    });
    var searchEl = container.querySelector('.plan-pick-search');
    searchEl.addEventListener('input', function () { query = searchEl.value; render(); });
    var ft = container.querySelector('.plan-feed-toggle');
    if (ft) ft.addEventListener('change', function () { opts.feedChecked = ft.checked; });

    // Alleen de lijsten opnieuw tekenen, nooit het zoekveld zelf (anders klapt het
    // toetsenbord op een telefoon bij elke letter dicht).
    function render() {
      var pEl = container.querySelector('.pp-partners');
      if (pEl) pEl.innerHTML = partners.map(function (id) {
        return '<button type="button" class="plan-pick' + (selected[id] ? ' on' : '') + '" data-id="' + esc(id) + '">' + (selected[id] ? '✓ ' : '+ ') + esc(nameOf(id)) + '</button>';
      }).join('');
      var q = query.trim().toLowerCase();
      var hits = q ? players.filter(function (p) {
        return ((p.name || '') + ' ' + (p.username || '')).toLowerCase().indexOf(q) !== -1;
      }).slice(0, 6) : [];
      container.querySelector('.pp-results').innerHTML = q ? '<div class="plan-pick-results">' + (hits.length ? hits.map(function (p) {
        return '<button type="button" class="plan-pick-row" data-id="' + esc(p.id) + '"><span><strong>' + esc(p.name) + '</strong> <span class="muted small">@' + esc(p.username) +
          (p.level != null ? ' · niv. ' + fmtLevel(p.level) : '') + '</span></span><span class="plan-pick-add">' + (selected[p.id] ? '✓' : '+') + '</span></button>';
      }).join('') : '<p class="empty" style="padding:0.4rem 0.75rem;">Geen spelers gevonden.</p>') + '</div>' : '';
      var selIds = Object.keys(selected).filter(function (id) { return selected[id]; });
      container.querySelector('.pp-selected').innerHTML = selIds.length
        ? '<p class="small" style="margin:0.8rem 0 0.35rem;font-weight:700;">Uitnodigen (' + selIds.length + ')</p><div class="plan-chips" style="margin-top:0;">' +
          selIds.map(function (id) { return '<button type="button" class="plan-chip plan-unpick" data-id="' + esc(id) + '" title="Weghalen">' + esc(nameOf(id)) + ' ✕</button>'; }).join('') + '</div>'
        : '<p class="small muted" style="margin:0.8rem 0 0;">Nog niemand gekozen.</p>';
      if (opts.onChange) opts.onChange(selIds);
    }
    render();
    return {
      getSelected: function () { return Object.keys(selected).filter(function (id) { return selected[id]; }); },
      toFeed: function () { return !!opts.feedChecked; },
      clear: function () { selected = {}; query = ''; searchEl.value = ''; render(); }
    };
  }

  // Stuurt elke gekozen speler een chatbericht met een "Invullen"-knop, zet ze op de
  // uitnodigingslijst van de planning (zodat het ook op hun Spelen-pagina verschijnt) en
  // plaatst de planning desgewenst één keer in de feed.
  async function sendPlanInvites(plan, ids, toFeed) {
    var already = plan.invitedIds || [];
    var fresh = ids.filter(function (id) { return already.indexOf(id) === -1 && id !== S.playerId; });
    var me = S.player.name || S.player.username || 'Iemand';
    var text = '🎾 ' + me + ' nodigt je uit voor "' + plan.title + '" (' + fmtPlanDay(plan.startDate) + ' e.v.). Geef even aan wanneer en waar je kunt!';
    for (var i = 0; i < fresh.length; i++) {
      await S.db.collection('messages').add({
        conversationId: convId(S.playerId, fresh[i]), senderId: S.playerId, recipientId: fresh[i],
        text: text, imageDataUrl: null, videoUrl: null, planCode: plan.code, createdAt: new Date().toISOString()
      });
    }
    var patch = {};
    if (fresh.length) patch.invitedIds = already.concat(fresh);
    if (toFeed && !plan.feedPostId) {
      var ref = await S.db.collection('posts').add({
        authorId: S.playerId, createdAt: new Date().toISOString(), type: 'planInvite', planCode: plan.code,
        clubId: (plan.clubIds && plan.clubIds[0]) || null,
        caption: '📅 ' + plan.title + ' — ' + fmtPlanDay(plan.startDate) + ' t/m ' + fmtPlanDay(planDates(plan)[planDates(plan).length - 1]) +
          '. We zoeken nog spelers (' + plan.needed + ' totaal). Doe mee en geef aan wanneer je kunt!'
      });
      patch.feedPostId = ref.id;
    }
    if (Object.keys(patch).length) {
      await S.db.doc('plannen/' + plan.code).update(patch);
      Object.assign(plan, patch);
    }
    return fresh.length;
  }

  // Openstaande uitnodigingen voor de ingelogde speler (nog lopende planningen).
  async function loadMyPlanInvites() {
    try {
      var snap = await S.db.collection('plannen').where('invitedIds', 'array-contains', S.playerId).get();
      var today = localDateStr(new Date());
      var list = snap.docs.map(function (d) { return d.data(); }).filter(function (p) {
        var ds = planDates(p); return ds[ds.length - 1] >= today;
      });
      var rid = 'p-' + S.playerId.replace(/[^a-z0-9]/gi, '_');
      await Promise.all(list.map(async function (p) {
        try { p._answered = (await S.db.doc('plannen/' + p.code + '/reacties/' + rid).get()).exists; } catch (e) { p._answered = false; }
      }));
      list.sort(function (a, b) { return (a._answered ? 1 : 0) - (b._answered ? 1 : 0) || String(b.createdAt).localeCompare(String(a.createdAt)); });
      return list;
    } catch (e) { return []; }
  }

  function planInvitesHtml(list) {
    if (!list.length) return '';
    return '<div style="margin-top:0.8rem;">' + list.map(function (p) {
      return '<a class="plan-mine" href="#/plan/' + esc(p.code) + '"><span><strong>' + esc(p.title) + '</strong><br><span class="muted small">van ' +
        esc(p.organizerName) + ' · ' + esc(fmtPlanDay(p.startDate)) + (p.chosen ? ' · ✓ afgesproken' : '') + '</span></span>' +
        (p._answered ? '<span class="muted small">ingevuld ✓</span>' : '<span class="badge">Invullen</span>') + '</a>';
    }).join('') + '</div>';
  }

        }
        if (!code) throw new Error('Kon geen code aanmaken, probeer het nog eens.');
        var plan = {
          code: code,
          title: String(f.get('title') || 'Padellen').trim().slice(0, 60) || 'Padellen',
          organizerId: S.playerId,
          organizerName: S.player.name || S.player.username || 'Een speler',
          startDate: f.get('start'),
          days: Number(f.get('days')) || 7,
          needed: Number(f.get('needed')) || 4,
          clubIds: f.getAll('club'),
          chosen: null,
          invitedIds: [],
          createdAt: new Date().toISOString()
        };
        await S.db.doc('plannen/' + code).set(plan);
        await sendPlanInvites(plan, picker.getSelected(), picker.toFeed());
        location.hash = '#/plan/' + code + '?nieuw=1';
      } catch (e) {
        document.getElementById('pn_err').innerHTML = '<p class="banner error" style="margin-top:1rem;">' + esc(e.message || 'Er ging iets mis.') + '</p>';
        btn.disabled = false;
      }
    });
  }

  // ----- planning bekijken + beschikbaarheid invullen -----

  async function viewPlan(code, params) {
    code = normalizePlanCode(code);
    var snap = await S.db.doc('plannen/' + code).get();
    if (!snap.exists) {
      var nb = el('<div class="stack"></div>');
      nb.innerHTML = '<h1>Planning niet gevonden</h1><div class="card"><p>Er is geen planning met code <strong>' + esc(code) + '</strong>. Controleer de code en probeer het opnieuw.</p>' +
        planCodeFormHtml('planCodeNotFound') + '</div>';
      renderShell(S.player ? 'algemeen' : null, nb, 'spelen');
      wirePlanCodeForm('planCodeNotFound');
      return;
    }
    var plan = snap.data();
    var dates = planDates(plan);
    var myId = getPlanRespId(code);
    var isOrganizer = !!S.playerId && plan.organizerId === S.playerId;
    var justCreated = params && params.get('nieuw') === '1';
    var responses = [];
    var mine = null;
    var formSeeded = false;
    var lastClubKey = (plan.clubIds || []).join(',');
    var tabName = 'plan-' + code;
    var userPickedTab = !!S.tabMem[tabName];
    var formPart = null, heatPart = null;

    // Lokale formulierstatus — los van de live updates, zodat binnenkomende reacties van
    // anderen nooit je half ingevulde keuzes wegvegen.
    var form = { name: S.player ? (S.player.name || '') : '', slots: {}, clubIds: {}, anyClub: false, extraClub: null };

    var body = el('<div class="stack"></div>');
    body.innerHTML =
      pageHeadHtml('<span class="eyebrow">Uitnodiging van ' + esc(plan.organizerName) + '</span><h1>' + esc(plan.title) + '</h1>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">' + esc(fmtPlanDay(dates[0])) + ' t/m ' + esc(fmtPlanDay(dates[dates.length - 1])) +
        ' · ' + plan.needed + ' spelers · code <strong>' + esc(code) + '</strong></p>') +
      (justCreated ? '<div class="banner warn" style="margin:0;">Planning gemaakt!' + ((plan.invitedIds || []).length ? ' ' + plan.invitedIds.length + ' speler(s) hebben een uitnodiging in hun Smash-chat gekregen.' : '') + ' Vul nu zelf in wanneer je kunt.</div>' : '') +
      '<div class="plan-topactions">' +
        '<button type="button" class="btn small" id="planInviteBtn">👥 Uitnodigen</button>' +
        '<a class="btn whatsapp small" href="' + esc(waHref(inviteText(plan))) + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '</div>' +
      tabsetHtml(tabName, [
        { key: 'uitkomst', label: 'Uitkomst', html: '<div id="planResult" class="stack"></div>' },
        { key: 'invullen', label: 'Invullen <span class="seg-cnt" id="planMineMark" hidden>✓</span>', html: '<div class="card" id="planFormCard"></div>' },
        { key: 'wie', label: 'Overzicht <span class="seg-cnt" id="planWhoCnt" hidden></span>', html: '<div class="stack"><div id="planInvited"></div><div id="planHeat"></div></div>' }
      ], 'invullen') +
      (!S.player ? '<p class="small muted" style="margin:0;">Zelf ook Smash gebruiken? <a href="#/registreren">Maak een account</a> of <a href="#/inloggen">log in</a>.</p>' : '');
    renderShell(S.player ? 'algemeen' : null, body, 'spelen');
    var tabsetEl = body.querySelector('.tabset');

    // --- uitnodigen: één paneel met "in de app" én "buiten de app" (WhatsApp, link, code) ---
    function openInviteSheet() {
      var link = planLink(code);
      var sb = openSheet('Uitnodigen',
        (S.player
          ? '<h3 class="sheet-sub">In de app</h3><p class="muted small" style="margin:0 0 0.4rem;">Ze krijgen een berichtje in hun Smash-chat met een knop om meteen in te vullen.</p>' +
            '<div id="sheetPicker"><p class="muted small">Laden…</p></div><div id="sheetInviteMsg"></div>' +
            '<button class="btn small" type="button" id="sheetInviteSend" style="margin-top:0.8rem;">Uitnodigingen versturen</button>' +
            '<hr class="court-rule" style="margin:1.1rem 0;">'
          : '') +
        '<h3 class="sheet-sub">Buiten de app</h3>' +
        '<div class="plan-share-actions" style="margin-top:0.4rem;">' +
          '<a class="btn whatsapp small" href="' + esc(waHref(inviteText(plan))) + '" target="_blank" rel="noopener">Deel via WhatsApp</a>' +
          (navigator.share ? '<button class="btn secondary small" type="button" data-act="share">Delen…</button>' : '') +
          '<button class="btn secondary small" type="button" data-act="copy">Kopieer</button>' +
        '</div>' +
        '<div class="plan-linkbox"><input type="text" readonly value="' + esc(link) + '" aria-label="Link naar deze planning"></div>' +
        '<p class="small muted" style="margin:0.6rem 0 0;">Of laat ze in Smash de code invullen: <span class="plan-code">' + esc(code) + '</span></p>' +
        '<p class="small" data-role="copied" style="margin:0.4rem 0 0; color:var(--court-strong); font-weight:700;" hidden></p>');
      var copyBtn = sb.querySelector('[data-act=copy]');
      var input = sb.querySelector('.plan-linkbox input');
      copyBtn.addEventListener('click', async function () {
        var ok = await copyText(inviteText(plan), input);
        var msg = sb.querySelector('[data-role=copied]');
        msg.textContent = ok ? 'Uitnodiging gekopieerd ✓ — plak hem in je groepsapp' : 'Kopiëren lukte niet — houd de link ingedrukt om hem te kopiëren';
        msg.hidden = false;
      });
      var shareBtn = sb.querySelector('[data-act=share]');
      if (shareBtn) shareBtn.addEventListener('click', function () { navigator.share({ title: plan.title, text: inviteText(plan) }).catch(function () {}); });
      input.addEventListener('focus', function () { input.select(); });
      if (!S.player) return;
      mountInvitePicker(sb.querySelector('#sheetPicker'), {
        excludeIds: (plan.invitedIds || []).concat([plan.organizerId]),
        allowFeed: !plan.feedPostId, feedChecked: false
      }).then(function (pk) {
        var sendBtn = sb.querySelector('#sheetInviteSend');
        if (!sendBtn) return;
        sendBtn.addEventListener('click', async function () {
          var msgBox = sb.querySelector('#sheetInviteMsg');
          var ids = pk.getSelected(), toFeed = pk.toFeed();
          if (!ids.length && !toFeed) { msgBox.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Kies eerst minstens één speler (of zet hem in de feed).</p>'; return; }
          sendBtn.disabled = true;
          try {
            var n = await sendPlanInvites(plan, ids, toFeed);
            msgBox.innerHTML = '<p class="small" style="margin:0.8rem 0 0;color:var(--court-strong);font-weight:700;">✓ ' +
              (n ? n + ' uitnodiging' + (n === 1 ? '' : 'en') + ' verstuurd' : 'Verstuurd') + (toFeed ? ' · in de feed geplaatst' : '') + '</p>';
            pk.clear();
            renderInvited();
          } catch (e) {
            msgBox.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Versturen lukte niet. Probeer het nog eens.</p>';
          }
          sendBtn.disabled = false;
        });
      });
    }
    document.getElementById('planInviteBtn').addEventListener('click', openInviteSheet);

    function renderInvited() {
      var box = document.getElementById('planInvited');
      if (!box) return;
      var ids = (plan.invitedIds || []).filter(function (id) { return S.playersById[id]; });
      if (!ids.length) { box.innerHTML = ''; return; }
      var answered = {};
      responses.forEach(function (r) { if (r.playerId) answered[r.playerId] = true; });
      var waiting = ids.filter(function (id) { return !answered[id]; });
      box.innerHTML = '<div class="card"><div class="status-line"><h2>Uitgenodigd</h2><span class="muted small">' +
        (ids.length - waiting.length) + '/' + ids.length + ' ingevuld' + (waiting.length ? '' : ' 🎉') + '</span></div>' +
        '<div class="plan-chips">' + ids.map(function (id) {
          return '<span class="plan-chip' + (answered[id] ? '' : ' wait') + '">' + (answered[id] ? '✓ ' : '⏳ ') + esc(nameOf(id)) + '</span>';
        }).join('') + '</div></div>';
    }

    // --- formulier ---
    function partCounts(keyIsOn) {
      var out = {};
      PLAN_PARTS.forEach(function (p) {
        var n = 0;
        dates.forEach(function (d) { p.times.forEach(function (t) { n += keyIsOn(d + '|' + t) || 0; }); });
        out[p.key] = n;
      });
      return out;
    }
    function updateFormCounts(card) {
      var counts = partCounts(function (k) { return form.slots[k] ? 1 : 0; });
      card.querySelectorAll('[data-partbtn]').forEach(function (b) {
        var c = counts[b.getAttribute('data-partbtn')];
        var span = b.querySelector('.seg-cnt'); span.textContent = c; span.hidden = !c;
      });
    }

    function renderForm() {
      var card = document.getElementById('planFormCard');
      if (!card) return;
      var clubIds = candidateClubIds(plan, responses);
      if (form.extraClub && clubIds.indexOf(form.extraClub) === -1) clubIds.push(form.extraClub);
      if (!formPart) formPart = bestPart(partCounts(function (k) { return form.slots[k] ? 1 : 0; }));
      var chosenClubCount = form.anyClub ? 0 : clubIds.filter(function (c) { return form.clubIds[c]; }).length;

      card.innerHTML =
        '<form id="planRespForm">' +
          '<label for="pr_name">Je naam</label><input type="text" id="pr_name" name="name" maxlength="40" required value="' + esc(form.name) + '" placeholder="Bijv. Lucas">' +
          '<label>Wanneer kun je? <span class="muted small" style="font-weight:500;">blokken van 1,5 uur</span></label>' +
          partSegHtml(formPart, 'partbtn') +
          planGridHtml(dates, formPart, true, function (d, t) {
            var key = d + '|' + t;
            return '<button type="button" class="plan-cell" data-key="' + key + '" aria-pressed="' + (form.slots[key] ? 'true' : 'false') + '" aria-label="' + esc(fmtPlanDay(d, true) + ' ' + t) + '"></button>';
          }) +
          '<p class="hint" style="margin:0.4rem 0 0;">Tik op een dag of tijd om die hele kolom/rij (binnen dit dagdeel) aan of uit te zetten.</p>' +
          '<details class="acc" style="margin-top:0.9rem;"' + (chosenClubCount || form.anyClub ? '' : ' open') + '>' +
            '<summary>📍 Waar kun je spelen? <span class="acc-meta">' + (form.anyClub ? 'maakt niet uit' : chosenClubCount ? chosenClubCount + ' gekozen' : 'kies minstens één') + '</span></summary>' +
            '<div class="acc-body"><div class="check-grid">' +
              '<label><input type="checkbox" id="pr_any"' + (form.anyClub ? ' checked' : '') + '> <strong>Maakt mij niet uit</strong></label>' +
              clubIds.map(function (cid) {
                return '<label><input type="checkbox" name="club" value="' + esc(cid) + '"' + (form.clubIds[cid] ? ' checked' : '') + (form.anyClub ? ' disabled' : '') + '> ' + esc(clubLabel(cid)) + '</label>';
              }).join('') +
            '</div>' +
            '<select id="pr_addclub" style="margin-top:0.6rem;"' + (form.anyClub ? ' disabled' : '') + '><option value="">+ Andere club voorstellen…</option>' +
              sortedClubs().filter(function (c) { return clubIds.indexOf(c.id) === -1; }).map(function (c) {
                return '<option value="' + esc(c.id) + '">' + esc(c.name) + ' (' + esc(c.city) + ')</option>';
              }).join('') + '</select></div>' +
          '</details>' +
          '<div id="pr_err"></div>' +
          '<button class="btn" type="submit" style="width:100%;justify-content:center;">' + (mine ? 'Wijzigingen opslaan' : 'Versturen') + '</button>' +
        '</form>';

      updateFormCounts(card);
      var gridEl = card.querySelector('.plan-grid');
      card.querySelectorAll('[data-partbtn]').forEach(function (b) {
        b.addEventListener('click', function () {
          formPart = b.getAttribute('data-partbtn');
          card.querySelectorAll('[data-partbtn]').forEach(function (x) { x.classList.toggle('on', x === b); });
          showPart(gridEl, formPart);
        });
      });
      card.querySelector('#pr_name').addEventListener('input', function (e) { form.name = e.target.value; });
      function syncCells() {
        card.querySelectorAll('.plan-cell').forEach(function (b) { b.setAttribute('aria-pressed', form.slots[b.getAttribute('data-key')] ? 'true' : 'false'); });
        updateFormCounts(card);
      }
      card.querySelectorAll('.plan-cell').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-key');
          form.slots[k] = !form.slots[k];
          b.setAttribute('aria-pressed', form.slots[k] ? 'true' : 'false');
          updateFormCounts(card);
        });
      });
      function toggleGroup(keys) {
        var allOn = keys.every(function (k) { return form.slots[k]; });
        keys.forEach(function (k) { form.slots[k] = !allOn; });
        syncCells();
      }
      card.querySelectorAll('.ph[data-day]').forEach(function (h) {
        h.addEventListener('click', function () {
          var d = h.getAttribute('data-day');
          toggleGroup(partTimes(formPart).map(function (t) { return d + '|' + t; }));
        });
      });
      card.querySelectorAll('.pt[data-time]').forEach(function (h) {
        h.addEventListener('click', function () { var t = h.getAttribute('data-time'); toggleGroup(dates.map(function (d) { return d + '|' + t; })); });
      });
      card.querySelector('#pr_any').addEventListener('change', function (e) { form.anyClub = e.target.checked; renderForm(); card.querySelector('details.acc').open = true; });
      card.querySelectorAll('input[name=club]').forEach(function (cb) {
        cb.addEventListener('change', function () {
          form.clubIds[cb.value] = cb.checked;
          var n = clubIds.filter(function (c) { return form.clubIds[c]; }).length;
          card.querySelector('.acc-meta').textContent = n ? n + ' gekozen' : 'kies minstens één';
        });
      });
      card.querySelector('#pr_addclub').addEventListener('change', function (e) {
        var id = e.target.value; if (!id) return;
        form.extraClub = id; form.clubIds[id] = true; renderForm(); card.querySelector('details.acc').open = true;
      });
      card.querySelector('#planRespForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var err = card.querySelector('#pr_err'); err.innerHTML = '';
        var name = String(form.name || '').trim();
        var slots = Object.keys(form.slots).filter(function (k) { return form.slots[k]; }).sort();
        var chosenClubs = Object.keys(form.clubIds).filter(function (k) { return form.clubIds[k] && S.clubsById[k]; });
        if (!name) { err.innerHTML = '<p class="banner error" style="margin-top:1rem;">Vul je naam in.</p>'; return; }
        if (!slots.length) { err.innerHTML = '<p class="banner error" style="margin-top:1rem;">Tik minstens één tijdslot aan waarop je kunt.</p>'; return; }
        if (!form.anyClub && !chosenClubs.length) {
          card.querySelector('details.acc').open = true;
          err.innerHTML = '<p class="banner error" style="margin-top:1rem;">Kies minstens één club, of vink "Maakt mij niet uit" aan.</p>'; return;
        }
        var btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
        try {
          await S.db.doc('plannen/' + code + '/reacties/' + myId).set({
            name: name.slice(0, 40),
            playerId: S.playerId && S.player ? S.playerId : null,
            slots: slots,
            clubIds: form.anyClub ? [] : chosenClubs,
            anyClub: !!form.anyClub,
            updatedAt: new Date().toISOString()
          });
          btn.disabled = false;
          if (tabsetEl) selectTab(tabsetEl, 'uitkomst');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          err.innerHTML = '<p class="banner error" style="margin-top:1rem;">Opslaan lukte niet' + (e && e.code ? ' (' + esc(e.code) + ')' : '') + '. Probeer het nog eens.</p>';
          btn.disabled = false;
        }
      });
    }

    // --- uitkomst (live) ---
    function bookHtml(cid) {
      if (!cid) return '';
      var c = S.clubsById[cid]; if (!c) return '';
      if (S.player) {
        return bookingLinkHtml(c, '', 'Baan boeken');
      }
      return c.website ? '<a class="btn small" href="' + esc(c.website) + '" target="_blank" rel="noopener">Website club</a>' : '';
    }

    function renderResult() {
      var box = document.getElementById('planResult');
      if (!box) return;
      var options = computePlanOptions(plan, responses);
      var n = responses.length;
      var html = '';

      if (plan.chosen) {
        var ch = plan.chosen;
        var chOpt = options.filter(function (o) { return o.key === ch.date + '|' + ch.time; })[0];
        html += '<div class="card plan-best plan-chosen"><span class="eyebrow">✓ Afgesproken door ' + esc(plan.organizerName) + '</span>' +
          '<h2>' + esc(fmtPlanDay(ch.date, true)) + ' · ' + esc(ch.time + '–' + planEndTime(ch.time)) + '</h2>' +
          (ch.clubId ? '<p class="muted" style="margin:0.2rem 0 0;">📍 ' + esc(clubLabel(ch.clubId)) + '</p>' : '') +
          (chOpt ? '<div class="plan-chips">' + chOpt.ok.map(function (r) { return '<span class="plan-chip">' + esc(r.name) + '</span>'; }).join('') + '</div>' : '') +
          '<div class="plan-share-actions">' + bookHtml(ch.clubId) +
            (chOpt ? '<a class="btn whatsapp small" href="' + esc(waHref(resultText(plan, chOpt))) + '" target="_blank" rel="noopener">Deel in WhatsApp</a>' : '') +
            (isOrganizer ? '<button class="btn secondary small" type="button" data-act="unchoose">Toch wijzigen</button>' : '') +
          '</div></div>';
      }

      if (!n) {
        html += '<div class="card"><h2>Nog geen reacties</h2><p class="muted small">Zodra iemand invult wanneer hij/zij kan, verschijnt hier automatisch de beste dag, tijd en club.</p>' +
          '<button type="button" class="btn small" data-goto="invullen" style="margin-top:0.7rem;">Zelf invullen</button></div>';
      } else if (!options.length) {
        html += '<div class="card"><h2>Nog geen gezamenlijk moment</h2><p class="muted small">' + n + ' reactie(s), maar nog geen tijdslot waarop iemand kan.</p></div>';
      } else if (!plan.chosen) {
        var best = options[0];
        var cnt = best.ok.length;
        var full = cnt >= plan.needed;
        var missing = responses.filter(function (r) { return best.ok.indexOf(r) === -1; });
        html += '<div class="card plan-best"><span class="eyebrow">' + (full ? '🎉 Het beste moment — iedereen past' : 'Beste moment tot nu toe') + '</span>' +
          '<h2>' + esc(optionLabel(best, true)) + '</h2>' +
          (best.clubId ? '<p class="muted" style="margin:0.2rem 0 0;">📍 ' + esc(clubLabel(best.clubId)) + '</p>' : '<p class="muted" style="margin:0.2rem 0 0;">📍 Locatie maakt niemand uit — kies zelf een club</p>') +
          '<div class="plan-meter" aria-hidden="true"><span style="width:' + Math.min(100, Math.round(cnt / plan.needed * 100)) + '%"></span></div>' +
          '<p class="small" style="margin:0.4rem 0 0;font-weight:700;">' + cnt + ' van de ' + plan.needed + ' spelers kunnen' +
            (full ? '' : ' — nog ' + (plan.needed - cnt) + ' nodig') + '</p>' +
          '<div class="plan-chips">' + best.ok.map(function (r) { return '<span class="plan-chip">' + esc(r.name) + '</span>'; }).join('') +
            missing.map(function (r) { return '<span class="plan-chip no" title="Kan dan niet">' + esc(r.name) + '</span>'; }).join('') + '</div>' +
          '<div class="plan-share-actions">' +
            (isOrganizer ? '<button class="btn small" type="button" data-act="choose" data-key="' + esc(best.key) + '">Vastzetten</button>' : '') +
            bookHtml(best.clubId) +
            '<a class="btn whatsapp small" href="' + esc(waHref(resultText(plan, best))) + '" target="_blank" rel="noopener">Deel</a>' +
          '</div></div>';

        var alts = options.slice(1, 4);
        if (alts.length) {
          html += '<details class="acc card-acc"><summary>Andere opties <span class="acc-meta">' + alts.length + '</span></summary><div class="acc-body">' + alts.map(function (o) {
            return '<div class="plan-alt"><div class="plan-alt-count tnum">' + o.ok.length + '/' + plan.needed + '</div>' +
              '<div style="flex:1;min-width:0;"><strong>' + esc(optionLabel(o)) + '</strong><br><span class="muted small">' +
              (o.clubId ? esc(clubLabel(o.clubId)) + ' · ' : '') + esc(o.ok.map(function (r) { return r.name; }).join(', ')) + '</span></div>' +
              (isOrganizer ? '<button class="btn secondary small" type="button" data-act="choose" data-key="' + esc(o.key) + '">Kies</button>' : '') +
              '</div>';
          }).join('') + '</div></details>';
        }
      }
      box.innerHTML = html;

      box.querySelectorAll('[data-goto]').forEach(function (b) {
        b.addEventListener('click', function () { if (tabsetEl) selectTab(tabsetEl, b.getAttribute('data-goto')); });
      });
      box.querySelectorAll('[data-act=choose]').forEach(function (b) {
        b.addEventListener('click', async function () {
          var o = options.filter(function (x) { return x.key === b.getAttribute('data-key'); })[0];
          if (!o) return;
          b.disabled = true;
          try { await S.db.doc('plannen/' + code).update({ chosen: { date: o.date, time: o.time, clubId: o.clubId || null } }); }
          catch (e) { b.disabled = false; }
        });
      });
      var un = box.querySelector('[data-act=unchoose]');
      if (un) un.addEventListener('click', async function () {
        un.disabled = true;
        try { await S.db.doc('plannen/' + code).update({ chosen: null }); } catch (e) { un.disabled = false; }
      });

      var whoCnt = document.getElementById('planWhoCnt');
      if (whoCnt) { whoCnt.textContent = n; whoCnt.hidden = !n; }
      var mineMark = document.getElementById('planMineMark');
      if (mineMark) mineMark.hidden = !mine;

      renderHeat();
      renderInvited();
    }

    function renderHeat() {
      var box = document.getElementById('planHeat');
      if (!box) return;
      if (!responses.length) { box.innerHTML = '<div class="card"><p class="empty" style="padding:0;">Nog geen reacties om te tonen.</p></div>'; return; }
      var counts = {};
      responses.forEach(function (r) { (r.slots || []).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });
      if (!heatPart) heatPart = bestPart(partCounts(function (k) { return counts[k] || 0; }));
      var max = Math.max(plan.needed, responses.length);
      box.innerHTML = '<div class="card"><div class="status-line"><h2>Wie kan wanneer</h2><span class="muted small">' + responses.length + ' reactie(s)</span></div>' +
        '<p class="muted small" style="margin:0.2rem 0 0.5rem;">' + esc(responses.map(function (r) { return r.name; }).join(', ')) + ' · hoe donkerder, hoe meer mensen dan kunnen.</p>' +

  // ---------- privacy, toestemming & gebruiksstatistieken ----------
  // Wat spelers in de app doen (partijen, posts, uitnodigingen, clubs) staat al in de gewone
  // collecties. Daarbovenop houdt Smash — ALLEEN met toestemming van de speler — bij welke
  // onderdelen iemand gebruikt en op welke dagen. Die statistieken staan in `analytics/<id>` en
  // zijn via de database-regels alleen leesbaar voor de eigenaar van de app (elke kijker mag
  // alleen zijn eigen record schrijven). Clubs krijgen nooit namen, alleen totalen van
  // minstens 10 spelers.

  var MIN_AGE = 16;
  var CLUB_REPORT_MIN = 10;      // minimaal aantal spelers voordat een club een rapport krijgt
  var SMALL_CELL = 3;            // groepjes kleiner dan dit worden in clubrapporten samengevoegd
  var ANALYTICS_KEEP_DAYS = 730; // statistieken max. 2 jaar na laatste gebruik

  var FEATURE_LABELS = {
    home: 'Startscherm', feed: 'Feed', zoeken: 'Tegenstander zoeken', partij: 'Partij loggen',
    bevestigen: 'Uitslag bevestigen', ranglijst: 'Ranglijst', vriendengroep: 'Vriendengroepen',
    spelen: 'Spelen', plan_maken: 'Potje plannen (nieuw)', planning: 'Planning invullen/bekijken',
    clubfeed: 'Clubfeed', clubranglijst: 'Clubranglijst', club_spelen: 'Club: punten & evenementen',
    baan_huren: 'Baan huren', clubs: 'Clubs & kaart', profiel: 'Profiel', shop: 'Padelshop',
    chat: 'Chat', groepschat: 'Groepschat', privacy: 'Privacyverklaring'
  };

  function featureOf(path) {
    if (path === '/' || path === '') return 'home';
    if (path === '/feed') return 'feed';
    if (path === '/zoeken') return 'zoeken';
    if (path === '/partij/nieuw') return 'partij';
    if (path === '/te-bevestigen') return 'bevestigen';
    if (path === '/ranglijst') return 'ranglijst';
    if (path.indexOf('/vriendengroep/') === 0) return 'vriendengroep';
    if (path === '/spelen') return 'spelen';
    if (path === '/plan/nieuw') return 'plan_maken';
    if (path.indexOf('/plan/') === 0) return 'planning';
    if (path === '/baan-huren' || path === '/kies-club') return 'baan_huren';
    if (path.indexOf('/club/') === 0) {
      if (/\/ranglijst$/.test(path)) return 'clubranglijst';
      if (/\/spelen$/.test(path)) return 'club_spelen';
      if (/\/boeken$/.test(path)) return 'baan_huren';
      return 'clubfeed';
    }
    if (path === '/clubkaart' || path === '/clubs' || path.indexOf('/clubs/') === 0) return 'clubs';
    if (path === '/profiel') return 'profiel';
    if (path === '/shop') return 'shop';
    if (path === '/chat' || path.indexOf('/chat/') === 0) return 'chat';
    if (path.indexOf('/groepschat/') === 0) return 'groepschat';
    if (path === '/privacy') return 'privacy';
    return null;
  }

  function isMinor(p) { return !!(p && p.age && Number(p.age) < MIN_AGE); }
  function analyticsAllowed(p) { p = p || S.player; return !!(p && p.analyticsConsent === true && !isMinor(p)); }

  async function isAppOwner() {
    if (S.ownerCache != null) return S.ownerCache;
    try { S.ownerCache = S.userCap ? !!(await S.userCap.isOwner()) : false; } catch (e) { S.ownerCache = false; }
    return S.ownerCache;
  }

  var AN = { uid: undefined, data: null, timer: null, sessionFor: null };

  async function analyticsRef() {
    if (AN.uid === undefined) {
      try { AN.uid = S.userCap ? (await S.userCap.id()) : null; } catch (e) { AN.uid = null; }
    }
    return AN.uid ? S.db.doc('analytics/' + AN.uid) : null;
  }
  async function loadOwnAnalytics() {
    var ref = await analyticsRef();
    if (!ref) return null;
    if (!AN.data) {
      try { var d = await ref.get(); AN.data = d.exists ? d.data() : {}; } catch (e) { AN.data = {}; }
      AN.data.players = AN.data.players || {};
    }
    return AN.data;
  }
  function flushAnalytics() {
    if (AN.timer) { clearTimeout(AN.timer); AN.timer = null; }
    if (!AN.uid || !AN.data) return;
    S.db.doc('analytics/' + AN.uid).set(AN.data).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushAnalytics(); });

  async function trackFeature(key) {
    if (!key || !analyticsAllowed()) return;
    try {
      var data = await loadOwnAnalytics();
      if (!data || !analyticsAllowed()) return;
      var now = new Date(), iso = now.toISOString(), day = localYmd(now);
      var rec = data.players[S.playerId] = data.players[S.playerId] || { playerId: S.playerId, firstSeen: iso, sessions: 0, days: {}, features: {} };
      rec.lastSeen = iso;
      rec.days = rec.days || {}; rec.features = rec.features || {};
      rec.days[day] = (rec.days[day] || 0) + 1;
      var dayKeys = Object.keys(rec.days).sort();
      if (dayKeys.length > 400) dayKeys.slice(0, dayKeys.length - 400).forEach(function (k) { delete rec.days[k]; });
      rec.features[key] = (rec.features[key] || 0) + 1;
      if (AN.sessionFor !== S.playerId) { AN.sessionFor = S.playerId; rec.sessions = (rec.sessions || 0) + 1; }
      data.updatedAt = iso;
      if (AN.timer) clearTimeout(AN.timer);
      AN.timer = setTimeout(flushAnalytics, 1500);
    } catch (e) {}
  }

  async function removeOwnAnalytics(playerId) {
    try {
      var data = await loadOwnAnalytics();
      if (!data || !data.players[playerId]) return;
      delete data.players[playerId];
      if (AN.timer) { clearTimeout(AN.timer); AN.timer = null; }
      if (Object.keys(data.players).length) await S.db.doc('analytics/' + AN.uid).set(data);
      else { await S.db.doc('analytics/' + AN.uid).delete(); AN.data = { players: {} }; }
    } catch (e) {}
  }

  async function setAnalyticsConsent(on) {
    await updatePlayer({ analyticsConsent: !!on, analyticsConsentAt: new Date().toISOString() });
    if (!on) await removeOwnAnalytics(S.playerId);
    else trackFeature(featureOf((location.hash.replace(/^#/, '') || '/').split('?')[0]));
  }

  // ----- bestand opslaan (downloads-capability, met gewone download als terugval) -----

  async function saveFile(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var dl = null;
    try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: filename, data: blob }); return true; }
      catch (e) { if (!e || e.code !== 'unavailable') return false; }
    }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return true;
    } catch (e) { return false; }
  }

    var avail = null;
    try { var ad = await S.db.doc('availability/' + id).get(); avail = ad.exists ? ad.data() : null; } catch (e) {}
    var stats = null;
    try { var an = await loadOwnAnalytics(); stats = an && an.players[id] ? an.players[id] : null; } catch (e) {}
    return {
      gemaaktOp: new Date().toISOString(),
      uitleg: 'Alle gegevens die Smash over jou heeft opgeslagen (je wachtwoord staat er niet in).',
      profiel: me,
      partijen: mine,

    var id = S.playerId;
    async function delAll(col, field, op) {
      var rows = await queryWhere(col, field, id, op);
      for (var i = 0; i < rows.length; i++) { try { await S.db.doc(col + '/' + rows[i].id).delete(); } catch (e) {} }
    }
    await removeOwnAnalytics(id);
    await delAll('posts', 'authorId');
    await delAll('clubReviews', 'authorId');
    await delAll('messages', 'senderId');
    await delAll('groupMessages', 'senderId');
    await delAll('eventRsvps', 'playerId');
    await delAll('pointsLedger', 'playerId');
    await delAll('orders', 'playerId');
    await delAll('bookings', 'playerId');
    await delAll('chatReads', 'playerId');
    await delAll('groupAvailability', 'playerId');
    await delAll('plannen', 'organizerId');
    try { await S.db.doc('availability/' + id).delete(); } catch (e) {}
    var groups = await queryWhere('friendGroups', 'memberIds', id, 'array-contains');
    for (var g = 0; g < groups.length; g++) {
      var others = (groups[g].memberIds || []).filter(function (x) { return x !== id; });
      try {
        if (!others.length) await deleteFriendGroup(groups[g].id);
        else await S.db.doc('friendGroups/' + groups[g].id).update(Object.assign({ memberIds: others }, groups[g].ownerId === id ? { ownerId: others[0] } : {}));
      } catch (e) {}
    }
    await S.db.doc('players/' + id).delete();
    delete S.playersById[id];
  }
