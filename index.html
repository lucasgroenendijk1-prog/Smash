<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Karla:wght@400;500;600;700&display=swap');

  :root {
    --paper: #f8faf9;
    --ink: #0c2a30;
    --card: #ffffff;
    --line: #e3edea;
    --muted: #5c7a76;
    --court: #0e8e86;
    --court-strong: #0a6b66;
    --court-soft: #e6f6f3;
    --ball: #e4fb5e;
    --ball-ink: #2b3300;
    --danger: #b23b3b;
    --danger-soft: #fbe9e7;
    --warn-bg: #fff6dc;
    --warn-line: #e9d488;
    --shadow: 0 1px 2px rgba(8,36,42,0.05), 0 6px 20px rgba(8,36,42,0.05);
  }
  /* Bewuste keuze: de app blijft altijd licht, ook als het apparaat/systeem op
     donkere modus staat — vandaar dat dark-mode hieronder dezelfde, lichte
     waarden gebruikt in plaats van een echt donker palet. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #f8faf9;
      --ink: #0c2a30;
      --card: #ffffff;
      --line: #e3edea;
      --muted: #5c7a76;
      --court: #0e8e86;
      --court-strong: #0a6b66;
      --court-soft: #e6f6f3;
      --ball: #e4fb5e;
      --ball-ink: #2b3300;
      --danger: #b23b3b;
      --danger-soft: #fbe9e7;
      --warn-bg: #fff6dc;
      --warn-line: #e9d488;
      --shadow: 0 1px 2px rgba(8,36,42,0.05), 0 6px 20px rgba(8,36,42,0.05);
    }
  }
  :root[data-theme="dark"] {
    --paper: #f8faf9;
    --ink: #0c2a30;
    --card: #ffffff;
    --line: #e3edea;
    --muted: #5c7a76;
    --court: #0e8e86;
    --court-strong: #0a6b66;
    --court-soft: #e6f6f3;
    --ball: #e4fb5e;
    --ball-ink: #2b3300;
    --danger: #b23b3b;
    --danger-soft: #fbe9e7;
    --warn-bg: #fff6dc;
    --warn-line: #e9d488;
    --shadow: 0 1px 2px rgba(8,36,42,0.05), 0 6px 20px rgba(8,36,42,0.05);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Barlow Condensed', 'Karla', sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-wrap: balance;
    margin: 0;
  }
  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.3rem; font-weight: 700; }
  a { color: var(--court-strong); }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .tnum { font-variant-numeric: tabular-nums; }

  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.9rem;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--court-strong);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    white-space: nowrap;
  }
  .brand .dot { color: var(--court); }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.15rem;
    background: var(--paper);
    border-radius: 999px;
    padding: 0.25rem;
  }
  .tabs a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .tabs a:hover { color: var(--court-strong); }
  .tabs a.active { background: var(--tabaccent, var(--court)); color: #fff; }
  .tabs a.ghost { color: var(--court-strong); border: 1px dashed var(--line); }
  .usernav { margin-left: auto; display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; }
  .usernav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  .usernav a:hover { color: var(--court-strong); text-decoration: underline; }
  .usernav .me { font-weight: 700; color: var(--court-strong); }

  main { max-width: 1040px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

  .court-rule {
    height: 1px;
    background-image: linear-gradient(to right, var(--line) 0 6px, transparent 6px 11px);
    background-size: 11px 1px;
    margin: 1.75rem 0;
    border: none;
  }

  .backlink {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--court-strong);
    text-decoration: none;
    margin-bottom: 1.1rem;
  }
  .backlink:hover { text-decoration: underline; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.3rem 1.5rem;
    box-shadow: var(--shadow);
  }
  .stack { display: flex; flex-direction: column; gap: 1.1rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } .topbar-inner{flex-direction:column; align-items:flex-start;} .usernav{margin-left:0;} }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--court);
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--line); }
  th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  tr.me td { background: var(--court-soft); }
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.9rem; height: 1.9rem; border-radius: 50%;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1rem;
    background: var(--paper); color: var(--muted); border: 1px solid var(--line);
  }
  .rank.r1 { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
  .rank.r2 { border-color: var(--court); color: var(--court-strong); }
  .rank.r3 { border-color: var(--muted); }

  .podium { display: flex; align-items: flex-end; gap: 0.6rem; margin-bottom: 1.3rem; }
  .podium-slot { flex: 1; text-align: center; }
  .podium-bar {
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px 10px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    color: #fff; background: var(--court);
  }
  .podium-slot.p1 .podium-bar { height: 4.4rem; background: var(--ball); color: var(--ball-ink); }
  .podium-slot.p2 .podium-bar { height: 3.2rem; }
  .podium-slot.p3 .podium-bar { height: 2.2rem; background: var(--court-strong); }
  .podium-rank { font-size: 1.5rem; }
  .podium-name { font-weight: 700; font-size: 0.85rem; margin-top: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podium-wins { font-size: 0.78rem; color: var(--muted); }

  .form-dots { display: inline-flex; gap: 0.15rem; }
  .form-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.3rem; height: 1.3rem; border-radius: 50%; font-size: 0.62rem; font-weight: 800;
    color: #fff;
  }
  .form-dot.w { background: var(--court); }
  .form-dot.l { background: var(--muted); }

  .badge {
    display: inline-block; background: var(--ball); color: var(--ball-ink);
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0.15rem 0.5rem; border-radius: 999px; vertical-align: middle;
  }

  form label { display: block; font-weight: 700; font-size: 0.88rem; margin: 1rem 0 0.35rem; }
  form label:first-child { margin-top: 0; }
  form .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.25rem; }
  input[type=text], input[type=number], input[type=search], input[type=time], select, textarea {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 9px;
    font-size: 1rem; font-family: inherit; background: var(--card); color: var(--ink);
  }
  input[type=search]::-webkit-search-cancel-button { cursor: pointer; }
  .search-bar { position: relative; }
  .search-bar input[type=search] { padding-left: 2.3rem; }
  .search-bar::before {
    content: '🔍'; position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
    font-size: 0.9rem; opacity: 0.6; pointer-events: none;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--court); outline-offset: 1px;
  }
  .check-grid { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.4rem; }
  .check-grid label { display: flex; align-items: center; gap: 0.55rem; font-weight: 500; margin: 0; }
  .radio-row { display: flex; gap: 1.5rem; margin-top: 0.4rem; }
  .radio-row label { display: flex; align-items: center; gap: 0.4rem; font-weight: 500; margin: 0; }

  .stars { color: #d99a1e; letter-spacing: 0.05em; font-size: 0.95rem; }
  .stars.big { font-size: 1.4rem; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
  .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
  .photo-tile { position: relative; }
  .photo-tile .deletePhotoBtn {
    position: absolute; top: 0.3rem; right: 0.3rem; border: none; border-radius: 999px;
    width: 1.6rem; height: 1.6rem; line-height: 1.6rem; text-align: center; padding: 0;
    background: rgba(8, 36, 42, 0.72); color: #fff; font-size: 0.85rem; cursor: pointer;
  }

  .scorecard {
    display: flex; flex-direction: column; gap: 0.3rem; background: var(--court-soft);
    border-radius: 10px; padding: 0.8rem 1rem; margin-top: 0.4rem;
  }
  .scorecard-club { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; font-weight: 700; }
  .scorecard-row { display: flex; justify-content: space-between; font-weight: 600; padding: 0.15rem 0; }
  .scorecard-row.win { color: var(--court-strong); font-weight: 800; }
  .scorecard-row.win::after { content: ' 🏆'; }
  .scorecard-score {
    align-self: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 1.3rem; color: var(--ink);
  }

  .reactions-row { display: flex; gap: 0.4rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .reactionBtn {
    display: inline-flex; align-items: center; gap: 0.3rem; border: 1px solid var(--line);
    background: var(--paper); border-radius: 999px; padding: 0.25rem 0.65rem; font-size: 0.85rem;
    cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .reactionBtn.mine { background: var(--court-soft); border-color: var(--court); color: var(--court-strong); font-weight: 700; }
  .reactionBtn[disabled] { cursor: default; opacity: 0.7; }

  .player-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.9rem; margin-top: 0.6rem; }
  .player-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.1rem 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.3rem;
  }
  .player-card-level {
    align-self: flex-start; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.5rem;
    color: var(--court-strong); background: var(--court-soft); border-radius: 10px; padding: 0.1rem 0.6rem; margin-bottom: 0.3rem;
  }
  .player-card-name { font-weight: 800; font-size: 1.02rem; }

  .club-preview-strip { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .club-preview-strip img { width: 3.4rem; height: 3.4rem; object-fit: cover; border-radius: 8px; flex: none; }

  .reward-progress { margin-top: 0.9rem; }
  .reward-progress-track { height: 0.6rem; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
  .reward-progress-fill { height: 100%; background: linear-gradient(to right, var(--court), var(--ball)); border-radius: 999px 0 0 999px; }
  .review-item { padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  .review-item:last-child { border-bottom: none; }
  .review-item img { max-width: 220px; border-radius: 8px; margin-top: 0.4rem; display: block; }
  .website-link {
    display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.3rem;
    color: var(--court-strong); font-weight: 700; text-decoration: none; font-size: 0.9rem;
  }
  .website-link:hover { text-decoration: underline; }

  .nlmap-wrap { position: relative; width: 100%; max-width: 260px; margin: 0 auto; }
  .nlmap-svg { width: 100%; height: auto; display: block; fill: var(--court-soft); stroke: var(--court); stroke-width: 2.5; }
  .nlmap-pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-decoration: none; }
  .nlmap-dot {
    width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--court-strong);
    border: 2px solid var(--card); box-shadow: 0 0 0 2px var(--court-strong); transition: background 0.15s ease;
  }
  .nlmap-pin:hover .nlmap-dot, .nlmap-pin:focus .nlmap-dot { background: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
  .nlmap-label {
    position: absolute; top: 100%; margin-top: 0.25rem; font-size: 0.62rem; font-weight: 700; color: var(--ink);
    background: var(--card); padding: 0.1rem 0.4rem; border-radius: 5px; white-space: nowrap; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 5;
  }
  .nlmap-pin:hover .nlmap-label, .nlmap-pin:focus .nlmap-label { opacity: 1; }
  .nlmap-pin { cursor: pointer; background: none; border: none; padding: 0; font: inherit; }
  .nlmap-svg .nlmap-island { fill: var(--court-soft); stroke: var(--court); stroke-width: 2; }

  .club-modal-overlay {
    position: fixed; inset: 0; background: rgba(6, 16, 21, 0.68); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 1.1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .club-modal-overlay.open { opacity: 1; pointer-events: auto; }
  .club-modal-panel {
    position: relative; background: var(--card); color: var(--ink); width: 100%; max-width: 420px;
    max-height: 80vh; overflow-y: auto; border-radius: 16px; padding: 1.2rem 1.1rem 1.4rem;
    box-shadow: 0 16px 44px rgba(0,0,0,0.4); transform: scale(0.95) translateY(8px);
    transition: transform 0.2s ease;
  }
  .club-modal-overlay.open .club-modal-panel { transform: scale(1) translateY(0); }
  .club-modal-close {
    position: absolute; top: 0.6rem; right: 0.6rem; width: 2rem; height: 2rem; border-radius: 50%;
    border: none; background: var(--line); color: var(--ink); font-size: 1.05rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--court); color: #fff; border: none;
    padding: 0.65rem 1.3rem; border-radius: 9px; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; margin-top: 1.2rem; font-family: inherit;
  }
  .btn:hover { background: var(--court-strong); }
  .btn.secondary { background: transparent; color: var(--court-strong); border: 1px solid var(--court); }
  .btn.secondary:hover { background: var(--court-soft); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 0.4rem 0.9rem; font-size: 0.85rem; margin-top: 0; }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .row-actions { display: flex; gap: 0.6rem; margin-top: 0.9rem; }

  .banner { border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.9rem; border: 1px solid; margin-bottom: 1.25rem; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .banner.error { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

  .setrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .setrow input { width: 4.2rem; text-align: center; }
  .setrow .vs { color: var(--muted); }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  .loading { padding: 3rem 0; text-align: center; color: var(--muted); }
  .points-figure { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 2.4rem; color: var(--court-strong); line-height: 1; }
  footer.note { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem 3rem; color: var(--muted); font-size: 0.78rem; }

  .subtabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.9rem; }
  .subtabs a { padding: 0.35rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); color: var(--court-strong); text-decoration: none; font-size: 0.85rem; font-weight: 700; }
  .subtabs a.active { background: var(--court); color: #fff; border-color: var(--court); }

  .composer-fab {
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: var(--court); color: #fff; border: none;
    font-size: 1.5rem; font-weight: 800; line-height: 1; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow);
  }
  .composer-fab:hover { background: var(--court-strong); }

  /* Vaste, thema-onafhankelijke kleuren: deze balk moet altijd goed leesbaar
     zijn, ongeacht licht/donker-modus (die --court-strong elders juist omdraait). */
  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: #e4f5f2;
    border-top: 1px solid #d2e9e4;
    box-shadow: 0 -2px 10px rgba(8,36,42,0.08);
    display: flex; justify-content: space-around;
    padding: 0.35rem 0 max(0.35rem, env(safe-area-inset-bottom));
  }
  .bottomnav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
    color: #4f6b67; text-decoration: none; font-size: 0.66rem; font-weight: 700;
    padding: 0.25rem 0.2rem;
  }
  .bottomnav a .navicon {
    width: 2.15rem; height: 2.15rem; border-radius: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--navtint); color: var(--navaccent);
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .bottomnav a .navicon svg { width: 20px; height: 20px; display: block; }
  .bottomnav a.active .navicon { background: var(--navaccent); color: #fff; transform: translateY(-1px); }
  .bottomnav a.active { color: var(--navaccent); }
  body.has-bottomnav main { padding-bottom: 6.5rem; }

  /* Startscherm: alle onderdelen in één oogopslag + zoeken op wat je wilt doen. */
  .home-hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  .home-search { position: relative; display: block; }
  .home-search input {
    width: 100%; padding: 0.85rem 1rem 0.85rem 2.6rem; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 1rem; box-shadow: var(--shadow);
  }
  .home-search svg { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .home-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); margin: 0.4rem 0 -0.4rem; }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.65rem; }
  .quick-tile {
    position: relative; display: flex; flex-direction: column; gap: 0.35rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 0.85rem 0.9rem; text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .quick-tile:hover { border-color: var(--court); transform: translateY(-1px); }
  .quick-tile.primary { border: 2px solid var(--court); }
  .quick-icon {
    width: 2.3rem; height: 2.3rem; border-radius: 0.8rem; display: flex; align-items: center; justify-content: center;
    background: var(--court-soft); font-size: 1.2rem;
  }
  .quick-title { font-weight: 800; font-size: 0.95rem; line-height: 1.2; }
  .quick-sub { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
  .quick-count {
    position: absolute; top: 0.6rem; right: 0.6rem; min-width: 1.3rem; height: 1.3rem; padding: 0 0.35rem;
    border-radius: 999px; background: var(--danger); color: #fff; font-size: 0.72rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .home-club { display: flex; flex-direction: column; gap: 0.5rem; }
  .home-club-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
  .home-club-points { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--court-strong); white-space: nowrap; }
  .home-club .row-actions { flex-wrap: wrap; margin-top: 0.3rem; }
  [id^="sec-"] { scroll-margin-top: 10rem; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; }
  .page-head-main { min-width: 0; flex: 1; }
  .icon-btn {
    flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid var(--line); padding: 0;
    background: var(--card); color: var(--court-strong); display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow);
  }
  .icon-btn:hover { border-color: var(--court); }
  .icon-btn svg { width: 20px; height: 20px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.4rem; }
  .card-head h2 { margin: 0; }
  .status-line { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
  .status-line h2 { margin: 0; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.2rem 0 0.4rem; }
  .filter-chip { font-size: 0.78rem; font-weight: 700; border-radius: 999px; padding: 0.2rem 0.6rem; background: var(--court-soft); color: var(--court-strong); }
  .profile-head { display: flex; align-items: center; gap: 0.9rem; }
  .settings-card { padding: 0.2rem 1.1rem; }

  /* Onderpaneel (sheet) + menu: beheer- en zelden gebruikte acties staan hier i.p.v. los op het scherm. */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 260; background: rgba(6, 16, 21, 0.55);
    display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s ease;
  }
  .sheet-overlay.open { opacity: 1; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--card); color: var(--ink);
    border-radius: 20px 20px 0 0; padding: 0.5rem 1.25rem calc(1.4rem + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 40px rgba(0,0,0,0.25); transform: translateY(100%); transition: transform 0.22s ease;
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  @media (min-width: 720px) { .sheet-overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet-handle { width: 2.6rem; height: 0.3rem; border-radius: 999px; background: var(--line); margin: 0.2rem auto 0.7rem; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.8rem; }
  .sheet-head h2 { margin: 0; }
  .sheet-close { width: 2rem; height: 2rem; border-radius: 50%; border: none; background: var(--paper); color: var(--ink); cursor: pointer; font-size: 1rem; flex: none; }
  .menu-list { display: flex; flex-direction: column; }
  .menu-item {
    display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--line); padding: 0.8rem 0.2rem; font: inherit; color: var(--ink); cursor: pointer; text-decoration: none;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: var(--paper); }
  .menu-icon { width: 2.2rem; height: 2.2rem; flex: none; border-radius: 0.7rem; background: var(--court-soft); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .menu-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .menu-label { font-weight: 700; }
  .menu-sub { font-size: 0.8rem; color: var(--muted); }
  .menu-chev { color: var(--muted); font-size: 1.2rem; }
  .menu-item.danger .menu-label { color: var(--danger); }
  .menu-item.danger .menu-icon { background: var(--danger-soft); }
  .section-flash { animation: sectionFlash 1.6s ease; }
  @keyframes sectionFlash { 0%, 40% { box-shadow: 0 0 0 3px var(--court); } 100% { box-shadow: var(--shadow); } }
  body.has-bottomnav footer.note { padding-bottom: 6rem; }

  .chatlist-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; }
  .chatlist-head h1 { margin: 0; flex: 1; }
  .chatlist-search { position: relative; margin-bottom: 0.7rem; }
  .chatlist-search input {
    width: 100%; padding: 0.6rem 0.9rem 0.6rem 2.3rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit;
  }
  .chatlist-search svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .chatlist { display: flex; flex-direction: column; }
  .chatrow {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.2rem;
    border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  .chatlist .chatrow:last-child { border-bottom: none; }
  .chatavatar {
    flex: none; width: 2.7rem; height: 2.7rem; border-radius: 50%;
    background: var(--court-soft); color: var(--court-strong);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em;
  }
  .chatrow-main { flex: 1; min-width: 0; }
  .chatrow-top { display: flex; align-items: baseline; gap: 0.5rem; }
  .chatrow-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatrow-time { margin-left: auto; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .chatrow-preview {
    display: flex; align-items: center; gap: 0.35rem; color: var(--muted); font-size: 0.85rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chatrow.unread .chatrow-name, .chatrow.unread .chatrow-preview { color: var(--ink); font-weight: 700; }
  .chatrow-dot { flex: none; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--court); margin-left: 0.3rem; }

  /* Half-swipe in de chatlijst (zoals Snapchat): swipen trekt het scherm langzaam vol
     met een voorbeeld van het gesprek, zonder dat dit als "gelezen" telt. Laat je los
     voordat je ver genoeg bent, dan schuift het weer dicht; ga je door (of tik je), dan
     opent het gesprek écht en telt dat wel als gelezen. */
  .chatrow-wrap { position: relative; border-bottom: 1px solid var(--line); }
  .chatlist .chatrow-wrap:last-child { border-bottom: none; }
  .chatrow-wrap .chatrow { border-bottom: none; cursor: pointer; touch-action: pan-y; user-select: none; }
  .chatread-status { opacity: 0.85; }

  .chatpeek-overlay {
    position: fixed; inset: 0; z-index: 150; background: var(--paper);
    display: flex; flex-direction: column; transform: translateX(-100%);
  }
  .chatpeek-overlay.animate { transition: transform 0.22s ease; }
  .chatpeek-head {
    display: flex; align-items: center; gap: 0.75rem; flex: none;
    padding: max(0.9rem, env(safe-area-inset-top)) 1.25rem 0.9rem;
    background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .chatpeek-name { font-weight: 800; }
  .chatpeek-hint { font-size: 0.76rem; color: var(--muted); margin-top: 0.1rem; }

  /* Volledig-scherm chatgesprek: eigen laag los van de normale topbar/onderbalk. */
  .fullscreen-page {
    position: fixed; inset: 0; z-index: 60; background: var(--paper);
    display: flex; flex-direction: column;
  }
  .chatthread-head {
    display: flex; align-items: center; gap: 0.75rem; flex: none;
    padding: max(0.75rem, env(safe-area-inset-top)) 1.25rem 0.75rem;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .chatthread-back {
    flex: none; width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-decoration: none; border-radius: 50%;
  }
  .chatthread-back:hover { background: var(--paper); color: var(--court-strong); }
  .chatthread-back svg { width: 18px; height: 18px; }
  .chatthread-avatar {
    flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%;
    background: var(--court-soft); color: var(--court-strong);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem;
  }
  .chatthread-name { font-weight: 800; line-height: 1.2; }
  .chatthread-sub { font-size: 0.78rem; color: var(--muted); }

  .chatthread-messages {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 0.4rem; padding: 0.75rem 1.25rem;
  }
  .chatbubble-row { display: flex; }
  .chatbubble-row.mine { justify-content: flex-end; }
  .chatbubble-col { display: flex; flex-direction: column; max-width: 75%; }
  .chatbubble-row.mine .chatbubble-col { align-items: flex-end; }
  .chatbubble-row:not(.mine) .chatbubble-col { align-items: flex-start; }
  .chatbubble { position: relative; padding: 0.55rem 0.85rem; border-radius: 16px; font-size: 0.92rem; word-wrap: break-word; }
  .chatbubble-row:not(.mine) .chatbubble { background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chatbubble-row.mine .chatbubble { background: var(--court); color: #fff; border-bottom-right-radius: 4px; }
  .chatbubble-time { display: block; margin-top: 0.2rem; font-size: 0.68rem; opacity: 0.7; }
  .chatbubble-deleted { font-style: italic; }

  /* Berichten ingedrukt houden (zoals bij WhatsApp) opent het verwijdermenu direct — zie
     wireMessageDeletion(). Tekst in de bubbel is daarom niet selecteerbaar en het systeemmenu
     bij lang indrukken (kopiëren e.d.) staat uit, zodat dat niet in de weg zit. .pressing geeft
     een kort, subtiel visueel signaal zolang je vasthoudt. */
  .chatbubble { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .chatbubble.pressing { opacity: 0.75; }

  /* Menu met "Verwijderen voor mij" / "voor iedereen", geopend door een bericht ingedrukt
     te houden (zie .chatbubble.pressing hierboven en wireMessageDeletion()). */
  .msgDelMenu {
    display: flex; flex-direction: column; gap: 0.2rem; margin-top: 0.3rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.35rem;
    box-shadow: var(--shadow); min-width: 10rem;
  }
  .msgDelMenu button {
    border: none; background: transparent; text-align: left; padding: 0.4rem 0.55rem; border-radius: 6px;
    cursor: pointer; font: inherit; font-size: 0.82rem; color: var(--ink);
  }
  .msgDelMenu button:hover { background: var(--paper); }
  .msgDelMenu button[data-scope="everyone"] { color: var(--danger); }

  .chatinput-bar {
    flex: none; margin: 0 1.25rem max(0.75rem, env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 0.35rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 1.4rem;
    padding: 0.35rem 0.4rem 0.35rem 0.5rem; box-shadow: var(--shadow);
  }
  .chatinput-bar textarea {
    flex: 1; border: none; background: transparent; resize: none; font: inherit; color: var(--ink);
    padding: 0.55rem 0; max-height: 5rem; line-height: 1.3;
  }
  .chatinput-bar textarea:focus { outline: none; }
  .chatinput-icon {
    flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: none; margin-bottom: 0.1rem;
    background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chatinput-icon:hover { background: var(--paper); color: var(--court-strong); }
  .chatinput-icon svg { width: 19px; height: 19px; }
  .chatinput-send {
    flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%; border: none; margin-bottom: 0.1rem;
    background: var(--court); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chatinput-send:hover { background: var(--court-strong); }
  .chatinput-send svg { width: 17px; height: 17px; }

  .chatattach-panel {
    flex: none; margin: 0 1.25rem 0.6rem; padding: 0.8rem 0.9rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .chatattach-panel label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin: 0 0 0.2rem; }
  .chatattach-panel input[type="text"] { font: inherit; width: 100%; }
  .chatattach-preview {
    flex: none; margin: 0 1.25rem 0.5rem; display: flex; align-items: center; gap: 0.6rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.5rem 0.7rem;
  }
  .chatattach-preview img { width: 2.6rem; height: 2.6rem; object-fit: cover; border-radius: 8px; flex: none; }
  .chatattach-preview .chatattach-remove { margin-left: auto; }

  /* ---------- samen plannen ---------- */
  .plan-code {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.7rem; letter-spacing: 0.18em;
    background: var(--ball); color: var(--ball-ink); border-radius: 10px; padding: 0.15rem 0.7rem; display: inline-block;
  }
  .plan-linkbox { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .plan-linkbox input { flex: 1; min-width: 0; font-size: 0.85rem !important; }
  .btn.whatsapp { background: #1f9d55; }
  .btn.whatsapp:hover { background: #17824a; }
  .plan-share-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
  .plan-share-actions .btn { margin-top: 0; }

  .plan-gridwrap { overflow-x: auto; margin-top: 0.6rem; -webkit-overflow-scrolling: touch; }
  .plan-grid { display: grid; gap: 3px; min-width: 100%; }
  .plan-grid .ph {
    font-size: 0.7rem; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.15;
    background: none; border: none; padding: 0.2rem 0; font-family: inherit; cursor: pointer;
  }
  .plan-grid .ph.static { cursor: default; }
  .plan-grid .ph strong { display: block; color: var(--ink); font-size: 0.78rem; text-transform: capitalize; }
  .plan-grid .pt { font-size: 0.72rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; padding-right: 0.3rem; font-variant-numeric: tabular-nums; background: none; border: none; font-family: inherit; cursor: pointer; }
  .plan-grid .pt.static { cursor: default; }
  .plan-cell {
    min-width: 2.3rem; height: 2.1rem; border-radius: 7px; border: 1px solid var(--line); background: var(--paper);
    cursor: pointer; padding: 0; font: inherit; font-size: 0.75rem; font-weight: 800; color: var(--muted);
  }
  .plan-cell[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: #fff; }
  .plan-cell[aria-pressed="true"]::after { content: '✓'; }
  .plan-heat {
    min-width: 2.3rem; height: 2.1rem; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; font-variant-numeric: tabular-nums; border: 1px solid var(--line); color: var(--muted);
  }
  .plan-heat.full { outline: 2px solid var(--ball); outline-offset: -2px; }

  .plan-best {
    background: linear-gradient(135deg, var(--court-strong), var(--court)); color: #fff; border: none;
  }
  .plan-best .eyebrow { color: var(--ball); }
  .plan-best h2 { font-size: 1.6rem; margin-top: 0.2rem; }
  .plan-best .muted { color: rgba(255,255,255,0.82); }
  .plan-best a { color: var(--ball); }
  .plan-best .btn.secondary { color: #fff; border-color: rgba(255,255,255,0.6); }
  .plan-best .btn.secondary:hover { background: rgba(255,255,255,0.12); }
  .plan-best .btn:not(.secondary):not(.whatsapp) { background: var(--ball); color: var(--ball-ink); }
  .plan-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem; }
  .plan-chip { font-size: 0.8rem; font-weight: 700; border-radius: 999px; padding: 0.2rem 0.65rem; background: var(--court-soft); color: var(--court-strong); }
  .plan-chip.no { background: var(--danger-soft); color: var(--danger); text-decoration: line-through; text-decoration-thickness: 1px; }
  .plan-best .plan-chip { background: rgba(255,255,255,0.18); color: #fff; }
  .plan-best .plan-chip.no { background: rgba(0,0,0,0.18); color: rgba(255,255,255,0.7); }
  .plan-meter { height: 0.5rem; border-radius: 999px; background: rgba(255,255,255,0.22); overflow: hidden; margin-top: 0.7rem; }
  .plan-meter span { display: block; height: 100%; background: var(--ball); border-radius: 999px; }
  .plan-alt { display: flex; align-items: center; gap: 0.8rem; padding: 0.65rem 0; border-bottom: 1px solid var(--line); }
  .plan-alt:last-child { border-bottom: none; }
  .plan-alt-count {
    flex: none; width: 2.6rem; height: 2.6rem; border-radius: 10px; background: var(--court-soft); color: var(--court-strong);
    display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.1rem;
  }
  .plan-chosen { border: 2px solid var(--ball); }
  .plan-codeform { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .plan-codeform input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .plan-codeform .btn { margin-top: 0; }
  .plan-mine { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .plan-mine:last-child { border-bottom: none; }
  .plan-pick {
    font: inherit; font-size: 0.82rem; font-weight: 700; border-radius: 999px; padding: 0.3rem 0.75rem; cursor: pointer;
    background: var(--paper); color: var(--court-strong); border: 1px solid var(--line);
  }
  .plan-pick.on { background: var(--court); border-color: var(--court); color: #fff; }
  .plan-pick .muted { font-weight: 500; }
  .plan-pick-results { border: 1px solid var(--line); border-radius: 10px; margin-top: 0.4rem; overflow: hidden; }
  .plan-pick-row {
    display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 0.6rem; text-align: left;
    background: var(--card); color: var(--ink); border: none; border-bottom: 1px solid var(--line); padding: 0.55rem 0.75rem; font: inherit; cursor: pointer;
  }
  .plan-pick-row:last-child { border-bottom: none; }
  .plan-pick-add {
    flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--court-soft); color: var(--court-strong);
    display: flex; align-items: center; justify-content: center; font-weight: 800;
  }
  button.plan-chip { border: none; cursor: pointer; font-family: inherit; }
  .plan-chip.wait { background: var(--paper); color: var(--muted); border: 1px dashed var(--line); }
  .plan-invite-btn {
    display: inline-flex; margin-top: 0.5rem; padding: 0.35rem 0.8rem; border-radius: 8px; font-weight: 800; font-size: 0.85rem;
    background: var(--ball); color: var(--ball-ink) !important; text-decoration: none !important;
  }

  /* ---------- tabbladen, inklapbare kopjes, compacte schermen ---------- */
  .seg {
    display: flex; gap: 0.2rem; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.2rem; overflow-x: auto; scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; white-space: nowrap;
    border: none; background: none; font: inherit; font-weight: 700; font-size: 0.85rem; color: var(--muted);
    padding: 0.5rem 0.7rem; border-radius: 9px; cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--court-strong); box-shadow: 0 1px 3px rgba(8,36,42,0.14); }
  .seg-sm button { flex-direction: column; gap: 0; padding: 0.35rem 0.3rem; font-size: 0.78rem; line-height: 1.2; }
  .seg-sm small { font-weight: 500; font-size: 0.64rem; opacity: 0.8; }
  .seg-cnt {
    display: inline-flex; align-items: center; justify-content: center; min-width: 1.15rem; height: 1.15rem; padding: 0 0.3rem;
    border-radius: 999px; background: var(--court); color: #fff; font-size: 0.66rem; font-weight: 800; vertical-align: middle;
  }
  .tabset > .tabpanel { margin-top: 0.85rem; }
  .acc { border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .acc > summary {
    list-style: none; cursor: pointer; padding: 0.75rem 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem;
  }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::after { content: '›'; color: var(--muted); font-size: 1.2rem; line-height: 1; transform: rotate(90deg); transition: transform 0.15s ease; margin-left: 0.4rem; }
  .acc[open] > summary::after { transform: rotate(-90deg); }
  .acc-meta { margin-left: auto; font-weight: 500; font-size: 0.8rem; color: var(--muted); }
  .acc-body { padding: 0 0.9rem 0.9rem; }
  .card-acc { box-shadow: var(--shadow); border-radius: 14px; }
  .plan-topactions { display: flex; gap: 0.5rem; }
  .plan-topactions .btn { margin-top: 0; flex: 1; justify-content: center; }
  .sheet-sub { font-size: 1rem; margin: 0 0 0.2rem; }
  .grid-2.keep2 { grid-template-columns: 1fr 1fr; }
  .date-input {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 9px;

    if (p.age) bits.push(p.age + ' jr');
    if (p.gender) bits.push(genderLabel(p.gender));
    return bits.join(', ');
  }

  // Elke club krijgt een eigen, stabiele accentkleur (afgeleid van het club-id) zodat
  // "mijn club" overal herkenbaar terugkomt zonder de hele app te herkleuren.
  function clubAccent(clubId) {
    var str = String(clubId || '');
    var hash = 0;
    for (var i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
    var hue = hash % 360;
    return { bg: 'hsl(' + hue + ', 62%, 36%)', soft: 'hsl(' + hue + ', 55%, 94%)' };
  }

  function timeAgo(iso) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return 'net geplaatst';
    if (mins < 60) return mins + ' min geleden';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' uur geleden';
    return Math.round(hrs / 24) + ' dag(en) geleden';
  }

  // ---------- beschikbaarheid (tegenstander zoeken) ----------

  // Beschikbaarheid heeft nu een vaste einddtijd (startTijd + duur) in plaats van 24 uur
  // zichtbaar te blijven: zo verdwijnt "ik ben om 19:00 beschikbaar" automatisch weer zodra
  // die periode voorbij is, in plaats van de hele avond (of dag) de lijst vol te houden.
  // Daarna moet je zelf opnieuw een beschikbaarheid aanmaken.
  // Twee soorten: eenmalig (een vaste dag + tijd, verdwijnt vanzelf als die voorbij is) of
  // wekelijks herhalen (bijv. elke vrijdag 19:00) — die blijft staan tot je hem zelf stopt.
  // opts: { clubId, repeat: 'once'|'weekly', date (eenmalig, yyyy-mm-dd), weekday (wekelijks, 0=zo),
  //         from ('19:00'), durationHours, partnerId }
  // Samen beschikbaar (duo of trio): wie je als medespeler(s) opgeeft, krijgt automatisch een
  // berichtje met "Accepteren / Weigeren". Pas als ÁLLE medespelers hebben geaccepteerd, staat de
  // beschikbaarheid online (status 'active'). Zo kun je nooit iemand aanvinken die dat niet wil.
  function availPartners(a) { return (a && (a.partnerIds || (a.partnerId ? [a.partnerId] : []))) || []; }
  function availStatus(a) { return (a && a.status) || 'active'; }
  function computeAvailStatus(ids, ps) {
    if (ids.some(function (id) { return ps[id] === 'declined'; })) return 'declined';
    if (ids.every(function (id) { return ps[id] === 'accepted'; })) return 'active';
    return 'pending';
  }
  function availIsCurrent(a) {
    if (!a) return false;
    if (a.repeat === 'weekly') return true;
    if (a.expiresAt) return new Date(a.expiresAt).getTime() > Date.now();
    return Date.now() - new Date(a.createdAt).getTime() < 24 * 3600 * 1000;
  }
  function availSeekLabel(groupSize) {
    if (groupSize >= 3) return 'zoekt nog 1 speler';
    if (groupSize === 2) return 'zoekt nog 2 spelers';
    return 'zoekt 1–3 spelers';
  }
  function namesList(ids) {
    var n = ids.map(nameOf);
    return n.length <= 1 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' en ' + n[n.length - 1];
  }

  // opts: { clubId, repeat: 'once'|'weekly', date (eenmalig, yyyy-mm-dd), weekday (wekelijks, 0=zo),
  //         from ('19:00'), durationHours, partnerIds: [max. 2 medespelers] }
  async function setAvailability(opts) {
    var club = S.clubsById[opts.clubId];
    var dur = Number(opts.durationHours) || 2;
    var endTime = minToTime((timeToMin(opts.from) + Math.round(dur * 60)) % (24 * 60));
    var data = {
      playerId: S.playerId, clubId: opts.clubId || null, city: club ? club.city : '',
      repeat: opts.repeat === 'weekly' ? 'weekly' : 'once', from: opts.from, to: endTime, durationHours: dur,
      time: opts.from + '–' + endTime, createdAt: new Date().toISOString()
    };
    if (data.repeat === 'weekly') {
      data.weekday = Number(opts.weekday);
    } else {
      var start = new Date(opts.date + 'T' + opts.from + ':00');
      data.date = opts.date;
      data.startAt = start.toISOString();
      data.expiresAt = new Date(start.getTime() + dur * 3600 * 1000).toISOString();
    }
    var oldDoc = await S.db.doc('availability/' + S.playerId).get();
    var old = oldDoc.exists ? oldDoc.data() : null;
    var same = !!old && old.repeat === data.repeat && (old.date || null) === (data.date || null) &&
      (old.weekday == null ? null : old.weekday) === (data.weekday == null ? null : data.weekday) &&
      old.from === data.from && old.to === data.to && old.clubId === data.clubId;
    var partnerIds = (opts.partnerIds || []).filter(function (id, i, arr) { return id && id !== S.playerId && arr.indexOf(id) === i; }).slice(0, 2);
    var ps = {}, toAsk = [];
    partnerIds.forEach(function (id) {
      if (same && old.partnerStatus && old.partnerStatus[id] === 'accepted') ps[id] = 'accepted';
      else { ps[id] = 'pending'; toAsk.push(id); }
    });
    data.partnerIds = partnerIds;
    data.partnerStatus = ps;
    data.status = computeAvailStatus(partnerIds, ps);
    data.requestId = (same && old.requestId) ? old.requestId : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await S.db.doc('availability/' + S.playerId).set(data);
    var when = availWhenLabel(data);
    for (var i = 0; i < toAsk.length; i++) {
      var others = partnerIds.filter(function (id) { return id !== toAsk[i]; });
      await S.db.collection('messages').add({
        conversationId: convId(S.playerId, toAsk[i]), senderId: S.playerId, recipientId: toAsk[i],
        text: '🎾 Ik wil samen met jou' + (others.length ? ' en ' + namesList(others) : '') + ' online beschikbaar staan om te padellen: ' +
          when.charAt(0).toLowerCase() + when.slice(1) + ' bij ' + availWhereLabel(data) + '. Pas als iedereen heeft geaccepteerd, komt het online. Doe je mee?',
        imageDataUrl: null, videoUrl: null, availRequest: S.playerId, availRequestId: data.requestId,
        createdAt: new Date().toISOString()
      });
    }
    return data;
  }

  async function respondAvailRequest(ownerId, requestId, accept) {
    var ref = S.db.doc('availability/' + ownerId);
    var d = await ref.get();
    if (!d.exists) throw new Error('Dit verzoek bestaat niet meer.');
    var a = d.data();
    if ((requestId && a.requestId !== requestId) || availPartners(a).indexOf(S.playerId) === -1) throw new Error('Dit verzoek is niet meer actief.');
    var ps = Object.assign({}, a.partnerStatus || {});
    ps[S.playerId] = accept ? 'accepted' : 'declined';
    var status = computeAvailStatus(availPartners(a), ps);
    await ref.update({ partnerStatus: ps, status: status });
    var waiting = availPartners(a).filter(function (id) { return ps[id] === 'pending'; });
    var text = !accept
      ? '✖ Ik kan helaas niet mee. Jullie beschikbaarheid staat daarom niet online — pas hem aan zonder mij, dan kan het alsnog.'
      : status === 'active'
        ? '✅ Ik doe mee! We staan nu samen online als beschikbaar (' + availWhenLabel(a).toLowerCase() + ').'
        : '✅ Ik doe mee! Nog even wachten op ' + namesList(waiting) + '.';
    await sendMessage(ownerId, text);
    return status;
  }

  var WEEKDAY_NAMES = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  function availWhenLabel(a) {
    if (!a) return '';
    if (a.repeat === 'weekly') return 'Elke ' + WEEKDAY_NAMES[a.weekday] + ' ' + (a.time || '');
    if (a.date) {
      var today = localYmd(new Date()), tomorrow = localYmd(new Date(Date.now() + 86400000));
      var d = new Date(a.date + 'T12:00:00');
      var day = a.date === today ? 'Vandaag' : a.date === tomorrow ? 'Morgen' : WEEKDAY_NAMES[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
      return day + ' ' + (a.time || '');
    }
    return a.time || '';
  }
  function availWhereLabel(a) {
    if (!a) return '';
    var c = a.clubId ? S.clubsById[a.clubId] : null;
    return c ? c.name + ' (' + c.city + ')' : (a.city || '');
  }
  function localYmd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  // ---------- accounts (e-mail + wachtwoord) ----------
  // Wachtwoorden worden nooit zelf opgeslagen, alleen een PBKDF2-hash met een
  // willekeurig salt per account. Let op: de gedeelde database van dit
  // prototype is leesbaar voor iedereen die deze pagina kan openen (leden van
  // je eigen Claude-organisatie) — prima voor een pilot, maar geen vervanging
  // voor de serverside login uit de "echte" (Flask-)versie van de app.

  function bytesToHex(bytes) { return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
  function hexToBytes(hex) { var out = new Uint8Array(hex.length / 2); for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16); return out; }
  function randomSaltHex() { var arr = new Uint8Array(16); crypto.getRandomValues(arr); return bytesToHex(arr); }

  async function hashPassword(password, saltHex) {
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256
    );
    return bytesToHex(new Uint8Array(bits));
  }

  function normalizeEmail(raw) { return (raw || '').trim().toLowerCase(); }

  // localStorage kan weigeren (privénavigatie, sommige in-app browsers die de link vanuit
  // WhatsApp/Instagram e.d. openen, of iOS die opslag opruimt) — dan mag dat nooit de app laten
  // crashen of een geldige inlog laten verdwijnen. S.sessionEmailMem is het geheugen-exemplaar
  // dat sowieso blijft bestaan zolang deze pagina open is, ook als de browser-opslag faalt.
  function sessionEmail() {
    if (S.sessionEmailMem) return S.sessionEmailMem;
    try { return localStorage.getItem('padel_session_email'); } catch (e) { return null; }
  }
  function setSessionEmail(email) {

    try { localStorage.setItem('padel_session_email', email); } catch (e) { /* geen opslag beschikbaar, geheugen-exemplaar blijft staan */ }
  }

  }

  // Gesynchroniseerde sessie via je Claude.ai-account (bovenop localStorage): zo blijf je ook
  // ingelogd als je de link vanuit de Claude-app/-website zelf opent — daar wordt localStorage

  // ---------- ranking ----------

  // Spelers zonder Smash-account kunnen gewoon meedoen aan een gelogde partij; ze krijgen
  // een tijdelijk id ("gast:1") en tellen nooit mee op een ranglijst.
  function isGuestId(id) { return String(id || '').indexOf('gast:') === 0; }
  function matchName(m, id) {
    if (isGuestId(id)) return ((m && m.guestNames) || {})[id] || 'Onbekende speler';
    return nameOf(id);
  }
  function teamNames(m, ids) { return (ids || []).map(function (id) { return matchName(m, id); }).join(' & '); }

  // Een partij opgedeeld in "uitslag-eenheden" (wie tegen wie, wie won):
  //  - nieuwe partijen met wisselende partners: elke set is een eigen eenheid, dus elke
  //    gewonnen set telt als persoonlijke overwinning voor de spelers die hem wonnen;
  //  - nieuwe partijen met steeds dezelfde teams: de hele partij is één eenheid (zoals vroeger);
  //  - oude partijen (zonder sets-lijst): één eenheid op basis van participants/winnerSide.
  function matchUnits(m) {
    var sets = (m.sets || []).filter(function (s) {
      return s && s.a && s.b && s.a.length && s.b.length && Number(s.scoreA) !== Number(s.scoreB);
    });
    if (sets.length && m.rotating) {
      return sets.map(function (s) { return { a: s.a, b: s.b, aWon: Number(s.scoreA) > Number(s.scoreB) }; });
    }
    if (sets.length) {
      var aSets = sets.filter(function (s) { return Number(s.scoreA) > Number(s.scoreB); }).length;
      if (aSets * 2 === sets.length) return [];
      return [{ a: sets[0].a, b: sets[0].b, aWon: aSets * 2 > sets.length }];
    }
    var ps = m.participants || [];
    return [{
      a: ps.filter(function (p) { return p.side === 'A'; }).map(function (p) { return p.playerId; }),
      b: ps.filter(function (p) { return p.side === 'B'; }).map(function (p) { return p.playerId; }),
      aWon: m.winnerSide === 'A'
    }];
  }

  // Per (echte) speler: aantal gewonnen en verloren eenheden in deze partij.
  function matchOutcomes(m) {
    var res = {};
    function add(id, won) {
      if (!id || isGuestId(id)) return;
      var r = res[id] = res[id] || { wins: 0, losses: 0 };
      if (won) r.wins++; else r.losses++;
    }
    matchUnits(m).forEach(function (u) {
      u.a.forEach(function (id) { add(id, u.aWon); });
      u.b.forEach(function (id) { add(id, !u.aWon); });
    });
    return res;
  }

  function tallyWins(matches) {
    var wins = {};
    var history = {};
    matches.forEach(function (m) {
      var out = matchOutcomes(m), at = m.playedAt || m.createdAt || '';
      Object.keys(out).forEach(function (pid) {
        var o = out[pid];
        if (o.wins) wins[pid] = (wins[pid] || 0) + o.wins;
        var h = history[pid] = history[pid] || [];
        for (var i = 0; i < o.wins; i++) h.push({ playedAt: at, won: true });
        for (var j = 0; j < o.losses; j++) h.push({ playedAt: at, won: false });
      });
    });
    var rows = Object.keys(wins).map(function (pid) { return { playerId: pid, wins: wins[pid] }; });
    rows = rows.filter(function (r) { var p = S.playersById[r.playerId]; return p && !p.rankingOptOut; });
    rows.forEach(function (r) {
      var hist = (history[r.playerId] || []).slice().sort(function (a, b) { return (b.playedAt || '').localeCompare(a.playedAt || ''); }).slice(0, 5);
      r.form = hist.map(function (h) { return h.won ? 'W' : 'L'; });
    });
    rows.sort(function (a, b) { return b.wins - a.wins || nameOf(a.playerId).localeCompare(nameOf(b.playerId)); });
    return rows;
  }

  // ---------- persoonlijke prestaties (profiel) ----------

  async function myPerformanceStats() {
    var snap = await S.db.collection('matches').where('status', '==', 'confirmed').get();
    var all = snap.docs.map(function (d) { return d.data(); });
    var mine = all.filter(function (m) { return (m.participants || []).some(function (p) { return p.playerId === S.playerId; }); });
    mine.sort(function (a, b) { return (a.playedAt || a.createdAt || '').localeCompare(b.playedAt || b.createdAt || ''); });
    var wins = 0, losses = 0, longestStreak = 0, curStreak = 0, played = 0;
    var bestWinLevel = null, bestWinLabel = null;
    mine.forEach(function (m) {
      matchUnits(m).forEach(function (u) {
        var inA = u.a.indexOf(S.playerId) !== -1, inB = u.b.indexOf(S.playerId) !== -1;
        if (!inA && !inB) return;
        played++;
        var won = inA ? u.aWon : !u.aWon;
        if (won) { wins++; curStreak++; longestStreak = Math.max(longestStreak, curStreak); } else { losses++; curStreak = 0; }
        if (won) {
          (inA ? u.b : u.a).forEach(function (oid) {
            var opp = S.playersById[oid];
            var lvl = opp ? Number(opp.level) : NaN;
            if (!isNaN(lvl) && (bestWinLevel === null || lvl < bestWinLevel)) { bestWinLevel = lvl; bestWinLabel = opp.name; }
          });
        }
      });
    });
    return { wins: wins, losses: losses, longestStreak: longestStreak, bestWinLabel: bestWinLabel, bestWinLevel: bestWinLevel, played: played };
  }

  // ---------- vriendschappelijke ranglijsten (eigen groepen, los van club/landelijk, geen punten) ----------

  function tallyWinsFor(matches, memberIds) {
    var wins = {};
    memberIds.forEach(function (id) { wins[id] = 0; });
    matches.forEach(function (m) {
      var out = matchOutcomes(m);
      Object.keys(out).forEach(function (pid) {
        if (memberIds.indexOf(pid) !== -1 && out[pid].wins) wins[pid] = (wins[pid] || 0) + out[pid].wins;
      });
    });
    var rows = memberIds.map(function (pid) { return { playerId: pid, wins: wins[pid] || 0 }; });
    rows.sort(function (a, b) { return b.wins - a.wins || nameOf(a.playerId).localeCompare(nameOf(b.playerId)); });
    return rows;
  }

  }

  async function createFriendGroup(name) {
    var id = 'fg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    var group = { ownerId: S.playerId, name: name, memberIds: [S.playerId], createdAt: new Date().toISOString() };

  // ---------- groepschat per vriendengroep (met automatische tussenstanden) ----------
  // Elke vriendengroep krijgt automatisch een eigen groepschat; de leden en de naam lopen
  // gelijk met de groep. Smash plaatst daarin af en toe zelf een bericht met de stand van de
  // groepsranglijst (winst/verlies per speler): zodra de stand verandert door een nieuwe
  // bevestigde uitslag, en anders hooguit één keer per week als geheugensteuntje.
  var STATS_BOT_ID = 'smash-bot';
  function friendChatId(groupId) { return 'gc-fg-' + groupId; }

  async function postBotMessage(chatId, data, docId) {
    var msg = Object.assign({ groupId: chatId, senderId: STATS_BOT_ID, createdAt: new Date().toISOString() }, data);
    if (docId) await S.db.doc('groupMessages/' + docId).set(msg);
    else await S.db.collection('groupMessages').add(msg);
  }

  async function ensureFriendGroupChat(group) {
    var chatId = friendChatId(group.id);
    var ref = S.db.doc('groupChats/' + chatId);
    var ex = await ref.get();
    if (!ex.exists) {
      await ref.set({
        memberIds: (group.memberIds || []).slice(), title: group.name, sourceType: 'friendGroup', sourceId: group.id,
        createdAt: group.createdAt || new Date().toISOString()
      });
      await postBotMessage(chatId, { kind: 'info', text: '👋 Welkom in de groepschat van "' + group.name + '"! Hier zie je af en toe automatisch de tussenstand van jullie ranglijst.' });
    } else {
      var d = ex.data();
      var patch = {};
      if (JSON.stringify((d.memberIds || []).slice().sort()) !== JSON.stringify((group.memberIds || []).slice().sort())) patch.memberIds = (group.memberIds || []).slice();
      if (d.title !== group.name) patch.title = group.name;
      if (Object.keys(patch).length) await ref.update(patch);
    }
    return chatId;
  }

  async function syncFriendGroupChat(groupId, infoText) {
    try {
      var doc = await S.db.doc('friendGroups/' + groupId).get();
      if (!doc.exists) return;
      var chatId = await ensureFriendGroupChat(Object.assign({ id: groupId }, doc.data()));
      if (infoText) await postBotMessage(chatId, { kind: 'info', text: infoText });
    } catch (e) { console.error('Groepschat bijwerken mislukt', e); }
  }

  // Winst en verlies per groepslid (zelfde telling als de ranglijst: per partij, of per set
  // bij wisselende partners).
  async function friendGroupStats(memberIds) {
    var snap = await S.db.collection('matches').where('status', '==', 'confirmed').get();
    var tot = {};
    memberIds.forEach(function (id) { tot[id] = { playerId: id, wins: 0, losses: 0 }; });
    snap.docs.forEach(function (d) {
      var out = matchOutcomes(d.data());
      Object.keys(out).forEach(function (pid) {
        if (!tot[pid]) return;
        tot[pid].wins += out[pid].wins; tot[pid].losses += out[pid].losses;
      });
    });
    return Object.values(tot).sort(function (a, b) {
      return b.wins - a.wins || a.losses - b.losses || nameOf(a.playerId).localeCompare(nameOf(b.playerId));
    });
  }

  function simpleHash(str) { var h = 0; for (var i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }

  async function maybePostGroupStats(group) {
    try {
      var chatId = friendChatId(group.id);
      var chatRef = S.db.doc('groupChats/' + chatId);
      var chat = await chatRef.get();
      if (!chat.exists) return;
      var c = chat.data();
      var rows = await friendGroupStats(group.memberIds || []);
      if (!rows.some(function (r) { return r.wins || r.losses; })) return; // nog niks gespeeld
      var sig = rows.map(function (r) { return r.playerId + ':' + r.wins + '-' + r.losses; }).join('|');
      var changed = c.lastStatsSig !== sig;
      var stale = !c.lastStatsAt || Date.now() - new Date(c.lastStatsAt).getTime() > 7 * 86400000;
      if (!changed && !stale) return;
      var leader = rows[0];
      var prevLeader = c.lastStatsLeader || null;
      var note = '';
      if (changed && prevLeader && leader.playerId !== prevLeader && leader.wins > 0) note = '👑 ' + nameOf(leader.playerId) + ' staat nu bovenaan!';
      else if (leader.wins > 0) note = '👑 ' + nameOf(leader.playerId) + ' gaat aan kop.';
      var week = Math.floor(Date.now() / (7 * 86400000));
      var docId = 'gs-' + chatId + '-' + simpleHash(sig) + (changed ? '' : '-w' + week);
      await postBotMessage(chatId, {
        kind: 'stats', title: changed ? 'Nieuwe tussenstand' : 'Wekelijkse tussenstand',
        stats: rows.slice(0, 10), note: note, friendGroupId: group.id
      }, docId);
      await chatRef.update({ lastStatsSig: sig, lastStatsAt: new Date().toISOString(), lastStatsLeader: leader.playerId });
    } catch (e) { console.error('Tussenstand plaatsen mislukt', e); }
  }

  // Op verzoek (knop "Tussenstand delen" in de groepschat): altijd een verse stand plaatsen.
  async function postGroupStatsNow(group) {
    var chatId = friendChatId(group.id);

    var leader = rows[0];
    await postBotMessage(chatId, {
      kind: 'stats', title: 'Tussenstand (gedeeld door ' + (S.player.name || '').split(' ')[0] + ')',
      stats: rows.slice(0, 10), friendGroupId: group.id,
      note: leader && leader.wins > 0 ? '👑 ' + nameOf(leader.playerId) + ' gaat aan kop.' : 'Nog geen bevestigde partijen — tijd voor een potje! 🎾'
    });
  }

  // ---------- groepsplanning (gezamenlijke beschikbaarheid binnen een vriendengroep) ----------
  // Elk lid van de groep geeft voor de komende 7 dagen aan wanneer hij/zij kan en bij welke
  // clubs hij/zij kan spelen. Zodra ALLE leden dit hebben ingevuld, berekent de app automatisch
  // het beste gezamenlijke moment (dag, tijd en club) — of, als er geen moment is waarop
  // echt iedereen kan, de beste optie voor zoveel mogelijk leden.

  function nextWeekDays() {
    var names = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() + i);
      var iso = d.toISOString().slice(0, 10);
      out.push({ date: iso, label: names[d.getDay()] + ' ' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) });
    }
    return out;
  }

  function timeToMin(t) { var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function minToTime(m) { return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }

  async function setGroupAvailability(groupId, days, clubIds) {
    await S.db.doc('groupAvailability/' + groupId + '__' + S.playerId).set({
      groupId: groupId, playerId: S.playerId, days: days, clubIds: clubIds, updatedAt: new Date().toISOString()
    });
  }

  async function loadGroupAvailability(groupId) {

    return snap.docs.map(function (d) { return d.data(); });

  // Zoekt, voor een groep waarvan alle leden hun beschikbaarheid hebben doorgegeven, het beste
  // gezamenlijke moment: eerst de dagen waarop de HELE groep kan (langste overlap, vroegste dag
  // eerst); is dat er niet, dan de beste optie voor zoveel mogelijk leden. Een dag/tijdvak telt
  // alleen als er ook minstens één club is waar alle betrokken leden terecht kunnen.
  function computeGroupPlan(group, availabilityList) {
    var memberIds = group.memberIds || [];
    var submitted = availabilityList.filter(function (a) { return memberIds.indexOf(a.playerId) !== -1; });
    if (!memberIds.length || submitted.length < memberIds.length) {
      return { waiting: true, submittedCount: submitted.length, memberCount: memberIds.length };
    }
    var full = [], partial = [];
    nextWeekDays().forEach(function (day) {
      var present = submitted.filter(function (a) { return a.days && a.days[day.date]; });
      if (!present.length) return;
      var startMax = -Infinity, endMin = Infinity;
      present.forEach(function (a) {
        var slot = a.days[day.date];
        startMax = Math.max(startMax, timeToMin(slot.from));
        endMin = Math.min(endMin, timeToMin(slot.to));
      });
      if (startMax >= endMin) return;
      var clubCounts = {};
      present.forEach(function (a) { (a.clubIds || []).forEach(function (cid) { clubCounts[cid] = (clubCounts[cid] || 0) + 1; }); });
      var commonClubs = Object.keys(clubCounts).filter(function (cid) { return clubCounts[cid] === present.length; });
      if (!commonClubs.length) return;
      var presentIds = present.map(function (a) { return a.playerId; });
      var cand = {
        date: day.date, label: day.label, fromMin: startMax, toMin: endMin, clubIds: commonClubs,
        presentIds: presentIds,
        missingIds: memberIds.filter(function (id) { return presentIds.indexOf(id) === -1; })
      };
      if (presentIds.length === memberIds.length) full.push(cand); else partial.push(cand);
    });
    full.sort(function (a, b) { return a.date.localeCompare(b.date) || (b.toMin - b.fromMin) - (a.toMin - a.fromMin); });
    partial.sort(function (a, b) { return b.presentIds.length - a.presentIds.length || (b.toMin - b.fromMin) - (a.toMin - a.fromMin) || a.date.localeCompare(b.date); });
    return { bestFull: full[0] || null, bestPartial: partial[0] || null, submittedCount: submitted.length, memberCount: memberIds.length };
  }

    }
    function clubNames(ids) { return ids.map(function (id) { var c = S.clubsById[id]; return c ? c.name : id; }).join(' of '); }

  // ---------- beloningen: voortgang naar de volgende beloning ----------

  var REWARD_TIERS = [
    { points: 50, label: 'Gratis overgrip' },
    { points: 100, label: '10% korting in de shop' },
    { points: 200, label: 'Gratis baanuur' },

  function nextRewardInfo(balance) {
    var next = REWARD_TIERS.find(function (t) { return t.points > balance; });
    if (!next) return null;
    var prevIdx = REWARD_TIERS.indexOf(next) - 1;
    var prevPoints = prevIdx >= 0 ? REWARD_TIERS[prevIdx].points : 0;
    var pct = Math.max(2, Math.round(((balance - prevPoints) / (next.points - prevPoints)) * 100));
    return { label: next.label, points: next.points, pct: pct, remaining: next.points - balance };
  }

    var info = nextRewardInfo(balance);

  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function nowHHMM() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  // ---------- sociale feed (foto's & video's, volgen) ----------
  // Video's zijn een testversie: er is geen echte video-upload in deze omgeving,
  // dus een video wordt als externe link geplaatst in plaats van geüpload bestand.
  // Foto's worden wél echt geüpload: ze worden in de browser gecomprimeerd tot een
  // kleine JPEG zodat ze in een databasedocument passen.

  function fileToCompressedDataUrl(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !file.size) { resolve(null); return; }
      if (file.type.indexOf('image/') !== 0) { reject(new Error('Alleen afbeeldingen kunnen als foto toegevoegd worden.')); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Kon het bestand niet lezen.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Kon de afbeelding niet laden.')); };
        img.onload = function () {
          var maxDim = 640;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var quality = 0.7;
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length > 180000 && quality > 0.3) { quality -= 0.15; dataUrl = canvas.toDataURL('image/jpeg', quality); }
          if (dataUrl.length > 180000) { reject(new Error('Deze foto is te groot, probeer een kleinere of eenvoudigere foto.')); return; }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // clubReviews bevat twee soorten: 'review' (met sterren, één per speler per club) en
  // 'experience' (een verhaal zonder sterren — "ervaring delen", je kunt er meerdere plaatsen).
  function isExperience(r) { return r && r.kind === 'experience'; }
  function onlyReviews(list) { return list.filter(function (r) { return !isExperience(r) && r.rating; }); }
  function avgRating(reviews) {
    var rated = onlyReviews(reviews);
    if (!rated.length) return null;
    var sum = 0; rated.forEach(function (r) { sum += r.rating || 0; });
    return sum / rated.length;
  }
  function reviewCountLabel(list) {
    var r = onlyReviews(list).length, e = list.filter(isExperience).length;
    var bits = [];
    if (r) bits.push(r + ' recensie' + (r === 1 ? '' : 's'));
    if (e) bits.push(e + ' ervaring' + (e === 1 ? '' : 'en'));
    return bits.join(' · ');
  }

      '<span class="muted small">' + timeAgo(r.createdAt) + '</span></div>' +

    await S.db.collection('bookings').add({ clubId: clubId, playerId: S.playerId, court: court, date: date, time: time, createdAt: new Date().toISOString() });

    var snap = await S.db.collection('bookings').where('clubId', '==', clubId).where('playerId', '==', S.playerId).get();

    var list = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (b) { return b.date >= today; });
    list.sort(function (a, b) { return a.date.localeCompare(b.date) || a.time.localeCompare(b.time); });

  function addDaysToDateStr(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  async function lastBookingForClub(clubId) {
    var snap = await S.db.collection('bookings').where('clubId', '==', clubId).where('playerId', '==', S.playerId).get();
    var list = snap.docs.map(function (d) { return d.data(); });
    list.sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); });
    return list[0] || null;

  function nextWeekdayDate(dateStr) {
    var today = todayStr();
    var d = dateStr;
    while (d < today) d = addDaysToDateStr(d, 7);
    return d;
  }

  // Automatische uitnodiging vanuit "Nu beschikbaar om te spelen": in één klik een kant-en-klaar
  // berichtje versturen naar iemand die zich beschikbaar heeft gezet, zodat je niet eerst zelf
  // iets hoeft te typen. Je belandt daarna in het gesprek en kunt gewoon verder chatten.
  function inviteMessageText(a) {
    var when = (a && a.time) ? a.time : 'binnenkort';
    var where = (a && a.city) ? (' bij ' + a.city) : '';
    var me = S.player ? S.player.name : 'Iemand';
    if (a && a.partnerIds && a.partnerIds.length) {
      return 'Hoi! ' + me + ' hier via Smash — ik zag dat jullie samen (' + (a.partnerIds.length + 1) + ' spelers) ' + when + where + ' beschikbaar zijn om te padellen. Zal ik aansluiten? 🎾';
    }
    return 'Hoi! ' + me + ' hier via Smash — ik zag dat je ' + when + where + ' beschikbaar bent om te padellen. Heb je zin om samen een partijtje te spelen? 🎾';
  }

  // Bij een duo-beschikbaarheid gaat de uitnodiging naar beide spelers (ieder hun eigen
  // berichtje), ook al open je daarna alleen het gesprek met de eerste van de twee.
  async function inviteToPlay(otherId, a) {
    await sendMessage(otherId, inviteMessageText(a));
    var extra = (a && a.partnerIds) || [];
    for (var i = 0; i < extra.length; i++) await sendMessage(extra[i], inviteMessageText(a));

    m.deletedFor = deletedFor;

  // Delegated afhandeling van het verwijdermenu op berichten. `msgs` is de lijst berichten van
  // de huidige weergave (met .id), `collectionName` 'messages' of 'groupMessages', en
  // `onChanged` wordt aangeroepen (bijv. om de view opnieuw te renderen) nadat een bericht
  // succesvol verwijderd is.
  function wireMessageDeletion(container, msgs, collectionName, onChanged, errBox) {
    // Bericht ingedrukt houden (vinger of muis) opent het verwijdermenu — net als bij
    // WhatsApp; dit is de enige manier om het menu te openen (geen apart knopje meer nodig).
    // Een korte beweging (scrollen) of te snel loslaten telt niet als "ingedrukt houden".
    var LONGPRESS_MS = 450, LONGPRESS_MOVE_TOLERANCE = 10;
    container.querySelectorAll('.chatbubble-row[data-mid]').forEach(function (row) {
      var menu = container.querySelector('#delMenu-' + cssEsc(row.getAttribute('data-mid')));
      var bubble = row.querySelector('.chatbubble');
      if (!menu || !bubble) return; // geen verwijderrecht op dit bericht (of het is al verwijderd)
      var pressTimer = null, startX = 0, startY = 0;
      function clearPress() {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        bubble.classList.remove('pressing');
      }
      bubble.addEventListener('pointerdown', function (ev) {
        if (ev.pointerType === 'mouse' && ev.button !== 0) return;
        startX = ev.clientX; startY = ev.clientY;
        bubble.classList.add('pressing');
        pressTimer = setTimeout(function () {
          pressTimer = null;
          bubble.classList.remove('pressing');
          menu.hidden = !menu.hidden;
        }, LONGPRESS_MS);
      });
      bubble.addEventListener('pointermove', function (ev) {
        if (!pressTimer) return;
        if (Math.abs(ev.clientX - startX) > LONGPRESS_MOVE_TOLERANCE || Math.abs(ev.clientY - startY) > LONGPRESS_MOVE_TOLERANCE) clearPress();
      });
      bubble.addEventListener('pointerup', clearPress);
      bubble.addEventListener('pointercancel', clearPress);
      bubble.addEventListener('pointerleave', clearPress);
      bubble.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    });
    container.querySelectorAll('.msgDelCancel').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var menu = container.querySelector('#delMenu-' + cssEsc(btn.getAttribute('data-mid')));
        if (menu) menu.hidden = true;
      });
    });
    container.querySelectorAll('.msgDelOpt').forEach(function (btn) {
      btn.addEventListener('click', async function (ev) {
        ev.stopPropagation();
        var mid = btn.getAttribute('data-mid'), scope = btn.getAttribute('data-scope');
        var m = msgs.find(function (x) { return x.id === mid; });
        if (!m) return;
        btn.disabled = true;
        try {
          if (scope === 'everyone') await deleteMessageForEveryone(collectionName, m);
          else await deleteMessageForMe(collectionName, m);
          onChanged();
        } catch (e) {
          btn.disabled = false;
          if (errBox) errBox.innerHTML = '<p class="banner error">' + esc(e.message) + '</p>';
        }
      });
    });
  }

  function cssEsc(s) { return String(s).replace(/[^a-zA-Z0-9_\-]/g, function (c) { return '\\' + c; }); }

  // "Gelezen"-status per gesprek: net als bij Snapchat zie je bij een half-swipe in de

        memberIds: participantIds, clubId: clubId || null,
        title: (club ? club.name + ' — ' : '') + 'Partijchat',
        sourceType: 'match', sourceId: matchId, createdAt: new Date().toISOString()
      });
    }
    return id;
  }

    var list = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    list.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });

  async function votePoll(msgId, idx) {
    var ref = S.db.doc('groupMessages/' + msgId);
    var d = await ref.get(); if (!d.exists) return;
    var m = d.data();
    var options = (m.options || []).map(function (o) { return { text: o.text, votes: (o.votes || []).slice() }; });
    var target = options[idx]; if (!target) return;
    var had = target.votes.indexOf(S.playerId) !== -1;
    if (!m.multi) options.forEach(function (o) { o.votes = o.votes.filter(function (v) { return v !== S.playerId; }); });
    if (had) target.votes = target.votes.filter(function (v) { return v !== S.playerId; });
    else target.votes.push(S.playerId);
    await ref.update({ options: options });
  }

  var MORE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  var sheetState = { el: null };

  function sheetKeyHandler(ev) { if (ev.key === 'Escape') closeSheet(); }

  function closeSheet(immediate) {
    var ov = sheetState.el;
    if (!ov) return;
    sheetState.el = null;
    document.removeEventListener('keydown', sheetKeyHandler);
    if (immediate) { if (ov.parentNode) ov.parentNode.removeChild(ov); return; }
    ov.classList.remove('open');
    setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 220);
  }

  function openSheet(title, html) {
    closeSheet(true);
    var ov = el('<div class="sheet-overlay" role="dialog" aria-modal="true"></div>');
    ov.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="sheet-close" aria-label="Sluiten">✕</button></div>' +
      '<div class="sheet-body">' + html + '</div></div>';
    document.body.appendChild(ov);
    sheetState.el = ov;
    requestAnimationFrame(function () { ov.classList.add('open'); });
    ov.addEventListener('click', function (ev) { if (ev.target === ov) closeSheet(); });
    ov.querySelector('.sheet-close').addEventListener('click', function () { closeSheet(); });
    document.addEventListener('keydown', sheetKeyHandler);
    return ov.querySelector('.sheet-body');
  }
