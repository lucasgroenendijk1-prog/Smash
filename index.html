    var body = openSheet(title, '<div class="menu-list">' + items.map(function (it, i) {

        '<span class="menu-icon" aria-hidden="true">' + (it.icon || '•') + '</span>' +
        '<span class="menu-text"><span class="menu-label">' + esc(it.label) + '</span>' + (it.sub ? '<span class="menu-sub">' + esc(it.sub) + '</span>' : '') + '</span>' +

    body.querySelectorAll('.menu-item').forEach(function (b) {

  var PLAYSTYLES = { recreatief: 'Recreatief', sportief: 'Sportief', competitief: 'Competitief' };
  var SIDES = { links: 'Links', rechts: 'Rechts', beide: 'Beide kanten' };

  // ~10 spelers die bij jou passen: zo dicht mogelijk bij jouw niveau, liefst dezelfde speelstijl,
  // een kant die jouw kant aanvult, dezelfde club of woonplaats. Wie in de instellingen
  // "niet aanbevelen" kiest (of niet vindbaar is), verschijnt hier nooit.
  function recommendedPlayers(n, excludeIds) {
    var me = S.player || {};
    var exclude = (excludeIds || []).concat([S.playerId]);
    var myClubs = me.homeClubIds || [];
    var myLevel = Number(me.level);
    return Object.values(S.playersById).filter(function (p) {
      return p.onboardingComplete && exclude.indexOf(p.id) === -1 && p.recommendable !== false && p.discoverable !== false;
    }).map(function (p) {
      var reasons = [], score = 0;
      var lvl = Number(p.level);
      var diff = (isNaN(lvl) || isNaN(myLevel)) ? 3 : Math.abs(lvl - myLevel);
      score += diff * 2;
      if (diff <= 0.5) reasons.push('zelfde niveau'); else if (diff <= 1) reasons.push('vergelijkbaar niveau');
      if (me.playStyle && p.playStyle === me.playStyle) { score -= 1.5; reasons.push('ook ' + PLAYSTYLES[p.playStyle].toLowerCase()); }
      if (me.courtSide && p.courtSide && ((me.courtSide === 'links' && p.courtSide === 'rechts') || (me.courtSide === 'rechts' && p.courtSide === 'links'))) { score -= 1; reasons.push('speelt ' + p.courtSide); }
      var shared = (p.homeClubIds || []).filter(function (id) { return myClubs.indexOf(id) !== -1 && S.clubsById[id]; });
      if (shared.length) { score -= 1; reasons.push('ook bij ' + S.clubsById[shared[0]].name); }
      if (me.city && p.city && me.city.toLowerCase() === p.city.toLowerCase()) { score -= 0.5; if (!shared.length) reasons.push('ook uit ' + p.city); }
      return { p: p, score: score, reasons: reasons };
    }).sort(function (a, b) { return a.score - b.score || a.p.name.localeCompare(b.p.name); }).slice(0, n || 10);
  }

        '<button type="button" class="choice-tile" data-kind="experience"><span class="ct-icon">💬</span><strong>Ervaring delen</strong>' +
          '<span class="muted small">Vertel wat je hebt meegemaakt — zonder sterren.</span></button>' +
      '</div>');
    sb.querySelectorAll('[data-kind]').forEach(function (b) {
      b.addEventListener('click', function () { openReviewForm(club, b.getAttribute('data-kind'), myReview, onDone); });
    });
  }

  function openReviewForm(club, kind, myReview, onDone) {
    var isRev = kind === 'review';
    var rating = isRev && myReview ? myReview.rating : 0;
    var sb = openSheet(isRev ? (myReview ? 'Jouw recensie aanpassen' : 'Recensie schrijven') : 'Ervaring delen',
      '<form id="reviewForm">' +
      (isRev ? '<span class="field-label">Hoeveel sterren?</span><div class="star-pick" role="radiogroup" aria-label="Beoordeling">' +
        [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-star="' + n + '" aria-label="' + n + ' ster' + (n === 1 ? '' : 'ren') + '"' + (n <= rating ? ' class="on"' : '') + '>★</button>'; }).join('') + '</div>' : '') +
      '<span class="field-label">' + (isRev ? 'Je oordeel (optioneel)' : 'Jouw verhaal') + '</span>' +
      '<textarea id="review_text" name="text" rows="4" placeholder="' + (isRev ? 'Wat vond je van ' + esc(club.name) + '? Banen, sfeer, kantine…' : 'Wat heb je meegemaakt bij ' + esc(club.name) + '?') + '">' + esc(isRev && myReview ? myReview.text : '') + '</textarea>' +
      '<span class="field-label">Foto (optioneel)</span><input type="file" id="review_image" name="image" accept="image/*">' +
      '<div id="reviewError"></div><button class="btn small" type="submit" style="margin-top:1rem;">' + (isRev ? (myReview ? 'Recensie bijwerken' : 'Recensie plaatsen') : 'Ervaring plaatsen') + '</button></form>');
    sb.querySelectorAll('[data-star]').forEach(function (b) {
      b.addEventListener('click', function () {
        rating = Number(b.getAttribute('data-star'));
        sb.querySelectorAll('[data-star]').forEach(function (x) { x.classList.toggle('on', Number(x.getAttribute('data-star')) <= rating); });
      });
    });
    sb.querySelector('#reviewForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var errBox = sb.querySelector('#reviewError'); errBox.innerHTML = '';
      var f = new FormData(ev.target);
      var submitBtn = ev.target.querySelector('button[type=submit]'); submitBtn.disabled = true;
      try {
        var text = (f.get('text') || '').trim();
        var imageDataUrl = await fileToCompressedDataUrl(f.get('image'));
        if (isRev) {
          if (!rating) throw new Error('Tik eerst het aantal sterren aan.');
          await upsertClubReview(club.id, rating, text, imageDataUrl || (myReview ? myReview.imageDataUrl : null));
        } else {
          if (!text) throw new Error('Schrijf eerst je verhaal.');
          await addClubExperience(club.id, text, imageDataUrl);
        }
        closeSheet(true);
        onDone();
      } catch (e) { errBox.innerHTML = '<p class="banner error" style="margin-top:0.8rem;">' + esc(e.message) + '</p>'; submitBtn.disabled = false; }
    });
  }

  // ---------- rendering shell ----------

  function renderShell(activeMode, bodyEl, activeTab, opts) {
    opts = opts || {};
    closeSheet(true);
    var app = document.getElementById('app');
    app.innerHTML = '';

    if (opts.fullscreen) {
      // Puur het gesprek: geen topbar, geen onderbalk, geen footer — een eigen laag over het hele scherm.
      var oldBnav = document.querySelector('.bottomnav');
      if (oldBnav) oldBnav.remove();
      var oldFoot = document.querySelector('footer.note');
      if (oldFoot) oldFoot.remove();
      document.body.classList.remove('has-bottomnav');
      app.appendChild(bodyEl);
      return;
    }

    var top = el('<div class="topbar"><div class="topbar-inner"></div></div>');
    var inner = top.querySelector('.topbar-inner');

    var brand = el('<a class="brand" href="#/">🎾 Smash</a>');
    inner.appendChild(brand);

    if (S.player) {
      var tabs = el('<nav class="tabs"></nav>');
      var algemeen = el('<a href="#/">Algemeen</a>');
      if (activeMode === 'algemeen') algemeen.classList.add('active');
      tabs.appendChild(algemeen);
      (S.player.homeClubIds || []).forEach(function (cid) {
        var c = S.clubsById[cid]; if (!c) return;
        var a = el('<a href="#/club/' + cid + '" style="--tabaccent:' + clubAccent(cid).bg + ';">' + esc(c.name) + '</a>');
        if (activeMode === cid) a.classList.add('active');
        tabs.appendChild(a);
      });
      tabs.appendChild(el('<a class="ghost" href="#/clubkaart">+ club</a>'));
      inner.appendChild(tabs);
    } else if (S.isGuest) {
      var gtabs = el('<nav class="tabs"></nav>');
      var galgemeen = el('<a href="#/">Algemeen</a>');
      if (activeMode === 'algemeen') galgemeen.classList.add('active');
      gtabs.appendChild(galgemeen);
      gtabs.appendChild(el('<a href="#/clubkaart">Clubs</a>'));
      inner.appendChild(gtabs);

      var gnav = el('<nav class="usernav"></nav>');
      gnav.appendChild(el('<span class="small" style="color:var(--muted);">Gastweergave — alleen bekijken</span>'));
      gnav.appendChild(el('<a href="#/inloggen">Inloggen</a>'));
      gnav.appendChild(el('<a class="me" href="#/registreren">Account maken</a>'));
      inner.appendChild(gnav);
    }
    app.appendChild(top);
    var main = el('<main></main>');
    if (S.navStack.length > 1) {
      var back = el('<a href="#" class="backlink">← Terug</a>');
      back.addEventListener('click', function (ev) { ev.preventDefault(); goBack(); });
      main.appendChild(back);
    }
    main.appendChild(bodyEl);
    app.appendChild(main);
    var foot = document.querySelector('footer.note');
    if (!foot) {
      foot = el('<footer class="note">Smash — pilotversie. Gegevens zijn zichtbaar voor iedereen die deze pagina kan openen; geen echte accountbeveiliging. · <a href="#/privacy">Privacyverklaring</a></footer>');
      document.body.appendChild(foot);
    }

    document.body.classList.toggle('has-bottomnav', !!S.player);
    var existingBottomNav = document.querySelector('.bottomnav');
    if (existingBottomNav) existingBottomNav.remove();
    if (S.player) {
      var base = (activeMode && activeMode !== 'algemeen') ? '#/club/' + activeMode : '#';
      var bnav = el('<nav class="bottomnav"></nav>');
      [
        { href: '#/', icon: NAV_ICONS.home, label: 'Home', tab: ['home'], accent: '#0a7d76', tint: '#dff3f0' },
        { seg: '/feed', icon: NAV_ICONS.feed, label: 'Feed', tab: ['feed'], accent: '#0a7d76', tint: '#dff3f0' },
        { seg: '/spelen', icon: NAV_ICONS.spelen, label: 'Spelen', tab: ['ranglijst', 'spelen'], accent: '#0a7d76', tint: '#dff3f0' },
        { href: '#/clubkaart', icon: NAV_ICONS.clubs, label: 'Clubs', tab: ['clubkaart'], accent: '#0a7d76', tint: '#dff3f0' },
        { href: '#/chat', icon: NAV_ICONS.chat, label: 'Chat', tab: ['chat'], accent: '#0a7d76', tint: '#dff3f0' },
        { href: '#/profiel', icon: NAV_ICONS.profiel, label: 'Profiel', tab: ['profiel'], accent: '#0a7d76', tint: '#dff3f0' }
      ].forEach(function (it) {
        var href = it.href || (base + it.seg);
        var a = el('<a href="' + href + '" style="--navaccent:' + it.accent + ';--navtint:' + it.tint + ';"><span class="navicon">' + it.icon + '</span>' + it.label + '</a>');
        if (it.tab.indexOf(activeTab) !== -1) a.classList.add('active');
        bnav.appendChild(a);
      });
      document.body.appendChild(bnav);
    }
  }

  function pendingBanner(count) {
    if (!count) return '';
    return '<div class="banner warn">Je hebt <strong>' + count + '</strong> partij(en) die op jouw bevestiging wachten. <a href="#/te-bevestigen">Bekijk ze →</a></div>';
  }

  async function countPending() {
    var snap = await S.db.collection('matches').where('status', '==', 'pending').get();
    var n = 0;
    snap.docs.forEach(function (d) {
      var m = d.data();
      m.participants.forEach(function (p) { if (p.playerId === S.playerId && !p.confirmed) n++; });
    });
    return n;
  }

  // "Ranglijst" en "Spelen" delen nu één plek in de onderbalk ("Wedstrijden") — deze
  // subtabs laten de twee pagina's in elkaars verlengde voelen zonder de routes te wijzigen.
  function wedstrijdenTabsHtml(activeMode, which) {
    var base = (activeMode && activeMode !== 'algemeen') ? '#/club/' + activeMode : '#';
    return '<div class="subtabs">' +
      '<a href="' + base + '/spelen" class="' + (which === 'spelen' ? 'active' : '') + '">Spelen</a>' +
      '<a href="' + base + '/ranglijst" class="' + (which === 'ranglijst' ? 'active' : '') + '">Ranglijst</a>' +
      '</div>';
  }

  function formHtml(form) {
    if (!form || !form.length) return '';
    return '<span class="form-dots" title="Laatste resultaten, meest recent eerst">' +
      form.map(function (r) { return '<span class="form-dot ' + (r === 'W' ? 'w' : 'l') + '">' + r + '</span>'; }).join('') + '</span>';
  }

  function podiumHtml(rows) {
    var top3 = rows.slice(0, 3);
    if (top3.length < 2) return '';
    var order = [top3[1], top3[0], top3[2]];
    return '<div class="podium">' + order.map(function (r) {
      if (!r) return '<div class="podium-slot"></div>';
      var place = r === top3[0] ? 1 : (r === top3[1] ? 2 : 3);
      return '<div class="podium-slot p' + place + '"><div class="podium-bar"><span class="podium-rank">' + place + '</span></div>' +
        '<div class="podium-name">' + esc(nameOf(r.playerId)) + '</div>' +
        '<div class="podium-wins tnum">' + r.wins + ' overw.</div></div>';
    }).join('') + '</div>';
  }

  function rankTable(rows, headExtra, opts) {
    opts = opts || {};
    if (!rows.length) return '<p class="empty">Nog geen bevestigde partijen.</p>';
    var showForm = !!(rows[0] && rows[0].form);
    var body = rows.map(function (r, i) {
      var cls = (i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '');
      var meRow = r.playerId === S.playerId ? ' class="me"' : '';
      var extra = headExtra ? '<td>' + esc(headExtra(r)) + '</td>' : '';
      return '<tr' + meRow + '><td><span class="rank ' + cls + '">' + (i + 1) + '</span></td>' +
        '<td>' + esc(nameOf(r.playerId)) + ' <span class="muted small">@' + esc(usernameOf(r.playerId)) + '</span></td>' +
        extra + '<td class="tnum">' + r.wins + '</td>' + (showForm ? '<td>' + formHtml(r.form) + '</td>' : '') + '</tr>';
    }).join('');
    return (opts.podium ? podiumHtml(rows) : '') +
      '<table><thead><tr><th></th><th>Naam</th>' + (headExtra ? '<th>Plaats</th>' : '') + '<th>Winst</th>' + (showForm ? '<th>Vorm</th>' : '') + '</tr></thead><tbody>' + body + '</tbody></table>';
  }

  // ---------- views ----------

  async function viewRanglijstAlgemeen(params) {
    var tab = (params && params.get('tab') === 'vrienden') ? 'vrienden' : 'landelijk';
    var tabsHtml = '<div class="subtabs">' +
      '<a href="#/ranglijst" class="' + (tab === 'landelijk' ? 'active' : '') + '">Landelijk</a>' +
      '<a href="#/ranglijst?tab=vrienden" class="' + (tab === 'vrienden' ? 'active' : '') + '">Vriendengroepen</a>' +
      '</div>';
    var body = el('<div class="stack"></div>');

    if (tab === 'vrienden') {
      var groups = await loadMyFriendGroups();
      body.innerHTML =
        wedstrijdenTabsHtml('algemeen', 'ranglijst') +
        '<h1>Vriendschappelijke ranglijsten</h1>' + tabsHtml +
        '<div class="status-line"><p class="muted small" style="margin:0; flex:1; min-width:12rem;">Je eigen ranglijst met vrienden — puur voor de lol, zonder punten.</p>' +
        '<button type="button" class="btn small" id="newGroupBtn" style="margin-top:0;">+ Nieuwe groep</button></div>' +

            '<span><strong>' + esc(g.name) + '</strong><br><span class="muted small">' + ledenLabel((g.memberIds || []).length) + '</span></span><span class="muted" style="font-size:1.3rem;">›</span></a>';
        }).join('') : '<p class="empty">Je hebt nog geen vriendengroep.</p>');
      renderShell('algemeen', body, 'ranglijst');
      document.getElementById('newGroupBtn').addEventListener('click', function () {
        var sb = openSheet('Nieuwe groep',
          '<form id="newGroupForm"><label for="group_name">Naam van de groep</label>' +
          '<input type="text" id="group_name" name="name" placeholder="bijv. Vrijdagclubje" required>' +
          '<div id="groupError"></div><button class="btn small" type="submit">Aanmaken</button></form>');
        sb.querySelector('#newGroupForm').addEventListener('submit', async function (ev) {
          ev.preventDefault();
          var errBox = sb.querySelector('#groupError'); errBox.innerHTML = '';
          var name = (new FormData(ev.target).get('name') || '').trim();
          if (!name) return;
          var submitBtn = ev.target.querySelector('button[type=submit]'); submitBtn.disabled = true;
          try {
            var id = await createFriendGroup(name);
            location.hash = '#/vriendengroep/' + id;
          } catch (e) { errBox.innerHTML = '<p class="banner error">' + esc(e.message) + '</p>'; submitBtn.disabled = false; }
        });
      });
      return;
    }

    var top = await nationalRanking();
    body.innerHTML =
      wedstrijdenTabsHtml('algemeen', 'ranglijst') +
      '<h1>Landelijke ranglijst</h1>' + tabsHtml +
      '<p class="muted">Alle bevestigde overwinningen, all-time — deze ranglijst reset niet.</p>' +
      '<div class="card">' + rankTable(top, null, { podium: true }) + '</div>';
    renderShell('algemeen', body, 'ranglijst');
  }

  async function viewFriendGroup(groupId) {
    var doc = await S.db.doc('friendGroups/' + groupId).get();
    if (!doc.exists) { location.hash = '#/ranglijst?tab=vrienden'; return; }
    var group = Object.assign({ id: groupId }, doc.data());
    var memberIds = group.memberIds || [];
    // Elk lid mag de groep bekijken (en zijn beschikbaarheid doorgeven) — alleen het maken/
    // verwijderen van de groep en het beheren van leden blijft voorbehouden aan de eigenaar.
    if (memberIds.indexOf(S.playerId) === -1) { location.hash = '#/ranglijst?tab=vrienden'; return; }
    var isOwner = group.ownerId === S.playerId;
    try { await ensureFriendGroupChat(group); maybePostGroupStats(group); } catch (e) {}
    var standings = await friendGroupRanking(memberIds);
    var availabilityList = await loadGroupAvailability(groupId);
    var plan = computeGroupPlan(group, availabilityList);
    var myAvail = availabilityList.find(function (a) { return a.playerId === S.playerId; });
    var days = nextWeekDays();
    var statusRows = memberIds.map(function (id) {
      var has = availabilityList.some(function (a) { return a.playerId === id; });
      return '<div style="display:flex; justify-content:space-between; padding:0.3rem 0;">' +
        '<span>' + esc(nameOf(id)) + (id === S.playerId ? ' <span class="muted small">(jij)</span>' : '') + '</span>' +
        '<span class="' + (has ? '' : 'muted small') + '">' + (has ? '✅ ingevuld' : 'nog niet ingevuld') + '</span></div>';
    }).join('');
    var memberRows = memberIds.map(function (id) {
      return '<div style="display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid var(--line);">' +
        '<span>' + esc(nameOf(id)) + ' <span class="muted small">@' + esc(usernameOf(id)) + '</span></span>' +
        (isOwner && id !== S.playerId ? '<button type="button" class="btn secondary small removeMemberBtn" data-id="' + esc(id) + '">Verwijderen</button>' : '<span class="muted small">' + (id === S.playerId ? 'Jij' : '') + '</span>') +
        '</div>';
    }).join('');
    var submittedCount = availabilityList.filter(function (a) { return memberIds.indexOf(a.playerId) !== -1; }).length;
    var body = el('<div class="stack"></div>');
    body.innerHTML =
      pageHeadHtml('<span class="eyebrow">Vriendengroep · ' + ledenLabel(memberIds.length) + '</span><h1>' + esc(group.name) +
        (isOwner ? ' <button type="button" class="rename-btn" id="renameGroupBtn" aria-label="Naam wijzigen" title="Naam wijzigen">✏️</button>' : '') + '</h1>', 'groupMenuBtn') +
      '<a class="card chat-link-card" href="#/groepschat/' + esc(friendChatId(groupId)) + '"><span class="chatavatar">💬</span>' +
        '<span style="flex:1; min-width:0;"><strong>Groepschat</strong><br><span class="muted small">Praat met de groep — met af en toe automatisch de tussenstand</span></span><span class="muted">›</span></a>' +
      '<div class="card" style="border:2px solid var(--court);"><div class="status-line"><div><h2>Samen een potje plannen</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">Iedereen uit de groep krijgt een uitnodiging in de app.</p></div>' +
        '<a class="btn small" href="#/plan/nieuw?groep=' + esc(groupId) + '" style="margin-top:0;">Plan met deze groep</a></div></div>' +
      groupPlanCardHtml(plan) +
      '<div class="card"><div class="status-line"><div><h2>Jouw beschikbaarheid</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">' + (myAvail ? '✅ Doorgegeven' : 'Nog niet doorgegeven') + ' · ' + submittedCount + ' van ' + memberIds.length + ' ingevuld</p></div>' +
        '<button type="button" class="btn small" id="availOpenBtn" style="margin-top:0;">' + (myAvail ? 'Aanpassen' : 'Doorgeven') + '</button></div></div>' +
      '<div class="card"><h2>Ranglijst</h2>' + rankTable(standings, null, { podium: true }) + '</div>';
    renderShell('algemeen', body, 'ranglijst');

    // Stappenplan (dag → club → tijd) in een onderpaneel i.p.v. los op het scherm.
    function openAvailSheet() {
      var sb = openSheet('Jouw beschikbaarheid',
        '<form id="groupAvailForm">' +
        '<p class="muted small" id="gaf_stepLabel" style="margin-top:0; font-weight:700;"></p>' +
        '<div id="gaf_step0">' +
          '<div id="gaf_dayChips" style="display:flex; flex-wrap:wrap; gap:0.5rem;"></div>' +
        '</div>' +
        '<div id="gaf_step1" hidden>' +
          '<div id="gaf_clubChips" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.6rem;"></div>' +
          '<div class="search-bar"><input type="search" id="gaf_clubSearch" placeholder="Filter op naam of plaats (optioneel)"></div>' +
          '<div id="gaf_clubResults" style="margin-top:0.5rem; max-height:18rem; overflow-y:auto;"></div>' +
        '</div>' +
        '<div id="gaf_step2" hidden>' +
          '<div style="display:flex; align-items:center; gap:0.6rem;">' +
            '<select id="gaf_from" style="width:7.5rem;">' + timeOptionsHtml('18:00', 6, 23) + '</select>' +
            '<span class="muted small">tot</span>' +
            '<select id="gaf_to" style="width:7.5rem;">' + timeOptionsHtml('20:00', 6, 23) + '</select>' +
          '</div>' +
          '<p class="hint">Dit tijdvak geldt voor alle dagen die je net hebt gekozen.</p>' +
        '</div>' +
        '<div id="groupAvailError"></div>' +
        '<div class="row-actions">' +
          '<button type="button" class="btn secondary small" id="gaf_backBtn" hidden>Vorige</button>' +
          '<button type="button" class="btn small" id="gaf_nextBtn">Volgende</button>' +
          '<button type="submit" class="btn small" id="gaf_saveBtn" hidden>Opslaan</button>' +
          (myAvail ? '<button type="button" class="btn secondary small" id="clearGroupAvailBtn" style="margin-left:auto;">Wissen</button>' : '') +
        '</div>' +
        '<p class="muted small" style="margin:0.9rem 0 0;">Zodra alle ' + memberIds.length + ' leden dit hebben doorgegeven, berekent de app automatisch het beste gezamenlijke moment.</p>' +
        '</form>');

      var form = sb.querySelector('#groupAvailForm');
      var stepEls = [sb.querySelector('#gaf_step0'), sb.querySelector('#gaf_step1'), sb.querySelector('#gaf_step2')];
      var stepLabels = [
        'Stap 1 van 3 — welke dag(en) kun je spelen?',
        'Stap 2 van 3 — waar kun je spelen?',
        'Stap 3 van 3 — hoe laat kun je spelen?'
      ];
      var stepLabelEl = sb.querySelector('#gaf_stepLabel');
      var backBtn = sb.querySelector('#gaf_backBtn');
      var nextBtn = sb.querySelector('#gaf_nextBtn');
      var saveBtn = sb.querySelector('#gaf_saveBtn');
      var errBox = sb.querySelector('#groupAvailError');
      var fromInput = sb.querySelector('#gaf_from');
      var toInput = sb.querySelector('#gaf_to');
      var step = 0;

      var selectedDays = [];
      if (myAvail && myAvail.days) {
        days.forEach(function (day, i) { if (myAvail.days[day.date]) selectedDays.push(i); });
      }
      var selectedClubIds = (myAvail && myAvail.clubIds) ? myAvail.clubIds.slice() : [];
      if (myAvail && myAvail.days && selectedDays.length) {
        var firstSlot = myAvail.days[days[selectedDays[0]].date];
        if (firstSlot) { fromInput.value = firstSlot.from; toInput.value = firstSlot.to; }
      }

      function showStep(n) {
        step = n;
        stepEls.forEach(function (stepEl, i) { stepEl.hidden = (i !== n); });
        stepLabelEl.textContent = stepLabels[n];
        backBtn.hidden = (n === 0);
        nextBtn.hidden = (n === stepEls.length - 1);
        saveBtn.hidden = (n !== stepEls.length - 1);
        errBox.innerHTML = '';
      }

      function renderDayChips() {
        var wrap = sb.querySelector('#gaf_dayChips');
        wrap.innerHTML = days.map(function (day, i) {
          var on = selectedDays.indexOf(i) !== -1;
          return '<button type="button" class="reactionBtn' + (on ? ' mine' : '') + '" data-i="' + i + '">' + esc(day.label) + '</button>';
        }).join('');
        wrap.querySelectorAll('button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var i = Number(btn.getAttribute('data-i'));
            var pos = selectedDays.indexOf(i);
            if (pos === -1) selectedDays.push(i); else selectedDays.splice(pos, 1);
            renderDayChips();
          });
        });
      }

      function renderSelectedClubChips() {
        var wrap = sb.querySelector('#gaf_clubChips');
        if (!selectedClubIds.length) { wrap.innerHTML = '<p class="muted small" style="margin:0;">Nog geen club gekozen.</p>'; return; }
        wrap.innerHTML = selectedClubIds.map(function (cid) {
          var c = S.clubsById[cid];
          return '<button type="button" class="reactionBtn mine" data-cid="' + esc(cid) + '">' + esc(c ? c.name : cid) + ' ✕</button>';
        }).join('');
        wrap.querySelectorAll('button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var cid = btn.getAttribute('data-cid');
            selectedClubIds = selectedClubIds.filter(function (id) { return id !== cid; });
            renderSelectedClubChips(); renderClubResults();
          });
        });
      }

      function renderClubResults() {
        var q = (sb.querySelector('#gaf_clubSearch').value || '').trim().toLowerCase();
        var results = sb.querySelector('#gaf_clubResults');
        // Alle clubs op alfabet, gewoon aantikken; het filterveld is alleen een hulpje.
        var matches = sortedClubs().filter(function (c) {
          return !q || c.name.toLowerCase().indexOf(q) !== -1 || c.city.toLowerCase().indexOf(q) !== -1;
        });
        if (!matches.length) { results.innerHTML = '<p class="empty">Geen clubs gevonden.</p>'; return; }
        results.innerHTML = matches.map(function (c) {
          var on = selectedClubIds.indexOf(c.id) !== -1;
          return '<div style="display:flex; justify-content:space-between; align-items:center; padding:0.35rem 0; border-bottom:1px solid var(--line);">' +
            '<span>' + esc(c.name) + ' <span class="muted small">' + esc(c.city) + '</span></span>' +
            '<button type="button" class="btn ' + (on ? '' : 'secondary ') + 'small" data-cid="' + esc(c.id) + '" style="margin:0;">' + (on ? 'Gekozen ✓' : 'Kiezen') + '</button></div>';
        }).join('');
        results.querySelectorAll('button[data-cid]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var cid = btn.getAttribute('data-cid');
            var pos = selectedClubIds.indexOf(cid);
            if (pos === -1) selectedClubIds.push(cid); else selectedClubIds.splice(pos, 1);
            renderSelectedClubChips(); renderClubResults();
          });
        });
      }

      renderDayChips(); renderSelectedClubChips(); renderClubResults();
      sb.querySelector('#gaf_clubSearch').addEventListener('input', renderClubResults);
      backBtn.addEventListener('click', function () { showStep(Math.max(0, step - 1)); });
      nextBtn.addEventListener('click', function () {
        errBox.innerHTML = '';
        if (step === 0 && !selectedDays.length) { errBox.innerHTML = '<p class="banner error">Kies minstens één dag.</p>'; return; }
        if (step === 1 && !selectedClubIds.length) { errBox.innerHTML = '<p class="banner error">Kies minstens één club.</p>'; return; }
        showStep(Math.min(stepEls.length - 1, step + 1));
      });
      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        errBox.innerHTML = '';
        var from = fromInput.value, to = toInput.value;
        if (!from || !to || from >= to) { errBox.innerHTML = '<p class="banner error">Kies een geldig tijdvak (eindtijd na starttijd).</p>'; return; }
        saveBtn.disabled = true;
        try {
          var daysOut = {};
          selectedDays.forEach(function (i) { daysOut[days[i].date] = { from: from, to: to }; });
          await setGroupAvailability(groupId, daysOut, selectedClubIds);
          viewFriendGroup(groupId);
        } catch (e) { errBox.innerHTML = '<p class="banner error">' + esc(e.message) + '</p>'; saveBtn.disabled = false; }
      });
      var clearBtn = sb.querySelector('#clearGroupAvailBtn');
      if (clearBtn) clearBtn.addEventListener('click', async function () {
        await clearGroupAvailability(groupId);
        viewFriendGroup(groupId);
      });
      showStep(0);
    }

  var HELP_STOP = ['hoe', 'werkt', 'het', 'een', 'de', 'wat', 'ik', 'je', 'kan', 'kun', 'mijn', 'met', 'van', 'voor', 'waar', 'doe', 'dat', 'die', 'dit', 'is', 'en', 'op', 'in', 'naar', 'wil', 'moet'];

  function looksLikeQuestion(q) {
    q = String(q || '').trim().toLowerCase();
    if (q.length < 6) return false;
    if (/\?$/.test(q)) return true;
    return /^(hoe|wat|waar|wanneer|waarom|wie|welke|kan|kun|mag|moet|is|zijn|heb|hoeveel|help|uitleg)\b/.test(q) && q.split(/\s+/).length >= 2;
  }

  function helpMatches(q) {
    var words = String(q || '').toLowerCase().replace(/[?!.,]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 3 && HELP_STOP.indexOf(w) === -1; });
    return HELP_TOPICS.map(function (t) {
      var hay = (t.title + ' ' + t.keys).toLowerCase();
      var score = 0;
      words.forEach(function (w) { if (hay.indexOf(w) !== -1) score += 2; else if (w.length > 5 && hay.indexOf(w.slice(0, 5)) !== -1) score += 1; });
      return { t: t, score: score };
    }).filter(function (x) { return x.score > 0; }).sort(function (a, b) { return b.score - a.score; }).map(function (x) { return x.t; });
  }

  function helpTopicHtml(t, open) {
    return '<details class="acc card-acc"' + (open ? ' open' : '') + '><summary>📘 Zo werkt het: ' + esc(t.title) + '</summary><div class="acc-body">' +
      '<ol class="help-steps">' + t.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +

  function buildAskPrompt(q) {
    var clubs = (S.player.homeClubIds || []).map(function (id) { return S.clubsById[id] ? S.clubsById[id].name : null; }).filter(Boolean).join(', ') || 'nog geen';
    var guide = HELP_TOPICS.map(function (t) {

    return 'Je bent de vriendelijke hulp-assistent in de padel-app "Smash". Beantwoord de vraag van een speler in het Nederlands, kort en duidelijk.\n' +
      'Regels:\n' +
      '- Baseer je ALLEEN op de handleiding hieronder. Staat het antwoord er niet in, zeg dan eerlijk dat je het niet zeker weet en noem het onderdeel dat het dichtst in de buurt komt, of verwijs naar de club.\n' +
      '- Bij een "hoe"-vraag: geef genummerde stappen (1., 2., ...), hooguit 7, elk op een eigen regel. Verwijs naar knoppen met hun naam tussen aanhalingstekens.\n' +
      '- Gebruik geen markdown (geen ** of #). Schrijf gewone, korte zinnen en spreek de speler aan met "je".\n' +
      '- Eindig met een aparte laatste regel "OPEN: <code>" met de code (tussen [ ]) van het best passende onderdeel, of "OPEN: geen".\n\n' +
      'Over de speler: voornaam ' + ((S.player.name || '').split(' ')[0] || 'onbekend') + ', niveau ' + fmtLevel(S.player.level) + ' (1 = hoogst, 10 = beginner), thuisclub(s): ' + clubs + '.\n\n' +
      'HANDLEIDING:\n' + guide + '\n\nVRAAG VAN DE SPELER: ' + q;

  function renderAskAnswer(box, text, done) {
    var open = null;
    var lines = String(text || '').split('\n').filter(function (l) {
      var m = l.match(/^\s*OPEN:\s*([a-z]+)/i);
      if (m) { open = m[1].toLowerCase(); return false; }
      return true;
    });
    if (!done && lines.length && /^\s*O(P(E(N)?)?)?:?\s*$/.test(lines[lines.length - 1])) lines.pop();
    var topic = open ? HELP_TOPICS.filter(function (t) { return t.key === open; })[0] : null;
    box.innerHTML = '<div class="ask-answer">' + esc(lines.join('\n').trim()) + '</div>' +
      (done && topic ? '<a class="btn small" href="' + esc(topic.href) + '" style="margin-top:0.6rem;">Ga naar ' + esc(topic.title.split(' (')[0]) + ' →</a>' : '');
  }

  var AI_OFF_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

  async function runAsk(q, box, btn) {
    var offMsg = '<p class="muted small" style="margin:0;">De assistent is hier niet beschikbaar — de uitleg hieronder helpt je verder.</p>';
    if (S.aiOff) { box.innerHTML = offMsg; if (btn) btn.hidden = true; return; }
    var sample = await getSample();
    if (!sample) { S.aiOff = true; box.innerHTML = offMsg; if (btn) btn.hidden = true; return; }
    if (S.askCtl) S.askCtl.abort();
    var ctl = S.askCtl = new AbortController();
    if (btn) btn.disabled = true;
    box.innerHTML = '<p class="ask-thinking">Even denken…</p>';
    try {
      var res = await sample(buildAskPrompt(q), { modelTier: 'quick', signal: ctl.signal, onText: function (u) { renderAskAnswer(box, u.text, false); } });
      renderAskAnswer(box, res.text, true);
    } catch (e) {
      if (e && e.code === 'cancelled') return;
      if (e && AI_OFF_CODES.indexOf(e.code) !== -1) { S.aiOff = true; box.innerHTML = offMsg; if (btn) btn.hidden = true; return; }
      if (e && e.code === 'rate_limited') { box.innerHTML = '<p class="muted small" style="margin:0;">Even te veel vragen tegelijk — probeer het zo nog eens.</p>'; return; }
      if (e && e.code === 'refused') { box.innerHTML = '<p class="muted small" style="margin:0;">Daar kan de assistent niet mee helpen. Probeer je vraag anders te stellen.</p>'; return; }
      if (e && e.text) renderAskAnswer(box, e.text, false);
      box.insertAdjacentHTML('beforeend', '<p class="muted small" style="margin:0.4rem 0 0;">Het antwoord werd onderbroken. Tik nog eens op "Vraag het de assistent".</p>');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

            sb.querySelector('#bonusOk').addEventListener('click', function () { viewRanglijstClub(clubId); });
          }, true);
        } }
      ]);
    });
  }

  async function viewSpelenClub(clubId) {
    var club = S.clubsById[clubId];
    if (!club) { location.hash = '#/'; return; }
    var isHome = (S.player.homeClubIds || []).indexOf(clubId) !== -1;
    if (!isHome) { location.hash = '#/clubs/' + clubId; return; }

    var pending = await countPending();
    var balance = await pointsBalance(clubId);
    var events = await loadEvents(clubId);
    var rsvps = await loadMyRsvps(events.map(function (e) { return e.id; }));
    var attendees = await loadEventAttendees(events.map(function (e) { return e.id; }));
    var tournaments = await loadActiveTournaments(clubId);
    var tournamentsBody = (await Promise.all(tournaments.map(async function (t) {
      var standings = await tournamentRanking(clubId, t.startDate, t.endDate);
      var rows = standings.slice(0, 5).map(function (r, i) {
        return '<div style="display:flex; justify-content:space-between; padding:0.25rem 0;">' +
          '<span>' + (i + 1) + '. ' + esc(nameOf(r.playerId)) + ' ' + tournamentBadge(r.wins) + '</span>' +
          '<span class="tnum muted">' + r.wins + ' overw.</span></div>';
      }).join('') || '<p class="empty">Nog geen bevestigde partijen in dit toernooi.</p>';
      return '<div style="margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--line);">' +
        '<strong>' + esc(t.name) + '</strong> <span class="muted small tnum">' + esc(t.startDate) + ' – ' + esc(t.endDate) + '</span>' + rows + '</div>';
    }))).join('');

    var body = el('<div class="stack"></div>');
    body.innerHTML =
      wedstrijdenTabsHtml(clubId, 'spelen') +
      pageHeadHtml('<span class="eyebrow" style="color:' + clubAccent(clubId).bg + ';">' + esc(club.city) + '</span><h1>Spelen bij ' + esc(club.name) + (club.featured ? ' <span class="badge">Partnerclub</span>' : '') + '</h1>', 'clubSpelenMenuBtn') +
      pendingBanner(pending) +
      '<div class="card" id="sec-punten"><span class="eyebrow">Puntensaldo</span><div class="points-figure tnum">' + balance + '</div>' +
        rewardProgressHtml(balance) + '</div>' +
      '<div class="card" id="sec-baan"><div class="status-line"><div><h2>Baan huren</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">Je ziet direct welke banen nog vrij zijn bij ' + esc(club.name) + '</p></div>' +
        bookingLinkHtml(club, '', 'Baan huren', 'margin-top:0;') + '</div></div>' +
      '<div class="card" id="sec-evenementen"><h2>Aankomende evenementen</h2>' + eventsListHtml(events, rsvps, true, attendees) + '</div>' +
      '<div class="card" id="sec-toernooien"><h2>Toernooien</h2>' +
        (tournamentsBody || '<p class="empty">Nog geen actief toernooi. Start er een via het ⋯-menu bovenaan.</p>') + '</div>';

    renderShell(clubId, body, 'spelen');
    scrollToRequestedSection();

    function openTournamentSheet() {
      var sb = openSheet('Nieuw toernooi',
        '<p class="muted small" style="margin-top:0;">Bevestigde partijen in deze periode tellen automatisch mee, met badges voor wie goed scoort.</p>' +
        '<form id="tournamentForm">' +
        '<label for="t_name">Naam</label><input type="text" id="t_name" name="name" placeholder="bijv. Herfstreeks 2026" required>' +
        '<div class="grid-2"><div><label for="t_start">Start</label><input type="date" id="t_start" name="start" value="' + todayStr() + '" required></div>' +
        '<div><label for="t_end">Einde</label><input type="date" id="t_end" name="end" required></div></div>' +
        '<div id="tournamentError"></div><button class="btn small" type="submit">Toernooi starten</button></form>');
      sb.querySelector('#tournamentForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var errBox = sb.querySelector('#tournamentError'); errBox.innerHTML = '';
        var f = new FormData(ev.target);
        var start = f.get('start'), end = f.get('end');
        if (end < start) { errBox.innerHTML = '<p class="banner error">Einddatum moet op of na de startdatum liggen.</p>'; return; }
        await createTournament(clubId, f.get('name'), start, end);
        viewSpelenClub(clubId);
      });
    }

    document.getElementById('clubSpelenMenuBtn').addEventListener('click', function () {
      openMenu(club.name, [
        { icon: '✍️', label: 'Partij loggen', sub: 'Uitslag doorgeven bij deze club', href: '#/partij/nieuw?club=' + clubId },
        { icon: '🥇', label: 'Nieuw toernooi starten', onClick: openTournamentSheet },
        { icon: '⭐', label: 'Hoe verdien ik punten?', onClick: function () {
          openSheet('Punten bij ' + club.name,
            '<p style="margin-top:0;">Je punten zijn alleen te besteden bij ' + esc(club.name) + '.</p>' +
            '<p>Je verdient ze via de maandelijkse top-3 bonus op de clubranglijst (100 / 75 / 50).</p>' +
            '<p class="muted small">Punten voor het huren van een baan komen terug zodra Smash gekoppeld is aan het reserveringssysteem van de club — dan kunnen we zien dat een boeking echt gemaakt is.</p>' +
            rewardProgressHtml(balance));
        } },
        { icon: 'ℹ️', label: 'Over deze club', onClick: function () {
          openSheet(club.name, '<p style="margin-top:0;">' + esc(club.courtsInfo || 'Nog geen informatie toegevoegd.') + '</p>' +
            (club.website ? '<a class="website-link" href="' + esc(club.website) + '" target="_blank" rel="noopener">🔗 ' + esc(club.website.replace(/^https?:\/\//, '')) + '</a>' : '') +
            '<div class="row-actions">' + mapsLinkHtml(club) + '</div>');
        } },
        { icon: '📍', label: 'Clubpagina & recensies', href: '#/clubs/' + clubId }
      ]);
    });
    body.querySelectorAll('.rsvpBtn').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        await toggleRsvp(btn.getAttribute('data-event'), !!btn.getAttribute('data-going'));
        viewSpelenClub(clubId);
      });
    });
  }

  async function viewClubsList() {
    var body = el('<div class="stack"></div>');
    var rows = S.clubsList.map(function (c) {
      return '<tr><td><a href="#/clubs/' + c.id + '">' + esc(c.name) + '</a> ' + (c.featured ? '<span class="badge">Partnerclub</span>' : '') + '</td>' +
        '<td>' + esc(c.city) + '</td><td><a href="#/clubs/' + c.id + '">Bekijken →</a></td></tr>';
    }).join('');
    body.innerHTML = '<h1>Padelclubs</h1><div class="card" style="padding:0;"><table><thead><tr><th>Club</th><th>Plaats</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    renderShell(null, body);
  }

  var AGE_GROUPS = [
    { key: 'tot18', label: 'Tot 18', min: 0, max: 17 },
    { key: '18-25', label: '18–25', min: 18, max: 25 },
    { key: '26-35', label: '26–35', min: 26, max: 35 },
    { key: '36-45', label: '36–45', min: 36, max: 45 },
    { key: '46-55', label: '46–55', min: 46, max: 55 },
    { key: '56plus', label: '56+', min: 56, max: 200 }
  ];
  function ageGroup(key) { return AGE_GROUPS.filter(function (g) { return g.key === key; })[0] || null; }
  var GENDER_OPTS = [{ value: '', label: 'Iedereen' }, { value: 'man', label: 'Man' }, { value: 'vrouw', label: 'Vrouw' }, { value: 'anders', label: 'Anders' }];

  function knownCities() {
    var seen = {}, out = [];
    function add(c) {
      c = String(c || '').trim(); if (!c) return;
      var k = c.toLowerCase(); if (seen[k]) return;
      seen[k] = true; out.push(c.charAt(0).toUpperCase() + c.slice(1));
    }
    Object.values(S.playersById).forEach(function (p) { add(p.city); });
    S.clubsList.forEach(function (c) { add(c.city); });
    return out.sort(function (a, b) { return a.localeCompare(b, 'nl'); });
  }

  async function viewSearch(params) {
    var city = params.get('city') || '';
    var minL = params.get('min') || '';
    var maxL = params.get('max') || '';
    var clubFilter = params.get('club') || '';
    var gender = params.get('gender') || '';
    var age = params.get('age') || '';
    var ag = ageGroup(age);
    // Leeftijd en geslacht zijn optioneel in een profiel; wie ze niet invulde, valt weg zodra je erop filtert.
    function matchesPersonFilters(p) {
      if (!p) return false;
      if (gender && p.gender !== gender) return false;
      if (ag && !(p.age && Number(p.age) >= ag.min && Number(p.age) <= ag.max)) return false;
      return true;
    }
    var results = Object.values(S.playersById).filter(function (p) {
      if (p.id === S.playerId) return false;
      if (!p.onboardingComplete) return false;
      if (p.discoverable === false) return false;
      if (city && (!p.city || p.city.toLowerCase().indexOf(city.toLowerCase()) === -1)) return false;
      if (minL && Number(p.level) < Number(minL)) return false;
      if (maxL && Number(p.level) > Number(maxL)) return false;
      if (clubFilter && (p.homeClubIds || []).indexOf(clubFilter) === -1) return false;
      return matchesPersonFilters(p);
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });

    var playerCards = results.map(function (p) {
      var clubs = (p.homeClubIds || []).map(function (id) { return S.clubsById[id] ? S.clubsById[id].name : null; }).filter(Boolean).join(', ');
      var tag = playerTag(p);
      return '<div class="player-card">' +
        '<span class="player-card-level tnum">' + fmtLevel(p.level) + '</span>' +
        '<div class="player-card-name">' + esc(p.name) + '</div>' +
        '<div class="muted small">@' + esc(p.username) + (tag ? ' · ' + esc(tag) : '') + '</div>' +
        '<div class="small">📍 ' + esc(p.city || '—') + '</div>' +
        (clubs ? '<div class="small muted">🎾 ' + esc(clubs) + '</div>' : '') +
        (S.player ? '<a class="btn small" href="#/chat/' + p.id + '" style="margin-top:0.7rem;">Uitnodigen</a>' : '') +
        '</div>';
    }).join('');

    var availability = await loadAvailability();
    // Je eigen beschikbaarheid laden we los: die kan ook nog "wacht op medespelers" zijn.
    var myAvailability = null;
    if (S.player) {
      var myDoc = await S.db.doc('availability/' + S.playerId).get();
      if (myDoc.exists && availIsCurrent(myDoc.data())) myAvailability = myDoc.data();
    }
    var myRequests = S.player ? await loadAvailRequestsForMe() : [];
    var otherAvailability = availability.filter(function (a) {
      if (a.playerId === S.playerId) return false;
      var p = S.playersById[a.playerId];
      return p && p.discoverable !== false && matchesPersonFilters(p);
    });

    var availRows = otherAvailability.map(function (a) {
      var p = S.playersById[a.playerId];
      var mates = availPartners(a).map(function (id) { return S.playersById[id]; }).filter(Boolean);
      var group = [p].concat(mates);
      var tagLine = group.map(playerTag).filter(Boolean).join(' · ');
      var nameCell = mates.length
        ? '<strong>' + esc(group.map(function (x) { return x.name; }).join(' & ')) + '</strong> <span class="badge">' + (group.length === 2 ? 'Duo' : 'Trio') + '</span>' +
          '<div class="small" style="color:var(--court-strong); font-weight:700;">' + availSeekLabel(group.length) + '</div>' +
          (tagLine ? '<div class="muted small">' + esc(tagLine) + '</div>' : '')
        : esc(p.name) + '<div class="muted small">@' + esc(p.username) + (tagLine ? ' · ' + esc(tagLine) : '') + '</div>';
      var levelCell = group.map(function (x) { return fmtLevel(x.level); }).join(' / ');
      var when = availWhenLabel(a), where = availWhereLabel(a);
      return '<tr><td>' + nameCell + '</td>' +
        '<td class="tnum">' + levelCell + '</td><td>' + esc(where || '—') + '</td><td>' + esc(when || '—') +
        (a.repeat === 'weekly' ? ' <span class="badge">Wekelijks</span>' : '') + '</td>' +
        '<td class="muted small">' + timeAgo(a.createdAt) + '</td>' +
        '<td>' + (S.player ? '<button type="button" class="btn small inviteAvailBtn" data-id="' + esc(a.playerId) + '" data-city="' + esc(where) + '" data-time="' + esc(when.charAt(0).toLowerCase() + when.slice(1)) + '" data-partner-ids="' + esc(mates.map(function (x) { return x.id; }).join(',')) + '">' + (mates.length ? 'Aansluiten' : 'Uitnodigen') + '</button>' : '') + '</td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">Niemand is op dit moment beschikbaar' + (gender || ag ? ' met deze filters' : '') + '.</td></tr>';

    var requestsCard = myRequests.length ? '<div class="card" id="availRequests" style="border:2px solid var(--ball);"><h2>Doe je mee? 🎾</h2>' +
      '<p class="muted small" style="margin:0.2rem 0 0.4rem;">Deze spelers willen samen met jou online beschikbaar staan. Pas als iedereen accepteert, komt het online.</p>' +
      myRequests.map(function (r) {
        var others = availPartners(r).filter(function (id) { return id !== S.playerId; });
        return '<div class="req-row"><div style="flex:1; min-width:0;"><strong>' + esc(nameOf(r.playerId)) + '</strong>' + (others.length ? ' <span class="muted small">+ ' + esc(namesList(others)) + '</span>' : '') +
          '<div class="muted small">' + esc(availWhenLabel(r)) + ' · ' + esc(availWhereLabel(r)) + '</div></div>' +
          '<div class="row-actions" style="margin:0;"><button type="button" class="btn small availRespBtn" data-owner="' + esc(r.playerId) + '" data-req="' + esc(r.requestId || '') + '" data-ans="1">Accepteren</button>' +
          '<button type="button" class="btn secondary small availRespBtn" data-owner="' + esc(r.playerId) + '" data-req="' + esc(r.requestId || '') + '" data-ans="0">Weigeren</button></div></div>';
      }).join('') + '<div id="reqError"></div></div>' : '';

    var myMates = myAvailability ? availPartners(myAvailability) : [];
    var myStatus = myAvailability ? availStatus(myAvailability) : null;
    var myPs = (myAvailability && myAvailability.partnerStatus) || {};
    var mateChips = myMates.length ? '<div class="chip-row" style="margin-top:0.4rem;">' + myMates.map(function (id) {
      var st = myPs[id] || 'accepted';
      return '<span class="mate-chip ' + st + '">' + (st === 'accepted' ? '✅ ' : st === 'declined' ? '✖ ' : '⏳ ') + esc(nameOf(id)) + '</span>';
    }).join('') + '</div>' : '';
    var myLine = myAvailability ? esc(availWhenLabel(myAvailability)) + ' · ' + esc(availWhereLabel(myAvailability)) : '';
    var availabilityCard = !S.player ? '' :
      '<div class="card" id="availCard">' +
        (S.player.discoverable === false ? '<p class="small banner warn">Je staat op "niet vindbaar" — anderen zien je beschikbaarheid niet. <a href="#/profiel">Aanpassen</a></p>' : '') +
        (myAvailability
          ? '<div class="status-line"><div style="flex:1; min-width:12rem;">' +
              (myStatus === 'active' ? '<h2>Je staat beschikbaar ✅</h2>'
                : myStatus === 'pending' ? '<h2>⏳ Wacht op je medespelers</h2>'
                : '<h2>✖ Niet online</h2>') +
              '<p class="muted small" style="margin:0.2rem 0 0;">' + myLine +
              (myMates.length && myStatus === 'active' ? ' · samen ' + (myMates.length + 1) + ' spelers, jullie ' + availSeekLabel(myMates.length + 1).replace('zoekt', 'zoeken') : '') + '</p>' +
              mateChips +
              (myStatus === 'pending' ? '<p class="small" style="margin:0.4rem 0 0;">Je staat pas online als iedereen heeft geaccepteerd. Ze hebben een berichtje gekregen.</p>' : '') +
              (myStatus === 'declined' ? '<p class="small" style="margin:0.4rem 0 0; color:var(--danger);">Niet iedereen doet mee. Pas je beschikbaarheid aan (bijv. zonder die speler) om online te komen.</p>' : '') +
            '</div>' +
            '<div class="row-actions" style="margin-top:0;"><button type="button" class="btn small" id="availOpenBtn">Aanpassen</button>' +
            '<button class="btn secondary small" id="clearAvailBtn">Stoppen</button></div></div>'
          : '<div class="status-line"><div><h2>Zin om te spelen?</h2><p class="muted small" style="margin:0.2rem 0 0;">Laat anderen zien wanneer je kunt — alleen, of met 1 of 2 medespelers als je nog iemand zoekt.</p></div>' +
            '<button type="button" class="btn small" id="availOpenBtn" style="margin-top:0;">Beschikbaar zetten</button></div>') +
      '</div>';

    var clubFilterName = clubFilter && S.clubsById[clubFilter] ? S.clubsById[clubFilter].name : '';
    var activeFilters = [];
    if (city) activeFilters.push('📍 ' + city);
    if (clubFilterName) activeFilters.push('🎾 ' + clubFilterName);
    if (minL || maxL) activeFilters.push('Niveau ' + (minL || '1') + '–' + (maxL || '10'));
    if (gender) activeFilters.push(genderLabel(gender).charAt(0).toUpperCase() + genderLabel(gender).slice(1));
    if (ag) activeFilters.push(ag.label + ' jaar');

    var body = el('<div class="stack"></div>');
    body.innerHTML =
      '<h1>Tegenstander zoeken</h1>' +
      requestsCard +
      availabilityCard +
      '<div class="card"><div class="card-head"><h2>Nu beschikbaar</h2>' +
        '<button type="button" class="btn secondary small" id="filterOpenBtn2" style="margin-top:0;">⚙️ Filters' + (activeFilters.length ? ' (' + activeFilters.length + ')' : '') + '</button></div>' +
        '<div id="availInviteError"></div>' +
        '<div style="overflow-x:auto;"><table><thead><tr><th>Naam</th><th>Niveau</th><th>Waar</th><th>Wanneer</th><th>Geplaatst</th><th></th></tr></thead><tbody>' + availRows + '</tbody></table></div></div>' +

      var weekdayOpts = [1, 2, 3, 4, 5, 6, 0].map(function (w) { return { value: w, label: WEEKDAY_NAMES[w].slice(0, 2) }; });
      var partners = Object.values(S.playersById).filter(function (p) { return p.onboardingComplete && p.id !== S.playerId; })

      var sb = openSheet(myAvailability ? 'Beschikbaarheid aanpassen' : 'Beschikbaar zetten',

        '<span class="field-label">Hoe vaak?</span>' + chipChoiceHtml('repeat', [{ value: 'once', label: 'Eenmalig' }, { value: 'weekly', label: '🔁 Elke week herhalen' }], stA.repeat) +

          '<div class="date-more" id="av_dateMore"' + (inWeek ? ' hidden' : '') + '><input type="date" id="av_date" min="' + today + '" max="' + yearEnd + '" value="' + (inWeek ? '' : esc(stA.date)) + '" aria-label="Kies een datum">' +
          '<p class="hint" style="margin:0.3rem 0 0; color:var(--muted); font-size:0.8rem;">Elke dag tot en met 31 december kan.</p></div></div>' +
        '<div id="av_weekly"' + (stA.repeat === 'weekly' ? '' : ' hidden') + '><span class="field-label">Elke week op</span>' + chipChoiceHtml('weekday', weekdayOpts, stA.weekday) + '</div>' +
        '<div class="grid-2 keep2" style="gap:0.6rem;">' +
          '<div><span class="field-label">Vanaf</span><select id="av_from">' + timeOptionsHtml(stA.from, 6, 23) + '</select></div>' +
          '<div><span class="field-label">Hoelang</span><select id="av_dur">' + [1, 1.5, 2, 3, 4].map(function (h) {
            return '<option value="' + h + '"' + (Number(stA.dur) === h ? ' selected' : '') + '>' + String(h).replace('.', ',') + ' uur</option>';
          }).join('') + '</select></div></div>' +
        '<span class="field-label">Waar?</span>' +
        (home.length ? chipChoiceHtml('club', home.map(function (id) { return { value: id, label: S.clubsById[id].name }; }), stA.clubId) : '') +
        '<select id="av_club" style="margin-top:0.5rem;"><option value="">' + (home.length ? 'Andere club (A–Z)…' : 'Kies een club (A–Z)…') + '</option>' +
          sortedClubs().map(function (c) { return '<option value="' + c.id + '"' + (stA.clubId === c.id && home.indexOf(c.id) === -1 ? ' selected' : '') + '>' + esc(c.name) + ' (' + esc(c.city) + ')</option>'; }).join('') + '</select>' +
        '<span class="field-label">Met wie speel je al? <span class="muted" style="font-weight:400;">(optioneel, max. 2)</span></span>' +
        '<div class="partner-pick"><div id="av_partnerChosen"></div>' +
          '<div id="av_partnerFind"><div class="search-bar"><input type="search" id="av_partnerSearch" placeholder="Typ een naam, of tik hieronder iemand aan" autocomplete="off" aria-label="Zoek een duo-partner"></div>' +
          '<div class="partner-results" id="av_partnerResults"></div></div></div>' +
        '<p class="hint" style="margin:0.4rem 0 0; color:var(--muted); font-size:0.8rem;">Met z\'n tweeën of drieën en zoek je nog iemand? Kies je medespelers. Zij krijgen automatisch een berichtje om te accepteren — pas als iedereen akkoord is, sta je online.</p>' +
        '<div id="availFormError"></div>' +
        '<button class="btn" type="button" id="av_save" style="width:100%; justify-content:center;">' + (myAvailability ? 'Opslaan' : 'Beschikbaar zetten') + '</button>');
      wireChipChoice(sb, 'repeat', function (v) {
        stA.repeat = v;
        sb.querySelector('#av_once').hidden = v === 'weekly';
        sb.querySelector('#av_weekly').hidden = v !== 'weekly';
      });
      wireChipChoice(sb, 'date', function (v) {
        var more = sb.querySelector('#av_dateMore');
        if (v === 'other') { more.hidden = false; stA.date = sb.querySelector('#av_date').value || ''; try { sb.querySelector('#av_date').showPicker(); } catch (e) {} }
        else { more.hidden = true; stA.date = v; }
      });
      sb.querySelector('#av_date').addEventListener('change', function (e) { stA.date = e.target.value; });

      // Duo-partner: typen om te zoeken, of tikken op een suggestie / iemand uit de lijst.
      var suggestedPartners = recommendedPlayers(6).map(function (r) { return r.p; });
      function renderPartner() {
        var chosen = sb.querySelector('#av_partnerChosen'), find = sb.querySelector('#av_partnerFind');
        chosen.innerHTML = stA.partnerIds.length ? '<div class="chip-row">' + stA.partnerIds.map(function (id) {
          var p = S.playersById[id];
          return '<button type="button" class="chip on" data-unpick="' + esc(id) + '">' + esc(p ? p.name : id) + (p ? ' (niv. ' + fmtLevel(p.level) + ')' : '') + ' ✕</button>';
        }).join('') + '</div>' +
          '<p class="small" style="margin:0.35rem 0 0; color:var(--court-strong); font-weight:700;">Samen ' + (stA.partnerIds.length + 1) + ' spelers — jullie ' + availSeekLabel(stA.partnerIds.length + 1).replace('zoekt', 'zoeken') + '.</p>' : '';
        chosen.querySelectorAll('[data-unpick]').forEach(function (b) {
          b.addEventListener('click', function () { stA.partnerIds = stA.partnerIds.filter(function (x) { return x !== b.getAttribute('data-unpick'); }); renderPartner(); });
        });
        find.hidden = stA.partnerIds.length >= 2;
        if (find.hidden) return;
        var q = sb.querySelector('#av_partnerSearch').value.trim().toLowerCase();
        var pool = partners.filter(function (x) { return stA.partnerIds.indexOf(x.id) === -1; });
        var list = q ? pool.filter(function (x) { return ((x.name || '') + ' ' + (x.username || '')).toLowerCase().indexOf(q) !== -1; }).slice(0, 20)
          : suggestedPartners.filter(function (x) { return stA.partnerIds.indexOf(x.id) === -1; });
        sb.querySelector('#av_partnerResults').innerHTML = (!q && list.length ? '<p class="pick-head" style="margin:0.6rem 0 0.1rem;">Suggesties</p>' : '') +
          (list.length ? list.map(function (x) { return playerRowHtml(x, playerSub(x), '+'); }).join('') : '<p class="empty" style="padding:0.5rem 0;">' + (q ? 'Niemand gevonden met "' + esc(q) + '".' : 'Typ een naam om te zoeken.') + '</p>');
        sb.querySelectorAll('#av_partnerResults [data-pick-player]').forEach(function (b) {
          b.addEventListener('click', function () {
            if (stA.partnerIds.length < 2) stA.partnerIds.push(b.getAttribute('data-pick-player'));
            sb.querySelector('#av_partnerSearch').value = ''; renderPartner();
          });
        });
      }
      sb.querySelector('#av_partnerSearch').addEventListener('input', renderPartner);
      renderPartner();
      wireChipChoice(sb, 'weekday', function (v) { stA.weekday = Number(v); });
      wireChipChoice(sb, 'club', function (v) { stA.clubId = v; sb.querySelector('#av_club').value = ''; });
      sb.querySelector('#av_club').addEventListener('change', function (e) {
        if (!e.target.value) return;
        stA.clubId = e.target.value;
        sb.querySelectorAll('[data-chips="club"] .chip').forEach(function (c) { c.classList.remove('on'); });
      });
      sb.querySelector('#av_save').addEventListener('click', async function (ev) {
        var err = sb.querySelector('#availFormError'); err.innerHTML = '';
        var from = sb.querySelector('#av_from').value, dur = Number(sb.querySelector('#av_dur').value);
        if (!stA.clubId) { err.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Kies een club.</p>'; return; }
        if (stA.repeat === 'once' && !stA.date) { err.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Kies een datum.</p>'; return; }
        if (stA.repeat === 'once' && new Date(stA.date + 'T' + from + ':00').getTime() + dur * 3600000 < Date.now()) {
          err.innerHTML = '<p class="banner error" style="margin:0.8rem 0 0;">Dit tijdstip is vandaag al voorbij — kies een latere tijd of een andere dag.</p>'; return;
        }
        ev.target.disabled = true;

          await setAvailability({ clubId: stA.clubId, repeat: stA.repeat, date: stA.date, weekday: stA.weekday, from: from, durationHours: dur, partnerIds: stA.partnerIds });

        catch (e) { document.getElementById('reqError').innerHTML = '<p class="banner error" style="margin:0.6rem 0 0;">' + esc(e.message) + '</p>'; b.disabled = false; }
      });
    });

    if (clearBtn) clearBtn.addEventListener('click', async function () {
      await clearAvailability();
      viewSearch(params);
    });

    var availInviteError = document.getElementById('availInviteError');
    Array.prototype.slice.call(body.querySelectorAll('.inviteAvailBtn')).forEach(function (invBtn) {
      invBtn.addEventListener('click', async function () {
        invBtn.disabled = true; invBtn.textContent = 'Versturen…';
        try {
          await inviteToPlay(invBtn.getAttribute('data-id'), {
            city: invBtn.getAttribute('data-city'), time: invBtn.getAttribute('data-time'),
            partnerIds: (invBtn.getAttribute('data-partner-ids') || '').split(',').filter(Boolean)
          });
        } catch (e) {
          invBtn.disabled = false; invBtn.textContent = 'Uitnodigen';
          if (availInviteError) availInviteError.innerHTML = '<p class="banner error">' + esc(e.message) + '</p>';

  // ---------- partij loggen (stappenplan: club → spelers → sets) ----------
  // Bijna alles gaat met tikken. Per set geef je aan wie samen in een team speelden, zodat
  // wisselen van partner tussen sets gewoon kan. Blijven de teams de hele partij gelijk, dan
  // telt het (net als vroeger) als één partij; wisselen de teams, dan telt elke gewonnen set
  // als persoonlijke overwinning. Iemand zonder Smash-account voeg je toe als "onbekende speler",
  // zodat je de partij altijd kunt loggen.

  var ML_MAX_SETS = 10, ML_MAX_PLAYERS = 8;

  async function mlSuggestions() {
    var ids = [];
    function push(id) {
      var p = S.playersById[id];
      if (id && id !== S.playerId && p && p.onboardingComplete && ids.indexOf(id) === -1) ids.push(id);
    }
    try { (await loadMyFriendGroups()).forEach(function (g) { (g.memberIds || []).forEach(push); }); } catch (e) {}
    try { (await loadChatPartnerIds()).forEach(push); } catch (e) {}
    var my = S.player.homeClubIds || [];
    Object.values(S.playersById).filter(function (p) {
      return (p.homeClubIds || []).some(function (c) { return my.indexOf(c) !== -1; });
    }).forEach(function (p) { push(p.id); });
    return ids.slice(0, 12);
  }

  async function viewMatchNew(preselect) {
    var homeIds = (S.player.homeClubIds || []).filter(function (id) { return S.clubsById[id]; });
    var st = {
      step: 0,
      clubId: (preselect && S.clubsById[preselect]) ? preselect : (homeIds[0] || null),
      players: [S.playerId],
      guestNames: {},
      guestSeq: 0,
      sets: [],
      setsFor: '',
      error: '',
      done: null
    };
    var suggestions = await mlSuggestions();
    var body = el('<div class="stack"></div>');
    body.innerHTML = '<div><span class="eyebrow">Uitslag doorgeven</span><h1>Partij loggen</h1>' +
      '<p class="muted small" style="margin:0.2rem 0 0;">Alles gaat met tikken. Spelers met een Smash-account bevestigen de uitslag daarna nog.</p></div>' +
      '<div class="card" id="mlCard"></div>';
    renderShell(preselect && S.clubsById[preselect] && homeIds.indexOf(preselect) !== -1 ? preselect : 'algemeen', body, 'spelen');
    var card = body.querySelector('#mlCard');

    function nm(id) { return id === S.playerId ? 'Jij' : matchName(st, id); }
    function others() { return st.players.filter(function (id) { return id !== S.playerId; }); }
    function needsRest() { return st.players.length !== 2 && st.players.length !== 4; }

    function defaultTeams() {
      var t = {}, o = others();
      st.players.forEach(function (id) { t[id] = 0; });
      t[S.playerId] = 1;
      if (o.length === 1) { t[o[0]] = 2; }
      else if (o.length === 2) { t[o[0]] = 2; }
      else if (o.length >= 3) { t[o[0]] = 1; t[o[1]] = 2; t[o[2]] = 2; }
      return t;
    }
    function ensureSets() {
      var key = st.players.join(',');
      if (st.setsFor === key && st.sets.length) return;
      st.setsFor = key;
      st.sets = [{ teams: defaultTeams(), scoreA: null, scoreB: null }];
    }
    function teamIds(s, n) { return st.players.filter(function (id) { return s.teams[id] === n; }); }
    function setError(s) {
      var a = teamIds(s, 1), b = teamIds(s, 2);
      if (!a.length || !b.length) return 'Zet in beide teams minstens één speler.';
      if (a.length > 2 || b.length > 2) return 'Een team bestaat uit 1 of 2 spelers.';
      if (a.length !== b.length) return 'Beide teams moeten evenveel spelers hebben (1 tegen 1 of 2 tegen 2).';
      if (s.scoreA == null || s.scoreB == null) return 'Tik de score van beide teams aan.';
      if (s.scoreA === s.scoreB) return 'Een set kan niet gelijk eindigen.';
      return '';
    }

    function stepsBar() {
      return '<div class="ml-steps">' + [0, 1, 2].map(function (i) { return '<span' + (i <= st.step ? ' class="on"' : '') + '></span>'; }).join('') + '</div>';
    }
    function navHtml(nextLabel, nextAct) {
      return (st.error ? '<p class="banner error" style="margin:1rem 0 0;">' + esc(st.error) + '</p>' : '') +
        '<div class="row-actions" style="margin-top:1.1rem;">' +
        (st.step > 0 ? '<button type="button" class="btn secondary" data-act="back" style="margin-top:0;">Vorige</button>' : '') +
        '<button type="button" class="btn" data-act="' + nextAct + '" style="margin-top:0; flex:1; justify-content:center;">' + esc(nextLabel) + '</button></div>';
    }

    function renderClubStep() {
      var cur = st.clubId ? S.clubsById[st.clubId] : null;
      var curIsHome = cur && homeIds.indexOf(cur.id) !== -1;
      return stepsBar() + '<h2>Waar speelden jullie?</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">Elke club kan — ook een club die niet jouw thuisclub is.</p>' +
        (homeIds.length ? '<span class="field-label">Jouw clubs</span><div class="chip-row">' + homeIds.map(function (id) {
          return '<button type="button" class="chip' + (st.clubId === id ? ' on' : '') + '" data-act="club" data-id="' + esc(id) + '">' + esc(S.clubsById[id].name) + '</button>';
        }).join('') + '</div>' : '') +
        '<span class="field-label">' + (homeIds.length ? 'Ergens anders?' : 'Kies de club') + '</span><div class="chip-row">' +
        (cur && !curIsHome ? '<button type="button" class="chip on" data-act="pickclub">' + esc(cur.name) + ' (' + esc(cur.city) + ')</button>' : '') +
        '<button type="button" class="chip add" data-act="pickclub">🔍 ' + (cur && !curIsHome ? 'Andere club kiezen' : 'Kies uit alle clubs (A–Z)') + '</button></div>' +
        navHtml('Volgende', 'next');
    }

    function renderPlayersStep() {
      var sugg = suggestions.filter(function (id) { return S.playersById[id]; });
      return stepsBar() + '<h2>Wie speelden er mee?</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">Jij staat er al bij. Tik de anderen aan (max. ' + ML_MAX_PLAYERS + ').</p>' +
        '<span class="field-label">Meegespeeld (' + st.players.length + ')</span><div class="ml-chosen">' +
        st.players.map(function (id) {
          return id === S.playerId ? '<span class="chip">Jij</span>'
            : '<button type="button" class="chip" data-act="remove" data-id="' + esc(id) + '">' + esc(nm(id)) + ' ✕</button>';
        }).join('') + '</div>' +
        (sugg.length ? '<span class="field-label">Snel kiezen</span><div class="chip-row">' + sugg.map(function (id) {
          var on = st.players.indexOf(id) !== -1;
          return '<button type="button" class="chip' + (on ? ' on' : ' ghost') + '" data-act="toggle" data-id="' + esc(id) + '">' + (on ? '✓ ' : '+ ') + esc(nameOf(id)) + '</button>';
        }).join('') + '</div>' : '') +
        '<span class="field-label">Niet in de lijst?</span><div class="chip-row">' +
        '<button type="button" class="chip add" data-act="search">🔍 Zoek een speler</button>' +
        '<button type="button" class="chip add" data-act="guest">+ Onbekende speler (heeft de app niet)</button></div>' +
        '<p class="hint" style="margin:0.5rem 0 0; color:var(--muted); font-size:0.82rem;">Speelde er iemand mee zonder Smash? Voeg een onbekende speler toe — dan kun je de partij gewoon loggen. Die speler telt niet mee op de ranglijst.</p>' +
        navHtml('Volgende', 'next');
    }

    function scoreRowHtml(i, side, val, label) {
      var pills = '';
      for (var n = 0; n <= 7; n++) pills += '<button type="button" class="' + (val === n ? 'on' : '') + '" data-act="score" data-set="' + i + '" data-side="' + side + '" data-val="' + n + '">' + n + '</button>';
      return '<div class="score-row ' + (side === 'A' ? 't1' : 't2') + '"><span class="score-row-label">' + esc(label) + '</span><div class="score-pills">' + pills + '</div></div>';
    }

    function renderSetsStep() {
      ensureSets();
      var rest = needsRest();
      return stepsBar() + '<h2>Wie speelde met wie?</h2>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">Tik per set bij elke speler het team aan, en daarna de score. Van partner gewisseld? Pas het gewoon aan bij de volgende set.</p>' +
        st.sets.map(function (s, i) {
          var a = teamIds(s, 1), b = teamIds(s, 2), err = setError(s);
          return '<div class="ml-set"><div class="ml-set-head"><h3>Set ' + (i + 1) + '</h3>' +
            (i > 0 ? '<button type="button" class="btn secondary small" data-act="delset" data-set="' + i + '">Verwijderen</button>' : '') + '</div>' +
            st.players.map(function (id) {
              var t = s.teams[id] || 0;
              return '<div class="ml-prow"><span class="ml-prow-name">' + esc(nm(id)) + '</span><span class="team-seg">' +
                '<button type="button" class="t1' + (t === 1 ? ' on' : '') + '" data-act="team" data-set="' + i + '" data-id="' + esc(id) + '" data-team="1">Team 1</button>' +
                '<button type="button" class="t2' + (t === 2 ? ' on' : '') + '" data-act="team" data-set="' + i + '" data-id="' + esc(id) + '" data-team="2">Team 2</button>' +
                (rest ? '<button type="button" class="t0' + (t === 0 ? ' on' : '') + '" data-act="team" data-set="' + i + '" data-id="' + esc(id) + '" data-team="0">Rust</button>' : '') +
                '</span></div>';
            }).join('') +
            '<p class="ml-summary"><span class="t1">' + esc(a.length ? a.map(nm).join(' & ') : '…') + '</span> tegen <span class="t2">' + esc(b.length ? b.map(nm).join(' & ') : '…') + '</span></p>' +
            scoreRowHtml(i, 'A', s.scoreA, 'Team 1') + scoreRowHtml(i, 'B', s.scoreB, 'Team 2') +
            (err && (s.scoreA != null || s.scoreB != null || st.triedSubmit) ? '<p class="small" style="color:var(--danger); margin:0.5rem 0 0;">' + esc(err) + '</p>' : '') +
            '</div>';
        }).join('') +
        (st.sets.length < ML_MAX_SETS
          ? '<button type="button" class="chip add" data-act="addset" style="margin-top:0.8rem;">+ Set ' + (st.sets.length + 1) + ' toevoegen <span class="muted">(max. ' + ML_MAX_SETS + ')</span></button>'
          : '<p class="muted small" style="margin-top:0.8rem;">Maximaal ' + ML_MAX_SETS + ' sets.</p>') +
        '<p class="muted small" style="margin:0.8rem 0 0;">Steeds dezelfde teams? Dan telt het als één partij. Wisselende partners? Dan krijgt iedereen per gewonnen set een persoonlijke overwinning op de ranglijst.</p>' +
        navHtml('Uitslag doorgeven', 'submit');
    }

    function renderDone() {
      var d = st.done;
      return '<h2>✅ Uitslag doorgegeven</h2>' +
        (d.waiting.length
          ? '<p class="muted" style="margin:0.4rem 0 0;">Nog even wachten op de bevestiging van ' + esc(d.waiting.map(nameOf).join(', ')) + '. Daarna telt hij mee voor de ranglijst.</p>'
          : '<p class="muted" style="margin:0.4rem 0 0;">Telt meteen mee voor de ranglijst en staat in de feed.</p>') +
        '<div style="margin-top:0.8rem;">' + matchSetsHtml(d.match) + '</div>' +
        '<div class="row-actions" style="flex-wrap:wrap;"><button type="button" class="btn small" data-act="again">Nog een partij loggen</button>' +
        '<a class="btn secondary small" href="#/spelen">Naar Spelen</a></div>';
    }

    function render() {
      if (st.done) { card.innerHTML = renderDone(); return; }
      card.innerHTML = st.step === 0 ? renderClubStep() : st.step === 1 ? renderPlayersStep() : renderSetsStep();
    }

    function addPlayer(id) {
      if (st.players.indexOf(id) !== -1) return;
      if (st.players.length >= ML_MAX_PLAYERS) { st.error = 'Maximaal ' + ML_MAX_PLAYERS + ' spelers per partij.'; return; }
      st.players.push(id);
    }

    async function submit() {
      st.triedSubmit = true;
      var bad = st.sets.map(setError).map(function (e, i) { return e ? 'Set ' + (i + 1) + ': ' + e : ''; }).filter(Boolean);
      if (bad.length) { st.error = bad[0]; render(); return; }
      if (!st.clubId) { st.error = 'Kies eerst een club.'; st.step = 0; render(); return; }
      function sig(ids) { return ids.slice().sort().join(','); }
      var sets = st.sets.map(function (s) { return { a: teamIds(s, 1), b: teamIds(s, 2), scoreA: s.scoreA, scoreB: s.scoreB }; });
      var base = sets[0], rotating = false;
      sets.forEach(function (s) {
        if (sig(s.a) === sig(base.a) && sig(s.b) === sig(base.b)) return;
        if (sig(s.a) === sig(base.b) && sig(s.b) === sig(base.a)) {
          var t = s.a; s.a = s.b; s.b = t; var sc = s.scoreA; s.scoreA = s.scoreB; s.scoreB = sc; return;
        }
        rotating = true;
      });
      var winnerSide = null;
      if (!rotating) {
        var aSets = sets.filter(function (s) { return s.scoreA > s.scoreB; }).length;
        if (aSets * 2 === sets.length) { st.error = 'Evenveel sets gewonnen — voeg de beslissende set toe.'; render(); return; }
        winnerSide = aSets * 2 > sets.length ? 'A' : 'B';
      }
      var played = st.players.filter(function (id) { return sets.some(function (s) { return s.a.indexOf(id) !== -1 || s.b.indexOf(id) !== -1; }); });
      var participants = played.map(function (id) {
        return {
          playerId: id,
          side: rotating ? null : (base.a.indexOf(id) !== -1 ? 'A' : (base.b.indexOf(id) !== -1 ? 'B' : null)),
          confirmed: id === S.playerId || isGuestId(id)
        };
      });
      var guestNames = {};
      played.forEach(function (id) { if (isGuestId(id)) guestNames[id] = st.guestNames[id]; });
      var allConfirmed = participants.every(function (p) { return p.confirmed; });
      var doc = {
        clubId: st.clubId, score: sets.map(function (s) { return s.scoreA + '-' + s.scoreB; }).join(', '),
        winnerSide: winnerSide, rotating: rotating, sets: sets, guestNames: guestNames,
        submittedBy: S.playerId, status: allConfirmed ? 'confirmed' : 'pending', participants: participants,
        playedAt: new Date().toISOString(), period: PERIOD_NOW, createdAt: new Date().toISOString()
      };
      var btn = card.querySelector('[data-act=submit]'); if (btn) btn.disabled = true;
      try {
        var matchRef = await S.db.collection('matches').add(doc);
        var registered = played.filter(function (id) { return !isGuestId(id); });
        if (registered.length > 2) await ensureGroupChatForMatch(matchRef.id, st.clubId, registered);
        if (allConfirmed) {
          await createPost({ type: 'matchResult', clubId: st.clubId, participants: participants, score: doc.score, winnerSide: winnerSide, sets: sets, rotating: rotating, guestNames: guestNames });
          await refreshMyGroupChats(true);
        }
        st.done = { match: doc, waiting: participants.filter(function (p) { return !p.confirmed; }).map(function (p) { return p.playerId; }) };
        st.error = '';
        render();
      } catch (e) {
        st.error = (e && e.message) || 'Opslaan lukte niet. Probeer het nog eens.';
        render();
      }
    }

    card.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
      var act = b.getAttribute('data-act');
      var id = b.getAttribute('data-id');
      var si = Number(b.getAttribute('data-set'));
      if (act !== 'submit') st.error = '';
      if (act === 'club') { st.clubId = id; }
      else if (act === 'pickclub') {
        openClubPickSheet('Bij welke club?', { selected: st.clubId }, function (cid) { st.clubId = cid; render(); });
        return;
      }
      else if (act === 'next') {
        if (st.step === 0 && !st.clubId) { st.error = 'Kies eerst een club.'; }
        else if (st.step === 1 && st.players.length < 2) { st.error = 'Kies minstens één andere speler.'; }
        else { st.step++; window.scrollTo({ top: 0, behavior: 'smooth' }); }
      }
      else if (act === 'back') { st.step = Math.max(0, st.step - 1); }
      else if (act === 'toggle') {
        if (st.players.indexOf(id) !== -1) st.players = st.players.filter(function (x) { return x !== id; });
        else addPlayer(id);
      }
      else if (act === 'remove') { st.players = st.players.filter(function (x) { return x !== id; }); }
      else if (act === 'search') {
        openPlayerPickSheet('Speler toevoegen', { exclude: st.players.filter(function (x) { return !isGuestId(x); }) }, function (pid) {
          closeSheet(true); addPlayer(pid); render();
        });
        return;
      }
      else if (act === 'guest') {
        if (st.players.length >= ML_MAX_PLAYERS) { st.error = 'Maximaal ' + ML_MAX_PLAYERS + ' spelers per partij.'; }
        else {
          st.guestSeq++;
          var gid = 'gast:' + st.guestSeq;
          var nGuests = st.players.filter(isGuestId).length + 1;
          st.guestNames[gid] = 'Onbekende speler' + (nGuests > 1 || st.guestSeq > 1 ? ' ' + st.guestSeq : '');
          st.players.push(gid);
        }
      }
      else if (act === 'team') { st.sets[si].teams[id] = Number(b.getAttribute('data-team')); }
      else if (act === 'score') {
        var v = Number(b.getAttribute('data-val'));
        if (b.getAttribute('data-side') === 'A') st.sets[si].scoreA = v; else st.sets[si].scoreB = v;
      }
      else if (act === 'addset') {
        var prev = st.sets[st.sets.length - 1];
        st.sets.push({ teams: Object.assign({}, prev.teams), scoreA: null, scoreB: null });
      }
      else if (act === 'delset') { st.sets.splice(si, 1); }
      else if (act === 'submit') { submit(); return; }
      else if (act === 'again') { viewMatchNew(preselect); return; }
      render();
    });

    render();
  }

  async function findByUsername(username) {
    if (!username) return null;
    username = username.trim().toLowerCase();
    var snap = await S.db.collection('players').where('username', '==', username).get();
    if (snap.empty) return null;
    var d = snap.docs[0];
    return Object.assign({ id: d.id }, d.data());
  }

  async function viewPending() {
    var snap = await S.db.collection('matches').where('status', '==', 'pending').get();
    var mine = [];
    snap.docs.forEach(function (d) {
      var m = d.data();
      var meP = m.participants.find(function (p) { return p.playerId === S.playerId; });
      if (meP && !meP.confirmed) mine.push({ id: d.id, data: m });
    });
    mine.sort(function (x, y) { return (y.data.createdAt || '').localeCompare(x.data.createdAt || ''); });

    var body = el('<div class="stack"></div>');

      var m = row.data; var club = S.clubsById[m.clubId];
      return '<div class="card"><p><strong>' + esc(club ? club.name : '') + '</strong> — ' + esc((m.playedAt || '').slice(0, 10)) + '</p>' +
        (m.sets && m.sets.length ? '<div style="margin:0.5rem 0;">' + matchSetsHtml(m) + '</div>' : '<p>Score: <strong>' + esc(m.score) + '</strong></p>') +
