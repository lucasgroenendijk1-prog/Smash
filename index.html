  // ---------- eigenaar-dashboard (alleen zichtbaar voor de eigenaar van de app) ----------

  var DASH_AGE = [
    { label: '16–17', min: 16, max: 17 }, { label: '18–25', min: 18, max: 25 }, { label: '26–35', min: 26, max: 35 },
    { label: '36–45', min: 36, max: 45 }, { label: '46–55', min: 46, max: 55 }, { label: '56+', min: 56, max: 200 }
  ];
  var DASH_LEVEL = [
    { label: '1–2,5 (top)', min: 0, max: 2.5 }, { label: '3–4,5', min: 3, max: 4.5 }, { label: '5–6,5', min: 5, max: 6.5 },
    { label: '7–8,5', min: 7, max: 8.5 }, { label: '9–10 (beginner)', min: 9, max: 10 }
  ];
  var WD_SHORT = ['Zo', 'Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za'];

  function ageBucket(a) { a = Number(a); if (!a) return 'Onbekend'; for (var i = 0; i < DASH_AGE.length; i++) if (a >= DASH_AGE[i].min && a <= DASH_AGE[i].max) return DASH_AGE[i].label; return 'Onbekend'; }
  function levelBucket(l) { l = Number(l); if (isNaN(l)) return 'Onbekend'; for (var i = 0; i < DASH_LEVEL.length; i++) if (l >= DASH_LEVEL[i].min && l <= DASH_LEVEL[i].max) return DASH_LEVEL[i].label; return 'Onbekend'; }
  function genderBucket(g) { return g === 'man' ? 'Man' : g === 'vrouw' ? 'Vrouw' : g === 'anders' ? 'Anders' : 'Niet ingevuld'; }
  function cityKey(c) { c = String(c || '').trim(); return c ? c.charAt(0).toUpperCase() + c.slice(1).toLowerCase() : 'Onbekend'; }
  function hourBucket(h) { return h < 12 ? 'Ochtend (tot 12u)' : h < 17 ? 'Middag (12–17u)' : h < 20 ? 'Vroege avond (17–20u)' : 'Avond (na 20u)'; }

  function countBy(list, fn, order) {
    var m = {};
    list.forEach(function (x) { var k = fn(x); if (k == null) return; m[k] = (m[k] || 0) + 1; });
    var keys = order ? order.filter(function (k) { return m[k]; }).concat(Object.keys(m).filter(function (k) { return order.indexOf(k) === -1; }))
      : Object.keys(m).sort(function (a, b) { return m[b] - m[a]; });
    return keys.map(function (k) { return { label: k, n: m[k] }; });
  }
  // Kleine groepjes samenvoegen zodat niemand in een clubrapport herkenbaar is.
  function suppressSmall(rows) {
    var out = [], other = 0;
    rows.forEach(function (r) { if (r.n < SMALL_CELL) other += r.n; else out.push(r); });
    if (other) out.push({ label: 'Overig (kleine groepen)', n: other });
    return out;
  }
  function barsHtml(rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<p class="empty" style="padding:0;">Nog geen gegevens.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; })) || 1;
    var total = rows.reduce(function (s, r) { return s + r.n; }, 0) || 1;
    return '<div class="dash-bars">' + rows.slice(0, opts.limit || 12).map(function (r) {
      return '<div class="dash-bar"><span class="dash-bar-l">' + esc(r.label) + '</span>' +
        '<span class="dash-bar-t"><span style="width:' + Math.max(3, Math.round(r.n / max * 100)) + '%"></span></span>' +
        '<span class="dash-bar-n tnum">' + r.n + (opts.pct ? ' <span class="muted">(' + Math.round(r.n / total * 100) + '%)</span>' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  function kpiHtml(value, label, sub) {
    return '<div class="dash-kpi"><div class="dash-kpi-v tnum">' + value + '</div><div class="dash-kpi-l">' + esc(label) + '</div>' + (sub ? '<div class="dash-kpi-s">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function daysAgo(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity; }
  function fmtAgo(iso) { if (!iso) return '—'; var d = Math.floor(daysAgo(iso)); return d < 1 ? 'vandaag' : d === 1 ? 'gisteren' : d + ' d geleden'; }

  async function loadDashData() {
    await loadAllPlayers();
    async function all(col) { try { var s = await S.db.collection(col).get(); return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); } catch (e) { return []; } }
    var res = await Promise.all([all('matches'), all('posts'), all('messages'), all('plannen'), all('analytics'), all('orders'), all('availability'), all('eventRsvps'), all('events')]);
    return { matches: res[0], posts: res[1], messages: res[2], plans: res[3], analytics: res[4], orders: res[5], availability: res[6], rsvps: res[7], events: res[8] };
  }

  // Houdt de statistieken netjes: records van spelers zonder toestemming, verwijderde spelers
  // of die langer dan 2 jaar niet actief waren, worden opgeruimd (alleen de eigenaar mag dit).
  async function cleanupAnalytics(docs) {
    for (var i = 0; i < docs.length; i++) {
      var d = docs[i], players = d.players || {}, changed = false;
      Object.keys(players).forEach(function (pid) {
        var p = S.playersById[pid];
        if (!p || !analyticsAllowed(p) || daysAgo(players[pid].lastSeen) > ANALYTICS_KEEP_DAYS) { delete players[pid]; changed = true; }
      });
      if (!changed) continue;
      try {
        var payload = Object.assign({}, d); delete payload.id;
        if (Object.keys(players).length) await S.db.doc('analytics/' + d.id).set(payload);
        else await S.db.doc('analytics/' + d.id).delete();
      } catch (e) {}
    }
  }

  function buildDash(D) {
    var consenting = Object.values(S.playersById).filter(function (p) { return p.onboardingComplete && analyticsAllowed(p); });
    var allOnboarded = Object.values(S.playersById).filter(function (p) { return p.onboardingComplete; });
    var st = {};
    consenting.forEach(function (p) {
      st[p.id] = { p: p, matches: 0, matches90: 0, wins: 0, posts: 0, photos: 0, invites: 0, plans: 0, clubs: {}, features: {}, featureUses: 0,
        days: {}, sessions: 0, lastSeen: null, firstSeen: null, orders: 0, spend: 0, events: 0, reviews: 0 };
    });
    var confirmed = D.matches.filter(function (m) { return m.status === 'confirmed'; });
    confirmed.forEach(function (m) {
      var out = matchOutcomes(m);
      (m.participants || []).forEach(function (pp) {
        var s = st[pp.playerId]; if (!s) return;
        s.matches++;
        if (daysAgo(m.playedAt || m.createdAt) <= 90) s.matches90++;
        if (out[pp.playerId]) s.wins += out[pp.playerId].wins;
        if (m.clubId) s.clubs[m.clubId] = (s.clubs[m.clubId] || 0) + 1;
      });
    });
    D.posts.forEach(function (p) {
      var s = st[p.authorId]; if (!s || p.type === 'matchResult') return;
      s.posts++; if (p.imageDataUrl) s.photos++;
      if (p.clubId) s.clubs[p.clubId] = s.clubs[p.clubId] || 0;
    });
    D.messages.forEach(function (m) {
      var s = st[m.senderId]; if (!s) return;
      if (m.planCode || m.availRequest || (m.text && m.text.indexOf('via Smash —') !== -1)) s.invites++;
    });
    D.plans.forEach(function (pl) { var s = st[pl.organizerId]; if (s) s.plans++; });
    D.orders.forEach(function (o) { var s = st[o.playerId]; if (s) { s.orders++; s.spend += Number(o.price) || 0; } });
    D.rsvps.forEach(function (r) { var s = st[r.playerId]; if (s) s.events++; });
    D.availability.forEach(function (a) { var s = st[a.playerId]; if (s && a.clubId) s.clubs[a.clubId] = s.clubs[a.clubId] || 0; });
    D.analytics.forEach(function (doc) {
      Object.keys(doc.players || {}).forEach(function (pid) {
        var s = st[pid], r = doc.players[pid]; if (!s || !r) return;
        Object.keys(r.features || {}).forEach(function (k) { s.features[k] = (s.features[k] || 0) + r.features[k]; s.featureUses += r.features[k]; });
        Object.keys(r.days || {}).forEach(function (k) { s.days[k] = true; });
        s.sessions += r.sessions || 0;
        if (!s.lastSeen || r.lastSeen > s.lastSeen) s.lastSeen = r.lastSeen;
        if (!s.firstSeen || r.firstSeen < s.firstSeen) s.firstSeen = r.firstSeen;
      });
    });
    var list = Object.values(st);
    list.forEach(function (s) {
      (s.p.homeClubIds || []).forEach(function (c) { s.clubs[c] = s.clubs[c] || 0; });
      var ids = Object.keys(s.clubs).filter(function (c) { return S.clubsById[c]; });
      ids.sort(function (a, b) { return s.clubs[b] - s.clubs[a]; });
      s.clubIds = ids;
      s.favClub = ids.length ? ids[0] : null;
      s.featuresUsed = Object.keys(s.features).length;
      s.activeDays = Object.keys(s.days).length;
      s.activeDays30 = Object.keys(s.days).filter(function (d) { return daysAgo(d + 'T12:00:00') <= 30; }).length;
      s.perWeek = Math.round(s.matches90 / 13 * 10) / 10;
      s.score = s.matches * 3 + s.posts * 2 + s.invites * 2 + s.activeDays30;
    });
    return { list: list, consenting: consenting, allOnboarded: allOnboarded, confirmed: confirmed };
  }

  function clubPlayers(B, cid) { return B.list.filter(function (s) { return s.clubIds.indexOf(cid) !== -1; }); }

  function clubReportData(B, cid) {
    var players = clubPlayers(B, cid);
    var matches = B.confirmed.filter(function (m) { return m.clubId === cid; });
    var other = {};
    players.forEach(function (s) { s.clubIds.forEach(function (c) { if (c !== cid) other[c] = (other[c] || 0) + 1; }); });
    var months = {};
    for (var i = 5; i >= 0; i--) { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months[d.toISOString().slice(0, 7)] = 0; }
    matches.forEach(function (m) { var k = String(m.playedAt || m.createdAt || '').slice(0, 7); if (k in months) months[k]++; });
    return {
      club: S.clubsById[cid], players: players, enough: players.length >= CLUB_REPORT_MIN,
      age: suppressSmall(countBy(players, function (s) { return ageBucket(s.p.age); }, DASH_AGE.map(function (a) { return a.label; }).concat(['Onbekend']))),
      gender: suppressSmall(countBy(players, function (s) { return genderBucket(s.p.gender); }, ['Man', 'Vrouw', 'Anders', 'Niet ingevuld'])),
      level: suppressSmall(countBy(players, function (s) { return levelBucket(s.p.level); }, DASH_LEVEL.map(function (a) { return a.label; }))),
      city: suppressSmall(countBy(players, function (s) { return cityKey(s.p.city); })),
      weekday: countBy(matches, function (m) { var d = new Date(m.playedAt || m.createdAt); return isNaN(d) ? null : WD_SHORT[d.getDay()]; }, ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo']),
      hours: countBy(matches, function (m) { var d = new Date(m.playedAt || m.createdAt); return isNaN(d) ? null : hourBucket(d.getHours()); }, ['Ochtend (tot 12u)', 'Middag (12–17u)', 'Vroege avond (17–20u)', 'Avond (na 20u)']),
      months: Object.keys(months).map(function (k) { return { label: MONTHS[Number(k.slice(5)) - 1] + ' ' + k.slice(2, 4), n: months[k] }; }),
      alsoPlays: suppressSmall(Object.keys(other).filter(function (c) { return S.clubsById[c]; }).map(function (c) { return { label: S.clubsById[c].name, n: other[c] }; }).sort(function (a, b) { return b.n - a.n; })).slice(0, 5),
      matchCount: matches.length,
      active30: players.filter(function (s) { return daysAgo(s.lastSeen) <= 30; }).length
    };
  }

  function clubReportText(R) {
    function lines(rows) { return rows.map(function (r) { return '  - ' + r.label + ': ' + r.n; }).join('\n') || '  (nog geen gegevens)'; }
    return 'Smash — spelersrapport ' + R.club.name + ' (' + R.club.city + ')\n' +
      'Gemaakt op ' + new Date().toLocaleDateString('nl-NL') + '. Anoniem: alleen totalen, groepen kleiner dan ' + SMALL_CELL + ' zijn samengevoegd.\n\n' +
      'Spelers op Smash met een band met jullie club: ' + R.players.length + ' (waarvan ' + R.active30 + ' actief in de laatste 30 dagen)\n' +
      'Gelogde partijen bij jullie club: ' + R.matchCount + '\n\n' +
      'Leeftijd:\n' + lines(R.age) + '\n\nGeslacht:\n' + lines(R.gender) + '\n\nNiveau (1 = hoogst):\n' + lines(R.level) + '\n\nWoonplaats:\n' + lines(R.city) + '\n\n' +
      'Drukste dagen (partijen):\n' + lines(R.weekday) + '\n\nDrukste tijden (partijen):\n' + lines(R.hours) + '\n\n' +
      'Partijen per maand:\n' + lines(R.months) + '\n\nSpelen ook bij:\n' + lines(R.alsoPlays) + '\n';
  }

  function csvCell(v) { v = v == null ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

  async function viewOwner() {

      body.innerHTML = '<h1>Geen toegang</h1><div class="card"><p style="margin:0;">Dit onderdeel is alleen voor de eigenaar van Smash.</p></div>';

        '<div class="card"><h2>Geslacht</h2>' + barsHtml(countBy(L, function (s) { return genderBucket(s.p.gender); }, ['Man', 'Vrouw', 'Anders', 'Niet ingevuld']), { pct: true }) + '</div>' +
        '<div class="card"><h2>Niveau</h2>' + barsHtml(countBy(L, function (s) { return levelBucket(s.p.level); }, DASH_LEVEL.map(function (a) { return a.label; })), { pct: true }) + '</div>' +

        }, ['2+ keer per week', '1–2 keer per week', 'Paar keer per maand', '1 keer in 3 maanden', 'Niet gelogd (90 d)']), { pct: true }) + '</div>' +
        '<div class="card"><h2>Favoriete club</h2>' + barsHtml(countBy(L, function (s) { return s.favClub ? S.clubsById[s.favClub].name : 'Nog geen'; }), { limit: 8 }) + '</div>' +
      '</div>';

    }).filter(function (r) { return r.players || r.matches; }).sort(function (a, b) { return b.players - a.players || b.matches - a.matches; });

      '<p class="muted small" style="margin:0;">Een club krijgt pas een rapport vanaf ' + CLUB_REPORT_MIN + ' spelers, zodat niemand herkenbaar is. Tik een club aan.</p>';

    // --- Spelers ---
    var spelersTab =
      '<div class="dash-tools"><div class="search-bar" style="flex:1; min-width:10rem;"><input type="search" id="dashSearch" placeholder="Zoek op naam, plaats of club"></div>' +

    L.forEach(function (s) { Object.keys(s.features).forEach(function (k) { var f = feat[k] = feat[k] || { users: 0, uses: 0 }; f.users++; f.uses += s.features[k]; }); });
    var featRows = Object.keys(feat).sort(function (a, b) { return feat[b].users - feat[a].users || feat[b].uses - feat[a].uses; });
    var functiesTab = '<div class="card"><h2>Welke onderdelen worden gebruikt?</h2><p class="muted small" style="margin:0.2rem 0 0.6rem;">Aantal spelers dat het onderdeel gebruikte (tussen haakjes: totaal aantal keer).</p>' +
      (featRows.length ? '<div class="dash-bars">' + featRows.map(function (k) {
        var max = feat[featRows[0]].users || 1;
        return '<div class="dash-bar"><span class="dash-bar-l">' + esc(FEATURE_LABELS[k] || k) + '</span><span class="dash-bar-t"><span style="width:' + Math.max(3, Math.round(feat[k].users / max * 100)) + '%"></span></span>' +
          '<span class="dash-bar-n tnum">' + feat[k].users + ' <span class="muted">(' + feat[k].uses + '×)</span></span></div>';
      }).join('') + '</div>' : '<p class="empty" style="padding:0;">Nog geen gebruiksgegevens. Die verschijnen zodra spelers met toestemming de app gebruiken.</p>') + '</div>';

    // --- Instellingen ---
    var instTab = '<div class="card"><h2>Gegevens voor de privacyverklaring</h2>' +
      '<p class="muted small" style="margin:0.2rem 0 0.4rem;">Deze gegevens staan in de privacyverklaring die elke speler kan lezen.</p>' +
      '<form id="privCfgForm"><label for="pc_naam">Naam of bedrijfsnaam</label><input type="text" id="pc_naam" maxlength="80" value="' + esc(cfg.naam || '') + '" placeholder="Bijv. Smash Padel B.V.">' +
      '<label for="pc_email">Contact-e-mailadres</label><input type="text" id="pc_email" maxlength="80" value="' + esc(cfg.email || '') + '" placeholder="privacy@…">' +
      '<label for="pc_kvk">KvK-nummer (optioneel)</label><input type="text" id="pc_kvk" maxlength="20" value="' + esc(cfg.kvk || '') + '">' +
      '<div id="pcMsg"></div><button class="btn small" type="submit">Opslaan</button></form></div>' +
      '<div class="card"><h2>Goed om te weten</h2><ul class="help-steps" style="margin:0;">' +
        '<li>Statistieken worden alleen bijgehouden van spelers van ' + MIN_AGE + '+ die toestemming gaven; zij kunnen dat altijd intrekken.</li>' +
        '<li>Deel met clubs alleen de clubrapporten (totalen), nooit deze spelerslijst.</li>' +
        '<li>Laat de privacyverklaring vóór de officiële lancering controleren door een privacy-jurist.</li>' +
        '<li>In deze testversie zijn de gewone app-gegevens (profielen, partijen) technisch leesbaar voor iedereen met toegang tot de app; alleen de gebruiksstatistieken zijn echt afgeschermd. Voor de lancering hoort Smash op een eigen server.</li>' +
      '</ul><a class="btn secondary small" href="#/privacy" style="margin-top:0.8rem;">Privacyverklaring bekijken</a></div>';

    body.innerHTML =
      pageHeadHtml('<span class="eyebrow">Alleen voor jou</span><h1>Eigenaar-dashboard</h1>' +
        '<p class="muted small" style="margin:0.2rem 0 0;">' + B.consenting.length + ' van ' + B.allOnboarded.length + ' spelers gaven toestemming · bijgewerkt ' + new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) + '</p>') +
      tabsetHtml('eigenaar', [
        { key: 'overzicht', label: 'Overzicht', html: '<div class="stack">' + overzicht + '</div>' },
        { key: 'clubs', label: 'Clubs', html: '<div class="stack">' + clubsTab + '</div>' },
        { key: 'spelers', label: 'Spelers' + countBadge(L.length), html: '<div class="stack">' + spelersTab + '</div>' },
        { key: 'functies', label: 'Functies', html: functiesTab },
        { key: 'instellingen', label: '⚙️', html: '<div class="stack">' + instTab + '</div>' }
      ], 'overzicht');

    // spelerslijst: zoeken + sorteren
    function sorted() {
      var by = body.querySelector('#dashSort').value;
      var q = body.querySelector('#dashSearch').value.trim().toLowerCase();
      return L.filter(function (s) {
        if (!q) return true;
        var hay = [s.p.name, s.p.username, s.p.city].concat(s.clubIds.map(function (c) { return S.clubsById[c].name; })).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      }).sort(function (a, b) {
        if (by === 'lastSeen') return String(b.lastSeen || '').localeCompare(String(a.lastSeen || ''));
        if (by === 'features') return b.featuresUsed - a.featuresUsed;
        return (b[by] || 0) - (a[by] || 0);
      });
    }
    function renderRows() {
      var rows = sorted();
      body.querySelector('#dashRows').innerHTML = rows.length ? rows.map(function (s) {
        var p = s.p;
        return '<tr data-pid="' + esc(p.id) + '"><td><strong>' + esc(p.name) + '</strong></td><td class="tnum">' + esc(p.age || '—') + '</td>' +
          '<td>' + esc(p.gender ? p.gender.charAt(0).toUpperCase() : '—') + '</td><td>' + esc(p.city || '—') + '</td><td class="tnum">' + fmtLevel(p.level) + '</td>' +
          '<td class="tnum">' + s.matches + '</td><td class="tnum">' + String(s.perWeek).replace('.', ',') + '</td><td class="tnum">' + s.posts + '</td><td class="tnum">' + s.invites + '</td>' +
          '<td class="tnum">' + s.featuresUsed + '</td><td>' + esc(s.favClub ? S.clubsById[s.favClub].name : '—') + '</td><td class="muted">' + fmtAgo(s.lastSeen) + '</td></tr>';
      }).join('') : '<tr><td colspan="12" class="empty">Geen spelers gevonden.</td></tr>';
    }
    renderRows();
    body.querySelector('#dashSearch').addEventListener('input', renderRows);
    body.querySelector('#dashSort').addEventListener('change', renderRows);
    body.querySelector('#dashRows').addEventListener('click', function (ev) {
      var tr = ev.target.closest('tr[data-pid]'); if (!tr) return;
      var s = L.filter(function (x) { return x.p.id === tr.getAttribute('data-pid'); })[0]; if (!s) return;
      var p = s.p;
      var featList = Object.keys(s.features).sort(function (a, b) { return s.features[b] - s.features[a]; }).map(function (k) { return { label: FEATURE_LABELS[k] || k, n: s.features[k] }; });
      openSheet(p.name,
        '<p class="muted small" style="margin-top:0;">@' + esc(p.username) + ' · ' + esc(p.email || p.id) + '</p>' +
        '<div class="dash-kpis">' +
          kpiHtml(p.age || '—', 'Leeftijd') + kpiHtml(esc(genderBucket(p.gender)), 'Geslacht') + kpiHtml(esc(p.city || '—'), 'Woonplaats') +
          kpiHtml(fmtLevel(p.level), 'Niveau') + kpiHtml(s.matches, 'Partijen', s.wins + ' gewonnen') + kpiHtml(String(s.perWeek).replace('.', ','), 'Per week', 'gem. laatste 90 d') +
          kpiHtml(s.posts, 'Posts', s.photos + ' met foto') + kpiHtml(s.invites, 'Uitnodigingen', s.plans + ' planningen') + kpiHtml(s.activeDays, 'Dagen actief', s.activeDays30 + ' in 30 d') +
          kpiHtml(s.orders, 'Bestellingen', '€' + s.spend.toFixed(2)) + kpiHtml(s.events, 'Evenementen', 'aanmeldingen') + kpiHtml(s.sessions, 'Bezoeken', 'sinds ' + (s.firstSeen ? s.firstSeen.slice(0, 10) : '—')) +
        '</div>' +
        '<h3 class="sheet-sub" style="margin-top:1rem;">Clubs</h3>' + barsHtml(s.clubIds.map(function (c) { return { label: S.clubsById[c].name + ((p.homeClubIds || []).indexOf(c) !== -1 ? ' (thuisclub)' : ''), n: s.clubs[c] }; })) +
        '<p class="hint" style="margin:0.3rem 0 0;">Getal = gelogde partijen bij die club.</p>' +
        '<h3 class="sheet-sub" style="margin-top:1rem;">Gebruikte functies</h3>' + barsHtml(featList) +
        '<p class="muted small" style="margin:0.8rem 0 0;">Toestemming gegeven op ' + esc(String(p.analyticsConsentAt || '').slice(0, 10) || '—') + '.</p>');
    });
    body.querySelector('#dashCsv').addEventListener('click', async function () {
      var head = ['naam', 'gebruikersnaam', 'leeftijd', 'geslacht', 'woonplaats', 'niveau', 'partijen', 'partijen_90d', 'per_week', 'gewonnen', 'posts', 'fotos', 'uitnodigingen', 'planningen',
        'functies_gebruikt', 'keer_functies', 'dagen_actief', 'dagen_actief_30d', 'bezoeken', 'favoriete_club', 'alle_clubs', 'bestellingen', 'besteed_eur', 'evenementen', 'laatst_actief'];
      var lines = [head.join(';')].concat(sorted().map(function (s) {
        var p = s.p;
        return [p.name, p.username, p.age, p.gender, p.city, fmtLevel(p.level), s.matches, s.matches90, String(s.perWeek).replace('.', ','), s.wins, s.posts, s.photos, s.invites, s.plans,
          s.featuresUsed, s.featureUses, s.activeDays, s.activeDays30, s.sessions, s.favClub ? S.clubsById[s.favClub].name : '',
          s.clubIds.map(function (c) { return S.clubsById[c].name; }).join(', '), s.orders, s.spend.toFixed(2).replace('.', ','), s.events, s.lastSeen ? s.lastSeen.slice(0, 10) : ''].map(csvCell).join(';');
      }));
      await saveFile('smash-spelers-' + localYmd(new Date()) + '.csv', '﻿' + lines.join('\n'), 'text/csv');
    });

    // clubrapporten
    body.querySelectorAll('[data-report]').forEach(function (b) {
      b.addEventListener('click', function () {
        var R = clubReportData(B, b.getAttribute('data-report'));
        var sb = openSheet('Rapport — ' + R.club.name,
          (!R.enough
            ? '<div class="banner warn" style="margin:0 0 0.8rem;">Nog maar ' + R.players.length + ' speler(s) met een band met deze club. Vanaf ' + CLUB_REPORT_MIN + ' kun je het rapport delen; tot die tijd zou iemand herkenbaar kunnen zijn.</div>' : '') +
          '<div class="dash-kpis">' + kpiHtml(R.players.length, 'Spelers', R.active30 + ' actief (30 d)') + kpiHtml(R.matchCount, 'Partijen', 'gelogd bij deze club') + '</div>' +
          '<div class="stack" style="gap:0.6rem; margin-top:0.8rem;">' +
            '<details class="acc" open><summary>Leeftijd & geslacht</summary><div class="acc-body">' + barsHtml(R.age, { pct: true }) + '<div style="height:0.6rem"></div>' + barsHtml(R.gender, { pct: true }) + '</div></details>' +
            '<details class="acc"><summary>Niveau</summary><div class="acc-body">' + barsHtml(R.level, { pct: true }) + '</div></details>' +
            '<details class="acc"><summary>Woonplaats</summary><div class="acc-body">' + barsHtml(R.city, { pct: true, limit: 8 }) + '</div></details>' +
            '<details class="acc"><summary>Drukste dagen & tijden</summary><div class="acc-body">' + barsHtml(R.weekday) + '<div style="height:0.6rem"></div>' + barsHtml(R.hours) + '</div></details>' +
            '<details class="acc"><summary>Partijen per maand</summary><div class="acc-body">' + barsHtml(R.months) + '</div></details>' +
            '<details class="acc"><summary>Spelers spelen ook bij</summary><div class="acc-body">' + barsHtml(R.alsoPlays) + '</div></details>' +
          '</div>' +
          (R.enough
            ? '<div class="row-actions" style="flex-wrap:wrap;"><button type="button" class="btn small" id="repCopy">Kopieer rapport</button><button type="button" class="btn secondary small" id="repSave">⬇️ Download</button></div><p class="small" id="repMsg" hidden></p>'
            : ''));
        var txt = clubReportText(R);
        var copyB = sb.querySelector('#repCopy');
        if (copyB) copyB.addEventListener('click', async function () {
          var ok = await copyText(txt);
          var m = sb.querySelector('#repMsg'); m.hidden = false; m.textContent = ok ? '✓ Gekopieerd — plak het in een mail of WhatsApp aan de club.' : 'Kopiëren lukte niet, gebruik Download.';
        });
        var saveB = sb.querySelector('#repSave');
        if (saveB) saveB.addEventListener('click', function () {
          saveFile('smash-rapport-' + R.club.id + '-' + localYmd(new Date()) + '.txt', txt, 'text/plain');
        });
      });
    });

    // instellingen privacyverklaring
    body.querySelector('#privCfgForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var msg = body.querySelector('#pcMsg');
      try {
        await S.db.doc('config/privacy').set({
          naam: body.querySelector('#pc_naam').value.trim(), email: body.querySelector('#pc_email').value.trim(),
          kvk: body.querySelector('#pc_kvk').value.trim(), updatedAt: new Date().toISOString()
        });
        msg.innerHTML = '<p class="small" style="margin:0.6rem 0 0; font-weight:700; color:var(--court-strong);">✓ Opgeslagen</p>';
      } catch (e) { msg.innerHTML = '<p class="banner error" style="margin:0.6rem 0 0;">Opslaan lukte niet.</p>'; }
    });
  }

  // ---------- router ----------

  async function route() {
    if (!S.db) return;
    var hash = location.hash.replace(/^#/, '') || '/';
    var qIndex = hash.indexOf('?');
    var path = qIndex === -1 ? hash : hash.slice(0, qIndex);
    var params = new URLSearchParams(qIndex === -1 ? '' : hash.slice(qIndex + 1));

    stopPlanSubscriptions();

    // Planning-links (#/plan/CODE) werken voor iedereen: ingelogd, gast of zonder account.
    if (path.indexOf('/plan/') === 0 && path !== '/plan/nieuw') {
      if (S.player) trackNav(location.hash);
      return viewPlan(path.slice(6), params);
    }

    if (path === '/privacy') { if (S.player) trackNav(location.hash); return viewPrivacy(); }
    if (path === '/inloggen') return renderAuthGate('login');
    if (path === '/registreren') return renderAuthGate('register');

    // Zodra je deze pagina-laadbeurt eenmaal ingelogd bent (S.playerId staat), nooit meer
    // terugvallen op de inlogpagina puur omdat een latere lezing van de browseropslag toevallig
    // niets teruggeeft (bijv. omdat de telefoon de tab op de achtergrond heeft opgeschoond) —
    // dat zorgde er eerder voor dat je soms al na een paar minuten weer moest inloggen terwijl
    // je nooit zelf had uitgelogd.
    if (!S.playerId && !sessionEmail() && !S.isGuest) return renderAuthGate('login');

    if (S.isGuest) {
      trackNav(location.hash || '#/');
      if (path === '/' || path === '') return viewAlgemeenGuest();
      if (path === '/clubs') return viewClubsList();
      if (path === '/clubkaart') return viewClubsKaart();
      if (path.indexOf('/clubs/') === 0) return viewClubPublic(path.slice(7));
      if (path === '/zoeken') return viewSearch(params);
      if (path === '/feed') return viewFeed(params);
      if (path === '/shop') return viewShop();
      if (path === '/baan-huren') return viewBookPick();
      return viewGuestBlocked();
    }

    if (!S.player) { viewOnboarding(); return; }
    if (!S.player.onboardingComplete) { viewOnboarding(); return; }

    trackNav(location.hash || '#/');
    trackFeature(featureOf(path));

    if (path === '/eigenaar') return viewOwner();
    if (path === '/' || path === '') return viewHome();
    if (path === '/feed') return viewFeed(params);
    if (path === '/kies-club') return viewPickClub(params.get('doel'));
    if (path === '/baan-huren') return viewBookPick();
    if (path === '/ranglijst') return viewRanglijstAlgemeen(params);
    if (path.indexOf('/vriendengroep/') === 0) return viewFriendGroup(path.slice(15));
    if (path === '/spelen') return viewSpelenAlgemeen();
    if (path === '/plan/nieuw') return viewPlanNew(params);
    if (path.indexOf('/club/') === 0) {
      var rest = path.slice(6);
      if (rest.slice(-5) === '/feed') return viewClubFeed(rest.slice(0, -5));
      if (rest.slice(-10) === '/ranglijst') return viewRanglijstClub(rest.slice(0, -10));
      if (rest.slice(-7) === '/spelen') return viewSpelenClub(rest.slice(0, -7));
      if (rest.slice(-7) === '/boeken') return viewBooking(rest.slice(0, -7));
      return viewClubFeed(rest);
    }
    if (path === '/clubs') return viewClubsList();
    if (path === '/clubkaart') return viewClubsKaart();
    if (path.indexOf('/clubs/') === 0) return viewClubPublic(path.slice(7));
    if (path === '/zoeken') return viewSearch(params);
    if (path === '/partij/nieuw') return viewMatchNew(params.get('club'));
    if (path === '/te-bevestigen') return viewPending();
    if (path === '/profiel') return viewProfile();
    if (path === '/shop') return viewShop();
    if (path === '/chat') return viewChatList();
    if (path.indexOf('/groepschat/') === 0) return viewGroupChatThread(path.slice(12));
    if (path.indexOf('/chat/') === 0) return viewChatThread(path.slice(6));
    return viewHome();
  }

  window.addEventListener('hashchange', route);

  async function boot() {
    var claude = window.claude;
    var db = claude ? await claude.use('db') : null;
    if (!db) {
      document.getElementById('app').innerHTML =
        '<main style="max-width:560px;margin:3rem auto;"><div class="card"><h1>Database niet beschikbaar</h1>' +
        '<p class="muted">Deze weergave kan de gedeelde database niet bereiken. Open de gepubliceerde pagina rechtstreeks (niet in een voorbeeldvenster) en probeer opnieuw.</p></div></main>';
      return;
    }
    S.db = db;
    S.userCap = claude ? await claude.use('user') : null;
    await loadClubs();
    await ensureProductsSeeded();
    await Promise.all(S.clubsList.map(function (c) { return ensureEventsSeeded(c.id); }));

    // Eerst lokaal (dit apparaat/browser) kijken, en als daar niets staat — bijvoorbeeld
    // omdat je de link net vanuit de Claude-app/-website opende — terugvallen op de
    // gesynchroniseerde sessie die aan je Claude.ai-account hangt.
    var savedEmail = sessionEmail();
    if (!savedEmail) savedEmail = await loadSyncedSessionEmail();
    if (savedEmail) {
      S.playerId = savedEmail;
      try {
        await loadAllPlayers();
        await loadPlayer();
        // Alleen echt uitloggen als de opzoekactie is gelukt én er écht geen account meer
        // bestaat — nooit bij een fout/tijdelijk verbindingsprobleem (zie catch hieronder).
        if (!S.player) { clearSession(); clearSyncedSession(); S.playerId = null; }
        else { setSessionEmail(savedEmail); } // ook lokaal onthouden nu we hem toch kennen
      } catch (e) {
        // Kon de opgeslagen sessie niet controleren (bijv. even geen verbinding, of de
        // Claude.ai-sessie voor de database moest ververst worden). Voorheen werd dit
        // per ongeluk gezien als "account bestaat niet" en werd je dan uitgelogd — dat
        // gebeurt nu niet meer: je inlog blijft gewoon bewaard, ververs de pagina om
        // het opnieuw te proberen.
        console.error('Kon opgeslagen sessie niet laden, sessie blijft bewaard:', e);
        S.playerId = null; S.player = null;
        document.getElementById('app').innerHTML =
          '<main style="max-width:560px;margin:3rem auto;"><div class="card"><h1>Even geen verbinding</h1>' +
          '<p class="muted">Kon je opgeslagen sessie niet laden. Je hoeft niet opnieuw in te loggen — ververs de pagina om het nog eens te proberen.</p>' +
          '<button class="btn" type="button" id="retryBootBtn">Pagina verversen</button></div></main>';
        var retryBtn = document.getElementById('retryBootBtn');
        if (retryBtn) retryBtn.addEventListener('click', function () { location.reload(); });
        return;
      }
    }
    route();
  }

  boot();
})();
</script>

</body></html>
